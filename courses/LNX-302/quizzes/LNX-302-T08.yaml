title: 'Quiz: Ansible managing Windows'
questions:
- id: plugins
  prompt: Which connection plugins manage Windows nodes?
  choices:
  - psrp, winrm and ssh
  - only local
  - only ssh
  - network_cli
  answer:
  - 0
  explain: All three work; ssh is officially supported from 2.18. network_cli is for network devices.
- id: python
  prompt: Why can the built-in command and shell modules not run on Windows?
  choices:
  - They are deprecated
  - They need a Python and POSIX shell on the target
  - Windows lacks networking
  - Licence
  answer:
  - 1
  explain: Windows modules are PowerShell; use win_command, win_shell and the win_ modules.
- id: idem
  prompt: A task using win_shell reports changed every run. Best remedy?
  choices:
  - Ignore it
  - Use a proper module or set changed_when
  - Disable check mode
  - Add become
  answer:
  - 1
  explain: win_shell cannot know whether it changed anything, so idempotence must be expressed or avoided.
- id: hop
  prompt: What is the double hop?
  choices:
  - Two firewalls
  - Two playbooks
  - A remote session cannot use its identity to reach a third server because no credentials are delegated
  - Two reboots
  answer:
  - 2
  explain: 'Network logons carry no delegable credential. Solutions: become with explicit credentials, constrained delegation,
    CredSSP for that task, or fetch via the control node.'
- id: kerb
  prompt: A play using an IP in the inventory fails with Server not found in Kerberos database. Fix?
  choices:
  - Use Basic
  - Disable Kerberos
  - Reboot
  - Use the FQDN that has a service principal
  answer:
  - 3
  explain: Kerberos needs a name. Basic over HTTP is the insecure shortcut.
- id: cert
  prompt: Why not set certificate validation to ignore?
  choices:
  - It slows tasks
  - It disables Kerberos
  - It removes protection against interception; fix the trust store instead
  - It breaks idempotence
  answer:
  - 2
  explain: Ignoring validation hides a name or CA problem and permits man-in-the-middle attacks.
- id: mixed
  prompt: Group policy and Ansible both set one registry key. What happens?
  choices:
  - Each run overwrites the other and reports changed
  - The playbook fails to parse
  - Nothing
  - Windows refuses both
  answer:
  - 0
  explain: Decide a single owner per setting.
