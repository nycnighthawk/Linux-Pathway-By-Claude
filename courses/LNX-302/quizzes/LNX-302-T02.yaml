title: 'Quiz: winbind vs SSSD members'
questions:
- id: join
  prompt: Which condition is least likely to be checked before a realm join, yet causes many failures?
  choices:
  - The number of users
  - The colour of the console
  - Clock within five minutes and DNS SRV records reachable through a DC
  - The CPU model
  answer:
  - 2
  explain: Kerberos rejects skewed clocks and discovery uses SRV records, so these are the usual causes. The others have no
    effect on joining.
- id: idmap-rid
  prompt: What is a property of the rid idmap back-end?
  choices:
  - It needs no range
  - The id is range base plus the RID, identical on every host with the same range
  - It allocates ids first come first served
  - It reads uidNumber from AD
  answer:
  - 1
  explain: rid computes ids from the SID, so matching ranges give matching ids and no directory attributes are needed. Reading
    uidNumber is the ad back-end, first-come allocation is tdb, and every back-end needs a range.
- id: default-domain
  prompt: 'Why is idmap config * : backend = tdb needed even if the real domain uses rid?'
  choices:
  - rid cannot be used with SSSD
  - It is only cosmetic
  - tdb is faster
  - The default domain covers local and well-known SIDs and needs a writable back-end
  answer:
  - 3
  explain: BUILTIN and other well-known SIDs map through the default domain, which must allocate on demand. Speed is not the
    reason, rid works with winbind, and omitting it breaks lookups.
- id: sssd-ids
  prompt: Two hosts run SSSD with default ldap_id_mapping = True and the same range. What follows?
  choices:
  - The same user gets the same uid on both
  - Each host chooses randomly
  - No uid is assigned
  - Ids come from uidNumber
  answer:
  - 0
  explain: Algorithmic mapping derives the uid from the domain SID within a slice, so identical settings agree. It is not
    random and it does not read POSIX attributes unless mapping is turned off.
- id: tool
  prompt: Which command checks the machine's trust secret with a domain controller on a winbind member?
  choices:
  - sss_cache -E
  - wbinfo -t
  - realm list
  - getent passwd
  answer:
  - 1
  explain: wbinfo -t tests the trust secret. getent passwd resolves names, realm list shows realmd status, and sss_cache invalidates
    the SSSD cache.
- id: rejoin
  prompt: A host powered off for three months now rejects every AD login. Most probable cause?
  choices:
  - The machine account password was rotated while it was away
  - SELinux relabel
  - The DC was demoted
  - A user typo
  answer:
  - 0
  explain: Machine passwords rotate roughly every 30 days; an old secret breaks the secure channel. sssctl domain-status or
    net ads testjoin shows it, and rejoin fixes it. A typo affects one user, not all.
- id: clone
  prompt: Why join a VM template before cloning is a mistake?
  choices:
  - Kerberos forbids more than one host
  - DNS cannot hold cloned names
  - It makes the image larger
  - All clones share one machine account and keys and fight over it
  answer:
  - 3
  explain: Clones inherit the same computer object and keys, so they invalidate each other. Size is irrelevant and DNS can
    hold distinct names once each host rejoins.
