title: 'Quiz: AD DNS and time'
questions:
- id: srv
  prompt: Which record type does a client use to find domain controllers?
  choices:
  - TXT only
  - PTR only
  - MX
  - SRV
  answer:
  - 3
  explain: AD publishes service locations as SRV records such as _ldap._tcp.dc._msdcs.<domain>. MX is for mail and PTR for
    reverse lookup.
- id: second-ns
  prompt: Why is a router as second nameserver harmful on a member?
  choices:
  - It blocks UDP
  - It needs a licence
  - It is slower
  - It answers NXDOMAIN for AD SRV queries when the DC is unreachable
  answer:
  - 3
  explain: A resolver that knows nothing of the domain gives an authoritative-looking negative answer, and SSSD goes offline.
    Use two DCs as the two nameservers.
- id: skew
  prompt: What is the default maximum Kerberos clock skew?
  choices:
  - 10 hours
  - 1 hour
  - 30 seconds
  - 5 minutes
  answer:
  - 3
  explain: Five minutes by default. Ten hours is the usual ticket lifetime, a different concept.
- id: signd
  prompt: What does ntpsigndsocket let a Samba DC do?
  choices:
  - Encrypt DNS
  - Sync files
  - Create users
  - Have chrony obtain signed time responses that Windows clients expect
  answer:
  - 3
  explain: The socket asks Samba to sign NTP replies for MS-SNTP. It has no relation to DNS, files or users.
- id: owner
  prompt: A DHCP server created a host's A record first and now the host's own update is denied. Why?
  choices:
  - DNS forbids two updates
  - The record has expired
  - Secure updates give the record to its creator, who alone may change it
  - DHCP is read-only
  answer:
  - 2
  explain: Ownership follows the identity that created the record. Use one registrar.
- id: rename
  prompt: Which statement about the AD DNS domain name is correct?
  choices:
  - It can be changed with samba-tool rename
  - It cannot be renamed in place, so choose it with care
  - Using .local is recommended
  - It must equal the hostname
  answer:
  - 1
  explain: Neither Windows nor Samba renames the zone or realm in place; .local collides with mDNS.
- id: resolved
  prompt: How do you send only the AD domain to the DCs with systemd-resolved?
  choices:
  - Use only nscd
  - Edit /etc/hosts
  - resolvectl dns and resolvectl domain with a ~ routing domain on the link
  - Disable DNS
  answer:
  - 2
  explain: A routing domain (~acme.example) sends that suffix to the link's DNS servers. /etc/hosts cannot hold SRV records.
