title: 'Quiz: NFSv4 with Kerberos'
questions:
- id: authsys
  prompt: Why is AUTH_SYS weak?
  choices:
  - It needs Kerberos
  - It uses UDP only
  - It encrypts with DES
  - The server trusts the uid the client claims
  answer:
  - 3
  explain: Root on any client can claim any uid. RPCSEC_GSS fixes that.
- id: flavours
  prompt: What does krb5p add over krb5i?
  choices:
  - Encryption of the payload
  - Authentication
  - Integrity
  - Compression
  answer:
  - 0
  explain: krb5 authenticates, krb5i adds integrity checksums, krb5p adds privacy by encryption.
- id: principals
  prompt: Which principals does the setup need?
  choices:
  - None
  - Only user principals
  - krbtgt on clients
  - nfs/ on the server and host/ on clients, with AES keys
  answer:
  - 3
  explain: The server needs an nfs/ service key; clients need a machine principal to mount at boot.
- id: nobody
  prompt: Files show owner nobody although kinit succeeded. Likeliest cause?
  choices:
  - Signing
  - Wrong port
  - The KDC is down
  - The idmap domain strings differ between client and server
  answer:
  - 3
  explain: NFSv4 owner strings user@domain must match; set the same Domain and clear with nfsidmap -c.
- id: v3
  prompt: Why disable NFSv3 on a Kerberos-only server?
  choices:
  - It uses TCP
  - Its auxiliary protocols remain insecure
  - It lacks locking
  - It is slower
  answer:
  - 1
  explain: Kerberos covers v3 incompletely and idmapping is absent.
- id: port
  prompt: Which port does NFSv4 need?
  choices:
  - TCP 88 only on server
  - UDP 111 only
  - TCP 445
  - TCP 2049
  answer:
  - 3
  explain: NFSv4 folds mount, lock and status into one port; Kerberos itself uses 88 to the KDC.
- id: expire
  prompt: A user job loses NFS access after ten hours. Fix?
  choices:
  - Raise timeo
  - Reboot
  - Use sec=sys
  - Use a keytab-backed service identity or renewal tool
  answer:
  - 3
  explain: The ticket expired; sec=sys removes authentication.
