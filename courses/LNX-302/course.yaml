id: LNX-302
title: Mixed Environments
summary: 'Linux and Windows in one estate: a Samba file server, winbind and SSSD members, Samba AD replication, Kerberos SMB
  clients, AD DNS and time, OpenSSH and PowerShell 7 on Windows, Windows clients and printing, Ansible for Windows, NFSv4
  with Kerberos and operating Linux inside a real AD.'
hours: 50
coverage: full
outcomes:
- Configure and harden a Samba file server with POSIX or Windows ACLs
- Join Linux hosts to Active Directory with winbind or SSSD and choose an id-mapping strategy
- Run and inspect additional Samba domain controllers, SYSVOL and FSMO roles
- Mount SMB and NFSv4 shares with Kerberos and no stored password
- Keep AD DNS and time correct for Linux members
- Reach and automate Windows servers from Linux with OpenSSH, PowerShell 7 and Ansible
- Serve Windows clients with mapped drives and printers
- Operate a Linux fleet inside an existing AD estate
