title: 'Quiz: kubeadm and HA'
questions:
- id: two-nodes
  prompt: A team runs a two-node stacked control plane. What failure tolerance does the datastore have?
  choices: [One node can fail, Two nodes can fail, None, It depends on the load balancer]
  answer: [2]
  explain: 'A) wrong: quorum of two is two. B) wrong: impossible with two members. C) correct: either node loss stops writes. D) wrong: a load balancer cannot create quorum.'
- id: hash
  prompt: What does the discovery CA hash in kubeadm join protect against?
  choices: [Disk corruption in etcd, Pod network misconfiguration, A joining node trusting an impostor API endpoint, Token expiry]
  answer: [2]
  explain: 'A) wrong: unrelated. B) wrong: unrelated. C) correct: the node verifies the CA public key before sending its token. D) wrong: expiry is separate.'
- id: endpoint
  prompt: Why set controlPlaneEndpoint at init time?
  choices: [It puts a stable address into certificates and kubeconfigs so more control-plane nodes can be added later, It enables swap, It selects the container runtime, kube-proxy requires it]
  answer: [0]
  explain: 'A) correct: later HA needs an address that outlives any node. B) wrong: unrelated. C) wrong: the runtime is set elsewhere. D) wrong: it does not.'
- id: notready
  prompt: After kubeadm init the node is NotReady and CoreDNS is Pending. Most likely cause?
  choices: [The token expired, etcd is corrupted, Swap is enabled, No pod network plugin is installed]
  answer: [3]
  explain: 'A) wrong: tokens only matter for joins. B) wrong: the API works. C) wrong: swap would stop the kubelet, not leave DNS pending. D) correct: without a CNI plugin pods cannot get networking.'
- id: join-order
  prompt: Which are good practice when adding control-plane nodes? (select two)
  choices: [Reuse a cloned VM with the same machine id, Join all at once to save time, Join them one at a time, Verify etcd membership after each join]
  answer: [2, 3]
  explain: 'A) wrong: duplicate identities collide. B) wrong: simultaneous membership changes risk quorum trouble. C) correct: each join changes etcd membership. D) correct: confirm the member list before the next join.'
