title: 'Quiz: Storage'
questions:
- id: binding
  prompt: Why use WaitForFirstConsumer with zonal disks?
  choices: [It makes the disk faster, It prevents expansion, The disk is created in the zone where the pod was scheduled, It enables ReadWriteMany]
  answer: [2]
  explain: 'A) wrong: speed is unchanged. B) wrong: unrelated. C) correct: provisioning waits for a scheduling decision. D) wrong: access mode is separate.'
- id: retain
  prompt: A claim bound to a Retain volume is deleted. What is the volume's state?
  choices: [Deleted along with its disk, Bound to the next claim, Released and not claimable until cleaned manually, Available immediately for reuse]
  answer: [2]
  explain: 'A) wrong: that is Delete. B) wrong: it cannot bind again as is. C) correct: an administrator must clear it. D) wrong: it still references the old claim.'
- id: rwx
  prompt: Pods on several nodes must write to the same volume at the same time. Which mode is needed, and who can supply it?
  choices: [ReadWriteMany from a shared filesystem or distributed back end, ReadWriteOncePod from NFS, ReadWriteOnce on any cloud block disk, ReadOnlyMany from any disk]
  answer: [0]
  explain: 'A) correct. B) wrong: it restricts to a single pod. C) wrong: a block disk attaches to one node. D) wrong: read-only.'
- id: shrink
  prompt: Which are true about volume expansion? (select two)
  choices: [The class must set allowVolumeExpansion, Shrinking a claim is not supported, Expansion needs a new StorageClass, The pod must be deleted first in every driver]
  answer: [0, 1]
  explain: 'A) correct. B) correct. C) wrong: the existing class is enough. D) wrong: many drivers expand online.'
- id: csi
  prompt: A claim stays Pending and no volume appears. Which log do you read first?
  choices: [The scheduler only, kube-proxy, The CSI controller provisioner sidecar and the claim's events, The node plugin DaemonSet]
  answer: [2]
  explain: 'A) wrong: with immediate binding the scheduler is not involved. B) wrong: networking. C) correct: provisioning is the controller side. D) wrong: it handles mounting.'
