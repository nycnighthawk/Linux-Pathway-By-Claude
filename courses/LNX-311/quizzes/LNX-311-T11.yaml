title: 'Quiz: Managed Kubernetes'
questions:
- id: responsibility
  prompt: Which is the customer's responsibility in all three managed services?
  choices: [Running etcd, Backing up application data in persistent volumes, Patching the API server, Renewing control-plane certificates]
  answer: [1]
  explain: 'A) wrong: provider. B) correct: the provider backs up the control plane, not your data. C) wrong: provider. D) wrong: provider.'
- id: auth-plugin
  prompt: Why does kubectl against a managed cluster need the provider CLI?
  choices: [To install nodes, The kubeconfig calls an external credential plugin to get a token, To download images, To run etcdctl]
  answer: [1]
  explain: 'A) wrong. B) correct: client-go credential plugins fetch cloud tokens. C) wrong. D) wrong: etcd is not reachable.'
- id: workload-identity
  prompt: What is the main benefit of workload identity federation?
  choices: [Faster pods, Pods obtain short-lived cloud credentials without stored keys, Free load balancers, Automatic RBAC]
  answer: [1]
  explain: 'A) wrong. B) correct: projected token exchanged for scoped credentials. C) wrong. D) wrong.'
- id: hardening
  prompt: Which are sensible hardening steps for a managed cluster? (select two)
  choices: [Restrict or privatise the API endpoint, Block pod access to the instance metadata service, Leave audit logging off to save cost, Share one admin kubeconfig]
  answer: [0, 1]
  explain: 'A) correct. B) correct: stops pods borrowing node credentials. C) wrong: you need audit data. D) wrong: no accountability.'
- id: lifecycle
  prompt: A Kubernetes minor reaches the end of standard support on a managed service. What may happen?
  choices: [Nothing ever, The cluster is upgraded automatically or moves to paid extended support, The control plane is deleted immediately, The provider keeps patching it free forever]
  answer: [1]
  explain: 'A) wrong. B) correct: depends on provider and settings. C) wrong: not immediately. D) wrong.'
