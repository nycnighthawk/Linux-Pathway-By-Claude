title: 'Quiz: etcd backup and restore'
questions:
- id: order
  prompt: What is the documented order for restoring etcd when API servers exist?
  choices: [Restore etcd first, then stop the API servers, Stop all API servers, restore etcd members, start the API servers, Restart only the scheduler, Delete the etcd pods and wait]
  answer: [1]
  explain: 'A) wrong: API servers with newer watch caches confuse controllers. B) correct: quiesce writers, restore, then resume. C) wrong: it does not restore data. D) wrong: it restores nothing.'
- id: nospace
  prompt: etcd raised a NOSPACE alarm. What is true?
  choices: [Writes are refused while reads may still work, The cluster stops all running containers, Pods are evicted from every node, The API server restarts itself and fixes it]
  answer: [0]
  explain: 'A) correct: the store goes read-only until compaction, defragmentation and clearing the alarm. B) wrong: running containers are unaffected. C) wrong: nodes do not evict for this. D) wrong: it requires operator action.'
- id: single-member
  prompt: Which is a correct statement about etcdctl snapshot save?
  choices: [It must be run on every member, It needs the member endpoint and TLS client credentials and one healthy member is enough, It only works while the cluster is stopped, It saves only the Secrets]
  answer: [1]
  explain: 'A) wrong: one member gives a consistent point-in-time snapshot. B) correct: use the etcd CA, certificate and key. C) wrong: it streams from a live member. D) wrong: it saves the whole keyspace.'
- id: limits
  prompt: After restoring a three-hour-old snapshot, which problems are expected? (select two)
  choices: [Objects created in the last three hours are missing from the API, PersistentVolumes provisioned in that time exist in the cloud but not in the API, All certificates are renewed automatically, The Kubernetes version is downgraded]
  answer: [0, 1]
  explain: 'A) correct: the restore is a rollback of records. B) correct: orphaned volumes leak. C) wrong: restore does not renew certificates. D) wrong: versions are unchanged.'
- id: secrets
  prompt: Why must etcd snapshots be encrypted and access controlled?
  choices: [They are large, They contain every Secret in the cluster, They are written in a proprietary format, They slow the API server]
  answer: [1]
  explain: 'A) wrong: size is not the reason. B) correct: unless encrypted at rest they hold Secrets in plain text, and the key sits on the same host. C) wrong: format is open. D) wrong: unrelated.'
