title: 'Quiz: Upgrades, drain and cordon'
questions:
- id: skew
  prompt: Which kubelet version is NOT allowed against an API server at minor version 1.35?
  choices: ['1.32', '1.36', '1.35', '1.34']
  answer: [1]
  explain: 'A) allowed in current releases, within three minors (verify for your version). B) correct: a kubelet must never be newer than the API server. C) allowed: same version. D) allowed: older.'
- id: hang
  prompt: kubectl drain hangs. A PDB shows minAvailable 3 on a 3-replica deployment. What is the best fix?
  choices: [Delete the node object, Use --disable-eviction, Change the budget to maxUnavailable 1 or add replicas, Restart the kubelet]
  answer: [2]
  explain: 'A) wrong: it orphans pods without a safe move. B) wrong: it bypasses the owner''s protection. C) correct: leave room for one voluntary disruption. D) wrong: the budget, not the kubelet, blocks.'
- id: rollback
  prompt: What is the supported rollback after a bad control-plane upgrade?
  choices: [kubeadm downgrade, Uncordon all nodes, Delete the kube-system namespace, Restore the pre-upgrade etcd snapshot onto control-plane nodes at the old version]
  answer: [3]
  explain: 'A) wrong: there is no supported control-plane downgrade. B) wrong: unrelated. C) wrong: destructive. D) correct: snapshot plus old binaries.'
- id: cordon
  prompt: What does kubectl cordon do?
  choices: [Stops new pods from being scheduled while existing pods keep running, Deletes the node, Evicts all pods, Upgrades the kubelet]
  answer: [0]
  explain: 'A) correct: it marks the node unschedulable. B) wrong: it keeps the object. C) wrong: that is drain. D) wrong: it changes no software.'
- id: drain-flags
  prompt: Which are normal flags when draining a worker? (select two)
  choices: [--skip-quorum, --ignore-daemonsets, --force-delete-etcd, --delete-emptydir-data]
  answer: [1, 3]
  explain: 'A) not a flag. B) correct: DaemonSet pods would return at once. C) not a flag. D) correct: acknowledges loss of emptyDir data.'
