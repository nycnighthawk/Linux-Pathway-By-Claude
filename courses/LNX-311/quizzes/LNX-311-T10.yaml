title: 'Quiz: Troubleshooting'
questions:
- id: exit137
  prompt: A container was last terminated with exit code 137 and reason OOMKilled. What is the most likely cause?
  choices: [The image could not be pulled, A DNS failure, A failed readiness probe, The memory limit was exceeded]
  answer: [3]
  explain: 'A) wrong: pull errors prevent starting. B) wrong: DNS does not kill processes. C) wrong: probes restart with other reasons. D) correct: signal 9 from the kernel memory killer.'
- id: node-not-ready
  prompt: A node is NotReady and the kubelet log says it cannot reach the runtime socket. Where next?
  choices: [kube-proxy rules, kubectl logs of the scheduler, systemctl status and journal of the container runtime on the node, The HPA]
  answer: [2]
  explain: 'A) wrong: networking rules are unrelated. B) wrong. C) correct: the runtime is down or misconfigured. D) wrong: unrelated.'
- id: noendpoints
  prompt: Which can leave a Service without endpoints? (select two)
  choices: [All matching pods fail readiness, The selector matches no pod labels, The Service has a ClusterIP, CoreDNS is running]
  answer: [1, 0]
  explain: 'A) correct: only ready pods are endpoints. B) correct. C) wrong: normal. D) wrong: unrelated.'
- id: api-down
  prompt: kubectl cannot reach the API. Which tool still works on the control-plane node?
  choices: [crictl ps -a and crictl logs, kubectl top, helm list, kubectl get pods]
  answer: [0]
  explain: 'A) correct: talks to the runtime socket. B) wrong: needs the API. C) wrong: needs the API. D) wrong: needs the API.'
- id: evidence
  prompt: What should you do before restarting a misbehaving pod or node?
  choices: [Nothing, restart quickly, Capture describe output, logs (including --previous) and the node journal, Delete the namespace, Upgrade the cluster]
  answer: [1]
  explain: 'A) wrong: evidence is lost. B) correct. C) wrong: destructive. D) wrong: adds variables.'
