title: 'Quiz: Architecture'
questions:
- id: etcd-access
  prompt: Which component is the only one that should read and write etcd directly?
  choices: [kube-scheduler, kube-controller-manager, kubelet, kube-apiserver]
  answer: [3]
  explain: 'A) wrong: it reads and writes through the API. B) wrong: controllers also use the API. C) wrong: the kubelet is an API client. D) correct: the API server is the single gateway to the store.'
- id: control-plane-down
  prompt: The whole control plane is stopped. What happens to pods already running on workers?
  choices: [They keep running but nothing can change them, They are rescheduled to the control-plane nodes, They stay running and are still replaced if they crash through the control plane, They are killed at once]
  answer: [0]
  explain: 'A) correct: existing containers run on, but no new scheduling or reconciling occurs. B) wrong: nothing schedules without the scheduler. C) wrong: crash replacement across nodes needs controllers; only the kubelet restarts containers in place. D) wrong: the kubelet and runtime keep containers alive.'
- id: scheduler-output
  prompt: What is the scheduler's only output?
  choices: [A binding of a pod to a node written through the API, A kubelet configuration file, A running container, A new ReplicaSet]
  answer: [0]
  explain: 'A) correct: it names the node and the kubelet acts. B) wrong: it does not touch node config. C) wrong: only the kubelet and runtime start containers. D) wrong: the Deployment controller does that.'
- id: static-pods
  prompt: Which statements about kubeadm static pods are true? (select two)
  choices: [Editing a manifest restarts that component without any API call, They are created with kubectl apply and stored only in etcd, The kubelet reads their manifests from a directory on the node, They are scheduled by kube-scheduler to a chosen node]
  answer: [2, 0]
  explain: 'A) correct: a file change restarts the pod and leaves no API audit trail. B) wrong: the manifests are files; the API only shows mirror pods. C) correct: the kubelet watches /etc/kubernetes/manifests. D) wrong: the kubelet runs them on its own node, no scheduler is involved.'
- id: etcd-members
  prompt: Why is a four-member etcd cluster usually a poor choice compared with three?
  choices: [Raft needs an odd number to start, Four members tolerate only one failure, the same as three, but add cost and write latency, etcd refuses even sizes, Four members tolerate two failures]
  answer: [1]
  explain: 'A) wrong: it can start. B) correct: quorum for four is three, so one failure is tolerated, exactly as with three. C) wrong: it is allowed. D) wrong: two failures leave two of four, below quorum.'
- id: cri
  prompt: A newly joined node stays NotReady and the kubelet log says the runtime socket cannot be reached. Which check is most direct?
  choices: [kubectl get events on the default namespace, crictl info against the configured socket and the runtime service status, Delete the node object and rejoin, Restart kube-scheduler]
  answer: [1]
  explain: 'A) wrong: the symptom is on the node, not in the default namespace. B) correct: crictl uses the same CRI socket as the kubelet and shows whether the runtime answers. C) wrong: it hides the cause and will recur. D) wrong: unrelated component.'
