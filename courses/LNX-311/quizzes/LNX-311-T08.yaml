title: 'Quiz: Helm and Kustomize'
questions:
- id: history
  prompt: Where does Helm 3 store the history of a release?
  choices: [In a Tiller pod, In the chart repository, In Secrets in the release namespace, In etcd directly under /helm]
  answer: [2]
  explain: 'A) wrong: Tiller was removed in Helm 3. B) wrong: repositories hold charts, not releases. C) correct: one Secret per revision. D) wrong: it uses ordinary API objects.'
- id: crds
  prompt: A chart upgrade changes a CRD schema in crds/. What does Helm do with the stored CRD?
  choices: [Leaves it unchanged, Refuses the upgrade, Deletes and recreates it, Upgrades it]
  answer: [0]
  explain: 'A) correct: crds/ is installed once only. B) wrong: it proceeds. C) wrong: deleting a CRD would delete its objects. D) wrong: by design it does not.'
- id: hash
  prompt: Why does configMapGenerator append a hash to the ConfigMap name?
  choices: [To satisfy RBAC, To compress the data, A data change creates a new name and so triggers a rollout of pods that reference it, To hide the name]
  answer: [2]
  explain: 'A) wrong: unrelated. B) wrong: no compression. C) correct: references are rewritten and pods roll. D) wrong: not obfuscation.'
- id: render
  prompt: Which are safe review habits for a third-party chart? (select two)
  choices: [Read helm show values, Render with helm template and read the manifests, Install first and read the output later, Use --set for every value to avoid files]
  answer: [0, 1]
  explain: 'A) correct: the values are the API. B) correct: shows RBAC and privileges. C) wrong: risky. D) wrong: loses reviewability.'
- id: tools
  prompt: You need a one-line change to a third-party chart's Deployment. Reasonable approach?
  choices: [Edit the live object with kubectl edit, Delete the chart, Fork the chart, Render with Helm and patch with Kustomize or use a post-renderer]
  answer: [3]
  explain: 'A) wrong: Helm will revert it. B) wrong: not an answer. C) wrong: heavy and drifting. D) correct: keeps the upstream chart intact.'
