id: LNX-311
title: Kubernetes Administration
summary: 'Running a cluster: control-plane architecture, kubeadm installs and HA, upgrades, etcd backup and restore, scheduling,
  storage, RBAC and certificates, Helm and Kustomize, CRDs and operators, troubleshooting and managed services.'
hours: 70
coverage: full
outcomes:
- Explain how the API server, etcd, scheduler, controllers, kubelet and runtime cooperate and which failure each can cause
- Install and upgrade a kubeadm cluster and design a highly available control plane
- Back up and restore etcd and rehearse recovery
- Control placement with requests, affinity, taints and autoscaling
- Provision storage with PersistentVolumes, StorageClasses and CSI
- Grant least privilege with RBAC and manage cluster certificates
- Package and customise applications with Helm and Kustomize and extend the API with CRDs
- Troubleshoot nodes, the control plane and applications systematically
