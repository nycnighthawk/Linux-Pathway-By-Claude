title: 'Quiz: Long-term compliance drift'
questions:
- id: window
  prompt: A configuration-management agent reapplies the desired state every 30 minutes. What does that period define?
  choices:
  - The longest time a manual change can persist before being reverted, the drift window
  - The scan duration
  - The size of the baseline
  - The number of exceptions
  answer:
  - 0
  explain: 'A) correct: convergence bounds drift by its schedule. B) wrong: scans are separate. C) wrong: it says nothing about baseline size. D) wrong: exceptions are a governance matter.'
- id: decay
  prompt: Which is an example of decay, not drift?
  choices:
  - Two tools fight over a setting
  - A package replaces a config file
  - A new benchmark release tightens a control, so an unchanged host stops being compliant
  - An administrator opens a port and forgets it
  answer:
  - 2
  explain: 'A) wrong: that is an automation
    conflict on the host. B) wrong: that is a software change on the host. C) correct: the standard moved, not the host. D) wrong: that is an operator change on the host.'
- id: silent
  prompt: A dashboard says 98 percent of hosts are compliant. What should you check first?
  choices:
  - The CPU use of the scanner
  - The number of rules
  - Whether the percentage counts only hosts that still check in, and how old the newest scan is
  - The colour scheme
  answer:
  - 2
  explain: 'A) wrong: irrelevant. B) wrong: rule count
    does not explain the number. C) correct: a silent agent removes hosts from the denominator. D) wrong: presentation does not matter.'
- id: replace
  prompt: What does replacing hosts every 30 days from a rebuilt image achieve?
  choices:
  - It bounds the accumulation of unknown change, and moves the compliance work to the image pipeline
  - It removes the need for an owner
  - It eliminates the need for scanning
  - It makes exceptions unnecessary
  answer:
  - 0
  explain: 'A) correct: drift cannot outlive the host, but stale images become the risk. B) wrong: the image needs an owner. C) wrong: images and hosts still need scans. D) wrong: exceptions still exist.'
- id: exception
  prompt: Which exception record is adequate?
  choices:
  - A ticket number
  - Rule, reason, compensating control, owner and an expiry date
  - Rule name only
  - A screenshot of the scan
  answer:
  - 1
  explain: 'A) wrong: tickets get archived. B) correct: expiry and owner force a decision to be renewed. C) wrong: it cannot be reviewed. D) wrong: a screenshot is not a record.'
- id: autorepair
  prompt: Why log every automatic repair made by configuration management?
  choices:
  - Repairs are always errors
  - To fill the disk
  - Logging is required by SELinux
  - A setting that keeps being repaired points to a conflicting tool or a baseline that blocks a legitimate need
  answer:
  - 3
  explain: 'A) wrong: repairs are normal. B) wrong: that is not a goal. C) wrong:
    SELinux has no such rule. D) correct: repeating repairs reveal the root cause.'
- id: calendar
  prompt: Which event is best handled by a calendar with an owner?
  choices:
  - A user typing a wrong command
  - A random kernel crash
  - A network packet loss
  - Distribution end of life, certificate expiry and key rotation dates
  answer:
  - 3
  explain: 'A) wrong: not predictable. B) wrong:
    unpredictable. C) wrong: unpredictable. D) correct: these dates are known in advance and change compliance without a local edit.'
