title: 'Quiz: Falco, auditd advanced'
questions:
- id: auid
  prompt: Why is the auid field valuable in audit records?
  choices:
  - It names the audit rule
  - It holds the effective user after su or sudo
  - It keeps the uid of the original login, even after privilege changes
  - It is the process id
  answer:
  - 2
  explain: 'A) wrong: the rule name is the key, set with -k. B) wrong: the effective uid is a different field. C) correct: the login uid survives su and sudo, so a human can be
    traced. D) wrong: the process id is pid.'
- id: b32
  prompt: An execve audit rule exists only with arch=b64. What is the gap?
  choices:
  - 64-bit programs are not logged
  - A 32-bit binary uses the other system call table and runs without a record
  - Shell builtins are not logged
  - Kernel modules cannot be loaded
  answer:
  - 1
  explain: 'A) wrong: those are logged. B) correct: the b32 twin is needed for completeness. C) wrong: unrelated to architecture.
    D) wrong: module rules are separate.'
- id: immutable
  prompt: What does -e 2 do as the last audit rule?
  choices:
  - Enables remote logging
  - Makes the rule set immutable until reboot
  - Exits auditd
  - Doubles the log size
  answer:
  - 1
  explain: 'A) wrong: forwarding is configured elsewhere. B) correct: even root cannot change rules, though changes then need a reboot. C) wrong: the daemon keeps running. D) wrong: it does not affect size.'
- id: lost
  prompt: auditctl -s shows lost 41203. What does it mean?
  choices:
  - The rules were deleted
  - The kernel dropped events because its backlog overflowed, so the record has holes
  - 41203 users logged out
  - The log was rotated
  answer:
  - 1
  explain: 'A) wrong: rules are reported separately. B) correct: lost counts events that never reached the log. C) wrong: it is not
    a session count. D) wrong: rotation is a daemon action.'
- id: falco-parts
  prompt: Which Falco objects can a rule condition reuse?
  choices:
  - Audit keys
  - Lists and macros
  - Only other rules
  - Kernel modules
  answer:
  - 1
  explain: 'A) wrong: keys belong to auditd. B) correct: lists hold strings and macros hold named conditions. C) wrong: rules do not reference each other. D) wrong:
    modules are drivers.'
- id: driver
  prompt: What is the advantage of the modern eBPF driver in Falco?
  choices:
  - It makes rules unnecessary
  - It needs no compiler or kernel headers on the host, using CO-RE, but needs a kernel with BTF
  - It encrypts alerts
  - It works on any kernel version
  answer:
  - 1
  explain: 'A) wrong: the rules engine
    still decides. B) correct: compile once, run everywhere. C) wrong: transport security is separate. D) wrong: it needs a recent kernel with BTF.'
- id: fatigue
  prompt: All Falco alerts at NOTICE and above go to a chat channel and people mute it. What is the best remedy?
  choices:
  - Disable Falco
  - Add more rules
  - Lower the priority of every rule
  - Tune by namespace, image and behaviour, and route only high-priority alerts to people
  answer:
  - 3
  explain: 'A) wrong: it
    removes detection. B) wrong: more rules add more noise. C) wrong: this hides real alerts as well. D) correct: exceptions for known-good behaviour restore trust.'
