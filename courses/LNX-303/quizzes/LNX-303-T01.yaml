title: 'Quiz: X.509 PKI: CA, CRL, OCSP'
questions:
- id: pathlen
  prompt: An intermediate CA certificate has basicConstraints CA:TRUE,pathlen:0. What can it do?
  choices:
  - Sign end-entity certificates but not further CA certificates
  - Sign nothing, it is only a label
  - Sign certificates for any depth of hierarchy
  - Sign other CAs but not end-entity certificates
  answer:
  - 0
  explain: 'A) correct: pathlen counts the CA levels allowed below it, and zero leaves only leaves. B) wrong: CA:TRUE with keyCertSign gives it signing power. C) wrong: a pathlen value is the limit on depth. D) wrong: the reverse
    of the meaning.'
- id: san
  prompt: A certificate has a SAN of DNS:app.example and a common name of db.example. Which name does a modern client check?
  choices:
  - The common name only
  - Both names, either may match
  - The SAN, ignoring the common name
  - Neither, it checks the issuer
  answer:
  - 2
  explain: 'A) wrong: the common name is a legacy fallback used only without a SAN. B) wrong: clients do not merge them.
    C) correct: when a SAN exists it is authoritative. D) wrong: name matching concerns the subject, not the issuer.'
- id: soft-fail
  prompt: Why is OCSP soft-fail a weakness?
  choices:
  - It forces every certificate to be re-issued
  - It requires clients to hold the root key
  - An attacker who blocks the responder makes the client accept a revoked certificate
  - It makes responses larger
  answer:
  - 2
  explain: 'A) wrong: nothing is re-issued by a failed check. B) wrong: clients never hold CA keys. C) correct: no answer is treated as no problem, so blocking the query defeats revocation. D) wrong: size is unrelated.'
- id: stale-crl
  prompt: A CRL passes its nextUpdate time and the issuer does not publish a new one. What do strict clients do?
  choices:
  - Delete the CA from the trust store
  - Switch to OCSP automatically
  - Reject certificates from that issuer because the revocation data are stale
  - Treat all certificates from that issuer as valid forever
  answer:
  - 2
  explain: 'A) wrong: validation never edits the trust store. B) wrong: switching mechanisms is not automatic. C) correct: a stale list gives no assurance, so every certificate
    from that issuer fails at once. D) wrong: strict clients do not assume validity.'
- id: chain
  prompt: A curl call in a minimal container reports an unknown issuer, while a desktop browser accepts the same site. What is the most likely cause?
  choices:
  - The leaf certificate has expired
  - TLS 1.3 is disabled
  - The server sends only its leaf and omits the intermediate
  - The root is in the browser's trust store
  answer:
  - 2
  explain: 'A) wrong: an expired leaf would fail in the browser too. B) wrong: protocol version does not change issuer lookup. C) correct: browsers cache or fetch intermediates, minimal
    clients do not. D) wrong: both would trust the same public root.'
- id: trust-store
  prompt: Which command makes a new company root trusted by system tools on a Debian or Ubuntu host?
  choices:
  - certutil -d sql:/etc/pki -A
  - openssl verify -CAfile
  - update-ca-certificates, after placing a .crt file in /usr/local/share/ca-certificates
  - update-ca-trust
  answer:
  - 2
  explain: 'A) wrong: that edits an NSS database for one application family. B) wrong:
    verify tests a chain and installs nothing. C) correct: it rebuilds the bundle from that directory. D) wrong: that is the Enterprise Linux command.'
- id: stapling
  prompt: What does OCSP stapling add?
  choices:
  - The client sends the CRL to the server
  - The certificate lifetime is extended
  - The root signs every leaf directly
  - The server attaches a fresh signed status response to the handshake
  answer:
  - 3
  explain: 'A) wrong: clients
    do not send CRLs. B) wrong: lifetime is a certificate field. C) wrong: it does not change the hierarchy. D) correct: the server fetches the response, which removes the client query and its privacy leak.'
