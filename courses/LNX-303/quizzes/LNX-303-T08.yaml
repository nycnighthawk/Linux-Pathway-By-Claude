title: 'Quiz: Compliance as code'
questions:
- id: parts
  prompt: In SCAP, which part holds the machine-evaluable checks?
  choices:
  - OVAL
  - CPE
  - ARF
  - XCCDF
  answer:
  - 0
  explain: 'A) correct: OVAL definitions are evaluated by the scanner. B) wrong: CPE names platforms. C) wrong: ARF is the result format. D) wrong: XCCDF describes the benchmark, rules and profiles.'
- id: tailoring
  prompt: Why tailor a profile with a tailoring file or an extending .profile instead of editing the data stream?
  choices:
  - Deviations stay small and reviewable, and survive content updates
  - Data streams cannot be edited at all, because they are signed by the vendor
  - Tailoring makes scans faster
  - It removes the need for exceptions
  answer:
  - 0
  explain: 'A) correct: the base content updates while your delta stays separate. B) wrong: they can be, which is the problem. C) wrong: speed is unchanged. D) wrong: every deviation still needs a reason and an owner.'
- id: na
  prompt: A scan shows 94 percent pass on a new distribution release, using content for the previous release. What should worry you?
  choices:
  - The profile has too many rules for one host to pass them all at once
  - The HTML report is too large
  - The scan ran as root
  - Many rules may be notapplicable and skipped, so the score flatters the system
  answer:
  - 3
  explain: 'A) wrong: count is not the issue. B) wrong: size is irrelevant. C) wrong: the scanner needs privileges. D) correct: platform mismatches skip rules and the pass rate rises.'
- id: remediate
  prompt: What is the safest way to apply generated remediation?
  choices:
  - Run it only after a reboot
  - Run it on all production hosts at once
  - Apply only the rules that fail
  - Review it, apply to a staging clone and a canary with out-of-band access, then rescan
  answer:
  - 3
  explain: 'A) wrong: rebooting does not make it safe. B) wrong: one bad rule locks out everything. C) wrong: all remediation is applied to failing rules; the question is how safely. D) correct: a lockout is recoverable only with another way in.'
- id: image
  prompt: Why is hardening at image build time preferred to remediation on running hosts?
  choices:
  - Images cannot drift
  - It removes the need for exceptions, since no host differs from the image
  - It avoids using OpenSCAP
  - Hosts start compliant, changes are tested once, and later scans show drift
  answer:
  - 3
  explain: 'A) wrong: running hosts still drift. B) wrong: exceptions still apply. C) wrong: the same tools are used. D) correct: build-time application is testable and repeatable.'
- id: evidence
  prompt: What does a passing OpenSCAP report prove to an auditor?
  choices:
  - The rules in that profile and content version passed on the scanned host
  - No vulnerabilities exist
  - The system is secure
  - The application is correct and every service on the host is configured safely
  answer:
  - 0
  explain: 'A) correct: it is bounded by profile, version and the trustworthiness of the host. B) wrong: vulnerability scanning is a separate activity. C) wrong: benchmarks cover configuration only. D) wrong: application correctness is out of scope.'
- id: exceptions
  prompt: What belongs in an exception register entry?
  choices:
  - A screenshot
  - The scan score
  - The rule, the reason, an owner and an expiry date
  - Only the rule name, with the date on which it was last scanned
  answer:
  - 2
  explain: 'A) wrong: a screenshot is not a record. B) wrong: the score belongs to the result. C) correct: reason, owner and expiry force a periodic decision. D) wrong: it cannot be reviewed without context.'
- id: score-flatters
  prompt: A scan of a new release with last release's content shows 94% pass. What should you check?
  choices:
  - Whether the scan ran as root, which may skew the results of some checks
  - Whether the profile is too short and misses rules from the older release
  - How many rules were notapplicable and skipped, which would flatter the score
  - Whether the HTML report has too many pages for the auditor to read easily
  answer:
  - 2
  explain: 'A) wrong: normal. B) wrong: not the cause. C) correct: the score may be inflated. D) wrong: not related.'
- id: apply-fix
  prompt: Generated remediation is ready for 600 hosts. Which rollout fits best?
  choices:
  - Review it, apply to a staging clone and a canary with console access, then rescan
  - Run it on all hosts at once during a quiet hour, to finish in a single step
  - Apply only the rules that already pass, because they are the least risky ones
  - Skip the review, since the content is generated by the vendor and is trusted
  answer:
  - 0
  explain: 'A) correct: safe and measured. B) wrong: a bad rule hits everyone. C) wrong: changes nothing. D) wrong: no human check.'
