title: 'Quiz: IMA/EVM, lockdown'
questions:
- id: modes
  prompt: Which IMA action refuses access to a file whose hash or signature does not match?
  choices:
  - measure
  - audit
  - appraise
  - hash
  answer:
  - 2
  explain: 'A) wrong: measure records a hash in the log and the TPM. B) wrong: audit only writes an event. C) correct: appraisal compares and denies on mismatch. D) wrong: hash selects the digest algorithm to use.'
- id: fix
  prompt: Why does ima_appraise=fix not protect against a root attacker on a running system?
  choices:
  - It blocks all writes
  - The kernel regenerates the stored hash, so a modified file looks valid
  - It disables the TPM
  - It only works on tmpfs
  answer:
  - 1
  explain: 'A) wrong: it does not block writes. B) correct: fix mode trusts the current content and labels it. C) wrong: the TPM is unaffected. D) wrong: it applies to real filesystems.'
- id: evm
  prompt: What does EVM add to IMA?
  choices:
  - An HMAC or signature over file attributes, so offline edits are detected
  - Network attestation
  - Encryption of file contents, so a stolen disk cannot be read by anyone
  - A second measurement log
  answer:
  - 0
  explain: 'A) correct: EVM protects security.ima, SELinux labels, mode and owner. B) wrong: attestation is a verifier service. C) wrong: it does not encrypt. D) wrong: the log belongs to IMA.'
- id: order
  prompt: In an IMA policy, why do the dont_measure and dont_appraise rules for procfs and tmpfs come first?
  choices:
  - They run faster
  - Later rules would be ignored for all files once any rule has matched them
  - Alphabetical order is required
  - The first matching rule decides, so exclusions must precede broad rules
  answer:
  - 3
  explain: 'A) wrong: speed is incidental. B) wrong: only files matched earlier are affected. C) wrong: order is semantic, not alphabetical. D) correct: a broad rule placed first would already have decided.'
- id: file-check
  prompt: What goes wrong if you appraise func=FILE_CHECK for all files read by root?
  choices:
  - Unsigned config and unit files are denied, and the system can fail to boot
  - Lockdown is disabled
  - The TPM is cleared
  - Nothing, because FILE_CHECK is the safest rule and only logs what it sees
  answer:
  - 0
  explain: 'A) correct: most configuration files have no signature. B) wrong: unrelated. C) wrong: policy does not touch the TPM that way. D) wrong: it is the riskiest rule.'
- id: lockdown
  prompt: Which statement about kernel lockdown is correct?
  choices:
  - It can be lowered by root at runtime, using a write to the lockdown file
  - It signs executables
  - It blocks ways root could modify the running kernel and cannot be lowered
  - It replaces Secure Boot
  answer:
  - 2
  explain: 'A) wrong: that would defeat it. B) wrong: signing is IMA. C) correct: integrity blocks /dev/mem, unsigned modules and unsigned kexec, among others. D) wrong: it complements Secure Boot.'
- id: script
  prompt: A policy appraises executed programs. Why can python3 /dev/shm/x.py still run an unsigned script?
  choices:
  - Scripts are signed automatically by the interpreter when it loads them
  - The kernel sees only the signed interpreter run; the script is just data
  - /dev/shm is always trusted
  - Python is exempt from IMA
  answer:
  - 1
  explain: 'A) wrong: nothing signs them. B) correct: unless an interpreter opts in to script checks, scripts are plain file reads. C) wrong: it is a writable tmpfs. D) wrong: Python is subject to the same rules as any program.'
- id: python-bypass
  prompt: An IMA appraisal policy is in place, yet an attacker runs python3 /dev/shm/x.py as root. What closes this gap?
  choices:
  - Turn on ima_appraise=fix so that scripts get signed when they are first run
  - Remove the TPM from the host, since the interpreter is already signed anyway
  - Add func=FILE_CHECK for every file that is read by root, including scripts
  - Mount /dev/shm and /tmp noexec, and add an allow list such as fapolicyd for scripts
  answer:
  - 3
  explain: 'A) wrong: fix mode regenerates hashes. B) wrong: unrelated. C) wrong: may break boot. D) correct: covers what appraisal does not.'
- id: boot-fail
  prompt: After enabling appraisal for all files read by root, the host fails to boot. What was the likely mistake?
  choices:
  - The audit log was full, so the kernel could not write the denial and stopped
  - Unsigned config and unit files were appraised and denied
  - The TPM was cleared by the policy and the stored keys were lost with it
  - Lockdown was lowered by root, so the appraisal policy was no longer applied
  answer:
  - 1
  explain: 'A) wrong: not the cause. B) correct: too broad a rule. C) wrong: not a result of policy. D) wrong: lockdown cannot be lowered.'
