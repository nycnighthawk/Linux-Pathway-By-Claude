id: LNX-402
title: 'Capstone: Cloud-Native Platform'
summary: A graded, multi-stage project for the cloud-native pathway. You build two kubeadm clusters with Cilium and the Gateway
  API, run the platform and applications from Git with Argo CD, rehearse an upgrade and an etcd restore, enforce admission
  policy and signed images, add observability, move the platform to managed Kubernetes, run a week-long soak and chaos test,
  and measure a 100-node scale test. Five stages are graded in CI; three are guided evidence stages.
hours: 140
coverage: full
outcomes:
- Define two clusters whose ranges and names allow them to be joined, and a gateway that limits who may attach routes
- Lay out a GitOps repository whose root, sets and sync waves reconcile safely without secrets in Git
- Order a minor-version upgrade and an etcd snapshot-and-restore drill so that no step is unsafe
- Express admission rules for least privilege, approved registries and signed images, and explain refusals
- Write alerts that catch silent failure, including vanished scrape targets and expiring certificates
- Compare a self-built platform with a managed one and record provider-specific differences
- Plan, run and report a soak and chaos test and a scale test with honest limits
