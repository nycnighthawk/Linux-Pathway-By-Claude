id: LNX-312
title: Container & Kubernetes Networking
summary: 'How container and Pod traffic reaches its target on Linux: namespaces, veth and bridges, the CNI contract, Flannel,
  Calico and Cilium, kube-proxy modes and Services, eBPF datapaths, Ingress and Gateway API, NetworkPolicy, CoreDNS, service
  meshes, MetalLB and BGP, ClusterMesh, MTU and encapsulation overhead.'
hours: 50
coverage: full
outcomes:
- Rebuild a container network by hand with namespaces, veth pairs, a bridge and NAT
- Explain the CNI contract and write a minimal plugin
- Compare Flannel, Calico and Cilium and choose between overlay and routed designs
- Compare the iptables, IPVS and nftables modes of kube-proxy and choose the Service type for an exposure requirement
- Write NetworkPolicy and Cilium L7 policy and test them
- Route external traffic with Ingress, Gateway API, MetalLB and BGP
- Debug cluster DNS and service discovery, and size MTU for encapsulation overhead
