title: 'Quiz: CoreDNS'
questions:
- id: headless
  prompt: What does a DNS query for a headless Service return?
  choices: [The addresses of the ready Pods, The node address, Always NXDOMAIN, A ClusterIP]
  answer: [0]
  explain: 'A) correct. B) wrong. C) wrong. D) wrong: headless means no cluster IP.'
- id: ndots
  prompt: A Pod has ndots 5 and three search suffixes. How many queries does a successful lookup of api.example.com send (ignoring AAAA)?
  choices: ['4', '2', '6', '1']
  answer: [0]
  explain: 'A) correct: three failed suffix tries then the absolute name. B) wrong. C) wrong. D) wrong.'
- id: dns-policy
  prompt: What does dnsPolicy Default give a Pod?
  choices: [No DNS, A random resolver, The cluster DNS, The node resolver configuration]
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong. D) correct; the cluster default is ClusterFirst.'
- id: race
  prompt: Which measures reduce the UDP conntrack race delay? (select two)
  choices: [Raising ndots, Disabling readiness probes, Socket-level translation in an eBPF datapath, A node-local DNS cache using TCP upstream]
  answer: [3, 2]
  explain: 'A) wrong. B) wrong. C) correct. D) correct.'
- id: timeout
  prompt: A lookup times out rather than returning not-found. What does that point to?
  choices: [The path to the DNS Service, not its data, A missing record, A wrong search list, A typo in the name]
  answer: [0]
  explain: 'A) correct. B) wrong: that gives NXDOMAIN. C) wrong. D) wrong.'
