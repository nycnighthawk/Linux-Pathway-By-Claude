title: 'Quiz: Ingress and Gateway API'
questions:
- id: no-controller
  prompt: You create an Ingress in a cluster with no controller installed. What happens?
  choices: [Nothing is routed, the object is only a declaration, kube-proxy serves it, The API server proxies it, A default controller starts]
  answer: [0]
  explain: 'A) correct. B) wrong: kube-proxy knows only Services. C) wrong. D) wrong: no default controller ships.'
- id: roles
  prompt: Which object does an application team normally own in the Gateway API?
  choices: [The controller Deployment, Gateway, HTTPRoute, GatewayClass]
  answer: [2]
  explain: 'A) wrong. B) wrong: cluster operator. C) correct. D) wrong: infrastructure provider.'
- id: refgrant
  prompt: When is a ReferenceGrant needed?
  choices: [Only with TCP, Every HTTPRoute, A route or Gateway references a Secret or Service in another namespace, Only on cloud clusters]
  answer: [2]
  explain: 'A) wrong. B) wrong. C) correct: the target namespace must consent. D) wrong.'
- id: weights
  prompt: How does the Gateway API express a 90/10 canary split?
  choices: [A CronJob, Weights on backendRefs in a rule, Two Gateways, A controller annotation]
  answer: [1]
  explain: 'A) wrong. B) correct and portable. C) wrong. D) wrong: that was the Ingress way.'
- id: status
  prompt: Where do you first look when an HTTPRoute is not live? (select two)
  choices: [The Gateway listener allowedRoutes, The route status per parent reference, etcd keys directly, The node kernel log]
  answer: [1, 0]
  explain: 'A) correct. B) correct. C) wrong. D) wrong.'
