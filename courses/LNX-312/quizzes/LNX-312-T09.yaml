title: 'Quiz: service mesh'
questions:
- id: identity
  prompt: What does a mesh certificate identity normally derive from?
  choices: [The Pod IP, The Pod's Kubernetes service account, The node name, The image tag]
  answer: [1]
  explain: 'A) wrong: addresses change. B) correct. C) wrong. D) wrong.'
- id: ambient
  prompt: Which are true of Istio ambient mode? (select two)
  choices: [A per-node ztunnel handles L4 mTLS and authorisation, Waypoint proxies are added only where L7 features are needed, It needs no CNI redirection, Every Pod gets a sidecar]
  answer: [0, 1]
  explain: 'A) correct. B) correct. C) wrong. D) wrong.'
- id: permissive
  prompt: Why start with permissive mTLS?
  choices: [It is more secure, It is required by SPIFFE, It accepts plain and encrypted traffic during migration, It disables policy]
  answer: [2]
  explain: 'A) wrong. B) wrong. C) correct. D) wrong.'
- id: expiry
  prompt: What happens when the mesh intermediate CA certificate expires?
  choices: [DNS stops, New mTLS connections fail across the mesh, Only L7 policy stops, Nothing]
  answer: [1]
  explain: 'A) wrong. B) correct: it is the most disruptive operation to miss. C) wrong. D) wrong.'
- id: layers
  prompt: Why keep NetworkPolicy under a mesh?
  choices: [Policy is faster, A mesh cannot encrypt, An independent layer with a different failure mode, It is mandatory]
  answer: [2]
  explain: 'A) wrong. B) wrong. C) correct. D) wrong.'
