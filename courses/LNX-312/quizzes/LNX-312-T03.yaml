title: 'Quiz: Flannel, Calico, Cilium'
questions:
- id: flannel-policy
  prompt: Which statement about Flannel is correct?
  choices: [It provides Pod addressing and transport but no policy engine, It requires BGP, It enforces NetworkPolicy by itself, It replaces kube-proxy]
  answer: [0]
  explain: 'A) correct. B) wrong: VXLAN is its default. C) wrong: policy needs another component. D) wrong.'
- id: hostgw
  prompt: host-gw mode needs which property of the network?
  choices: [UDP port 4789 only, A BGP route reflector, IPv6 only, Nodes share an L2 segment so they can be next hops for each other]
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong. D) correct: it installs plain routes via node addresses.'
- id: crosssubnet
  prompt: What does Calico cross-subnet encapsulation do?
  choices: [Encapsulates all traffic, Uses NAT for Pods, Encapsulates only traffic that leaves the subnet, Disables policy]
  answer: [2]
  explain: 'A) wrong. B) wrong. C) correct: same-subnet traffic is routed natively. D) wrong.'
- id: overhead
  prompt: Roughly how many bytes does VXLAN over IPv4 add per packet?
  choices: ['100', '8', '20', '50']
  answer: [3]
  explain: 'A) wrong. B) wrong: that is the UDP header alone. C) wrong. D) correct: outer Ethernet, IP, UDP and VXLAN headers.'
- id: cilium
  prompt: Which are true of Cilium? (select two)
  choices: [Its datapath is built on eBPF, It has no policy of its own, It cannot do native routing, It can replace kube-proxy]
  answer: [0, 3]
  explain: 'A) correct. B) wrong. C) wrong: native routing is supported. D) correct.'
