title: 'Quiz: NetworkPolicy'
questions:
- id: open-default
  prompt: A Pod is selected by no NetworkPolicy. What traffic does it accept?
  choices: [All traffic, only same-namespace traffic, none, only traffic from nodes]
  answer: [0]
  explain: 'A) correct: isolation starts when a policy selects the Pod. B) wrong. C) wrong. D) wrong.'
- id: and-or
  prompt: A from list has one item with namespaceSelector and podSelector together. How are they combined?
  choices: [AND within one item, OR, AND only for ipBlock, They are rejected]
  answer: [0]
  explain: 'A) correct. B) wrong: OR applies between separate items. C) wrong. D) wrong.'
- id: additive
  prompt: Two policies select the same Pod and allow different peers. What is allowed?
  choices: [The union of both, The intersection, Only the older policy, Nothing]
  answer: [0]
  explain: 'A) correct: policies are additive. B) wrong. C) wrong. D) wrong.'
- id: deny-dns
  prompt: After a default-deny egress policy, every name lookup fails. What is missing?
  choices: [An egress rule to the cluster DNS Pods on port 53, An ingress rule on the web Pod, A new CNI, An IPPool]
  answer: [0]
  explain: 'A) correct. B) wrong. C) wrong. D) wrong.'
- id: enforcement
  prompt: Which are true? (select two)
  choices: [A plugin that does not implement the API ignores NetworkPolicy objects, The standard API has no deny action, L7 rules need no proxy, Policies are ordered by name]
  answer: [0, 1]
  explain: 'A) correct. B) correct. C) wrong. D) wrong.'
