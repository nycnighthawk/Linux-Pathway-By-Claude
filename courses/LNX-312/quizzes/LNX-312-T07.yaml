title: 'Quiz: NetworkPolicy'
questions:
- id: open-default
  prompt: A Pod is selected by no NetworkPolicy. What traffic does it accept?
  choices: [only traffic from nodes, All traffic, only same-namespace traffic, none]
  answer: [1]
  explain: 'A) wrong. B) correct: isolation starts when a policy selects the Pod. C) wrong. D) wrong.'
- id: and-or
  prompt: A from list has one item with namespaceSelector and podSelector together. How are they combined?
  choices: [They are rejected, AND only for ipBlock, AND within one item, OR]
  answer: [2]
  explain: 'A) wrong. B) wrong. C) correct. D) wrong: OR applies between separate items.'
- id: additive
  prompt: Two policies select the same Pod and allow different peers. What is allowed?
  choices: [The union of both, The intersection, Only the older policy, Nothing]
  answer: [0]
  explain: 'A) correct: policies are additive. B) wrong. C) wrong. D) wrong.'
- id: deny-dns
  prompt: After a default-deny egress policy, every name lookup fails. What is missing?
  choices: [An ingress rule on the web Pod, An egress rule to the cluster DNS Pods on port 53, An IPPool, A new CNI]
  answer: [1]
  explain: 'A) wrong. B) correct. C) wrong. D) wrong.'
- id: enforcement
  prompt: Which are true? (select two)
  choices: [L7 rules need no proxy, A plugin that does not implement the API ignores NetworkPolicy objects, Policies are ordered by name, The standard API has no deny action]
  answer: [1, 3]
  explain: 'A) wrong. B) correct. C) wrong. D) correct.'
