title: 'Quiz: eBPF datapath and Hubble'
questions:
- id: socket-lb
  prompt: What does socket-level Service translation avoid for in-cluster traffic?
  choices: [The Pod network, Per-packet NAT and reverse NAT on the node, Any need for EndpointSlices, DNS lookups]
  answer: [1]
  explain: 'A) wrong. B) correct: the destination is rewritten at connect time. C) wrong. D) wrong.'
- id: api-address
  prompt: Why does the agent need the real API server address when kube-proxy is gone?
  choices: [To avoid TLS, For DNS only, Because the API is on UDP, No Service translation exists yet when the agent starts]
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong. D) correct: the ClusterIP of the API server cannot be resolved before the datapath runs.'
- id: dsr
  prompt: Which are properties of DSR? (select two)
  choices: [It removes the need for a Service, The backend replies directly to the client, It needs metadata carried in the packet so MTU matters, It works only with IPv6]
  answer: [1, 2]
  explain: 'A) wrong. B) correct. C) correct. D) wrong.'
- id: maglev
  prompt: Why choose Maglev hashing for an external VIP served by several nodes?
  choices: [It is the only algorithm that works, Most flows keep their backend when the backend set changes, It disables conntrack, It encrypts traffic]
  answer: [1]
  explain: 'A) wrong. B) correct: consistent hashing limits disruption. C) wrong. D) wrong.'
- id: l7-cost
  prompt: What is the main risk of enabling L7 visibility for every flow in the cluster?
  choices: [A proxy is started for the covered traffic, adding latency and memory, Flows are no longer recorded, Policy stops working, DNS fails]
  answer: [0]
  explain: 'A) correct. B) wrong. C) wrong. D) wrong.'
