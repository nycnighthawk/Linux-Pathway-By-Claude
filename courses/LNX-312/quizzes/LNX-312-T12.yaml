title: 'Quiz: MTU and throughput'
questions:
- id: vxlan
  prompt: Underlay MTU is 1500 and the CNI uses VXLAN over IPv4. What is the Pod MTU?
  choices: ['1450', '1480', '1400', '1500']
  answer: [0]
  explain: 'A) correct: 50 bytes of overhead. B) wrong: that is IP-in-IP. C) wrong. D) wrong.'
- id: ping
  prompt: What payload size gives a 1450-byte packet with ping -M do -s?
  choices: ['1422', '1472', '1400', '1450']
  answer: [0]
  explain: 'A) correct: 1450 minus 20 IP and 8 ICMP. B) wrong: that fits 1500. C) wrong. D) wrong.'
- id: clamp
  prompt: What does MSS clamping not help?
  choices: [TCP handshakes, HTTP downloads, Database connections over TCP, UDP traffic such as QUIC]
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong. D) correct: clamping rewrites TCP SYN options only.'
- id: symptoms
  prompt: Which symptoms suggest an MTU black hole? (select two)
  choices: [Pings and small requests work, large transfers stall, DNS fails only for new names, Every packet is dropped]
  answer: [0, 1]
  explain: 'A) correct. B) correct. C) wrong. D) wrong.'
- id: measure
  prompt: Why record CPU in a throughput test?
  choices: [A saturated core shows a software limit, not a link limit, To lower MTU, To disable offloads, CPU has no effect]
  answer: [0]
  explain: 'A) correct. B) wrong. C) wrong. D) wrong.'
