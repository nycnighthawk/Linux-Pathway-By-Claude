id: LNX-104
title: Software Packages on a Single Host
summary: 'Installing, querying, verifying and repairing software on one host: rpm and dnf, dpkg and apt, repositories and
  signing keys, Flatpak, source builds with shared libraries, and dependency troubleshooting.'
hours: 30
coverage: full
outcomes:
- Query, verify and revert changes with rpm and dnf
- Choose and hold package versions with apt sources, pins and holds
- Define repositories safely and manage GPG keys and package signatures
- Add Flatpak remotes and restrict application permissions
- Build software from source, stage the install and diagnose shared library problems
- Classify and repair dependency failures without forcing the package manager
certifications:
- cert: LFCS
  objectives:
  - D1
- cert: LPIC1
  objectives:
  - '102.3'
  - '102.4'
  - '102.5'
- cert: LPLUS
  objectives:
  - D2
- cert: RHCSA
  objectives:
  - D2
  - D7
