id: LNX-330
title: 'Kernel Development I: Workflow & Tooling'
summary: 'The kernel contribution workflow end to end: the release process and stable branches, Kconfig and cross-compiling,
  boot testing in QEMU, in-tree and out-of-tree modules, the checking tools (checkpatch, get_maintainer, sparse, Coccinelle),
  patch series by mail with b4, KUnit and kselftest, the debugging instruments (printk, dynamic debug, ftrace, KASAN, lockdep),
  git bisect, and the shape of a real upstream review cycle.'
hours: 40
coverage: full
outcomes:
- Read the release cycle and choose the right kernel branch for a task
- Configure and cross-compile a minimal guest kernel and explain why a requested option can vanish
- Boot a kernel in QEMU and report pass or fail from the guest to the host
- Build in-tree and out-of-tree modules and explain loading, versioning and taint
- Run the patch checking tools and find the right recipients
- Prepare, version and send a patch series by email and collect review trailers
- Write unit tests (KUnit) and interface tests (kselftest) with correct skip and fail behaviour
- Read KASAN and lockdep reports and use printk, dynamic debug and ftrace
- Bisect a regression with a scripted oracle and plan a revision from review comments
