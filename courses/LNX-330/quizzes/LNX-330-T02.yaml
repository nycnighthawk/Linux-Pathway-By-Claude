title: 'Quiz: Kconfig, defconfig, localmodconfig, cross-compiling'
questions:
- id: dropped
  prompt: A fragment requests CONFIG_KVM_INTEL=y but KVM is not enabled. What does the final .config contain?
  choices: ['# CONFIG_KVM_INTEL is not set, with only a warning', 'CONFIG_KVM_INTEL=m', 'A build error', 'CONFIG_KVM_INTEL=y']
  answer: [0]
  explain: 'A) correct: unmet dependencies drop the symbol silently. B) wrong. C) wrong. D) wrong.'
- id: select
  prompt: What is the hazard of select?
  choices: [It is slow, It disables modules, It forces a symbol on while ignoring that symbol's own dependencies, It needs root]
  answer: [2]
  explain: 'A) wrong. B) wrong. C) correct: the build can fail at link time. D) wrong.'
- id: savedefconfig
  prompt: What does make savedefconfig produce?
  choices: [A minimal config listing only symbols that differ from Kconfig defaults, A list of modules, A copy of the full .config, A kernel image]
  answer: [0]
  explain: 'A) correct. B) wrong. C) wrong. D) wrong.'
- id: cross
  prompt: Which are needed for an arm64 cross build with a gcc cross toolchain? (select two)
  choices: [A running arm64 machine, CONFIG_ARM64=y typed by hand in a fragment, CROSS_COMPILE=aarch64-linux-gnu-, ARCH=arm64]
  answer: [3, 2]
  explain: 'A) wrong. B) wrong. C) correct. D) correct.'
- id: localmod
  prompt: A kernel from localmodconfig lacks Wi-Fi after you plug in a new adapter. Why?
  choices: [Wi-Fi is not supported on Linux, Cross-compilation was used, The config is corrupt, Only modules loaded at the time of generation were kept]
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong. D) correct.'
- id: stale
  prompt: You switch ARCH in the same tree without cleaning and the build fails with relocation errors. What avoids it?
  choices: [Disabling modules, Higher -j, A separate O= directory per target or make mrproper, Using allyesconfig]
  answer: [2]
  explain: 'A) wrong. B) wrong. C) correct. D) wrong.'
