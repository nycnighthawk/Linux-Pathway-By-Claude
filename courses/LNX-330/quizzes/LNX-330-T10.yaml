title: 'Quiz: git bisect a regression'
questions:
- id: skipcode
  prompt: Which exit status tells git bisect run that a commit cannot be tested?
  choices:
  - '128'
  - '1'
  - '125'
  - '0'
  answer: [2]
  explain: 'A) wrong, 128 and above aborts the search. B) wrong, bad. C) correct. D) wrong, good.'
- id: steps
  prompt: About how many tests does bisection need for 10 000 commits?
  choices:
  - About 1 000
  - 10 000
  - About 100
  - About 14
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong. D) correct: log2(10 000) is about 13.3.'
- id: flaky
  prompt: A bug appears about one run in ten. How should the oracle treat it?
  choices:
  - Repeat the reproducer enough times, with the count chosen in advance, before calling a commit good
  - Ignore the bug
  - Skip the commit
  - One passing run is good enough
  answer: [0]
  explain: 'A) correct. B) wrong. C) wrong. D) wrong, a single pass proves nothing.'
- id: merge
  prompt: Bisect ends on a merge commit whose parents both test good. What is likely?
  choices:
  - Git is broken
  - The merge itself or its conflict resolution introduced the bug
  - The tag is wrong
  - Both parents are bad
  answer: [1]
  explain: 'A) wrong. B) correct: inspect the combined diff. C) wrong. D) wrong.'
- id: terms
  prompt: You want the commit that fixed a bug. What helps?
  choices:
  - git revert
  - git bisect skip
  - git bisect with custom terms such as --term-old=broken --term-new=fixed
  - git blame only
  answer: [2]
  explain: 'A) wrong. B) wrong. C) correct. D) wrong.'
- id: report
  prompt: What should a regression report to the maintainers include?
  choices:
  - Only the word regression
  - A private mail to the release manager only
  - A screenshot of the desktop
  - Versions, configuration, hardware, symptom, logs, bisect log and the culprit commit
  answer: [3]
  explain: 'A) wrong. B) wrong, keep it on the list. C) wrong. D) correct.'
