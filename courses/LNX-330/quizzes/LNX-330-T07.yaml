title: 'Quiz: KUnit (UML)'
questions:
- id: assertexpect
  prompt: When should a test use KUNIT_ASSERT instead of KUNIT_EXPECT?
  choices:
  - Never
  - When later lines would crash if the condition fails, such as after an allocation
  - Always
  - Only for strings
  answer: [1]
  explain: 'A) wrong. B) correct: ASSERT ends the case. C) wrong. D) wrong.'
- id: uml
  prompt: Why does kunit.py use UML by default?
  choices:
  - It is the only supported architecture
  - It replaces the compiler
  - It supports all drivers
  - It runs the kernel as a user process, quickly and without virtualisation or hardware
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong. D) correct.'
- id: static
  prompt: How can a KUnit test reach a static function in the file under test?
  choices:
  - By including the .c file in the test file
  - It cannot
  - By exporting it with EXPORT_SYMBOL_GPL
  - By using kselftest
  answer: [0]
  explain: 'A) correct, this is allowed for tests. B) wrong. C) wrong, not necessary. D) wrong.'
- id: output
  prompt: What output format do KUnit results use?
  choices:
  - JSON only
  - Binary
  - XML
  - TAP (Test Anything Protocol)
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong. D) correct, with nested subtests.'
- id: arch
  prompt: A test exercises architecture-specific assembly. Which option runs it on the right CPU model?
  choices:
  - --raw_output
  - --jobs
  - --kunitconfig
  - --arch=<name>, which uses QEMU
  answer: [3]
  explain: 'A) wrong, prints unfiltered output. B) wrong. C) wrong. D) correct.'
- id: quality
  prompt: How can you check that a test suite is effective?
  choices:
  - Check that it prints ok
  - Introduce a deliberate bug in the code and confirm a test fails
  - Run it twice
  - Count its lines
  answer: [1]
  explain: 'A) wrong, a passing suite proves nothing alone. B) correct, mutation testing. C) wrong. D) wrong.'
