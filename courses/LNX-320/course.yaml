id: LNX-320
title: Linux System Programming
summary: 'The Linux system call layer from user space: errno and strace, file I/O with locking and mmap, epoll and io_uring,
  processes and daemons, signals and timers, pthreads and futexes with the memory model, local IPC with descriptor passing,
  sockets, sandboxing with capabilities, seccomp, namespaces and Landlock, inotify and netlink, a ptrace tracer, libbpf CO-RE
  and NUMA and cache measurement.'
hours: 70
coverage: full
outcomes:
- 'Make system calls correctly: handle errno, short transfers and EINTR, and read traces with strace'
- 'Write file code that survives crashes: atomic replace, fsync discipline, advisory locks, and mmap with its signals'
- Build event-driven programs with epoll, signalfd, timerfd and non-blocking sockets, and explain where io_uring fits
- Create, supervise and reap processes, and write daemons that suit a service manager
- Use threads, futexes and C11 atomics correctly, and reason about the memory model
- Choose among pipes, Unix sockets with descriptor passing, shared memory and eventfd for local IPC
- Restrict a process with capabilities, seccomp-bpf, namespaces and Landlock, and test the denial paths
- Watch files and kernel state with inotify, fanotify and netlink, and build a ptrace tracer
- Write a CO-RE eBPF program and measure NUMA and cache effects before tuning
