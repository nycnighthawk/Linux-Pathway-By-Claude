title: 'Quiz: inotify/fanotify, netlink'
questions:
- id: batch
  prompt: A read on an inotify descriptor returns 200 bytes. What do you do?
  choices:
  - Call read again before parsing
  - Discard it
  - 'Walk the buffer: each record is the header plus len name bytes'
  - Treat it as one event
  answer:
  - 2
  explain: 'A) wrong. B) wrong. C) correct. D) wrong: several events can be packed.'
- id: rename
  prompt: How do you recognise the two halves of a rename in inotify?
  choices:
  - The same watch descriptor only
  - You cannot
  - They arrive as IN_MODIFY
  - IN_MOVED_FROM and IN_MOVED_TO events with the same cookie
  answer:
  - 3
  explain: A) wrong. B) wrong. C) wrong. D) correct.
- id: overflow
  prompt: Which are correct after IN_Q_OVERFLOW? (select two)
  choices:
  - Rescan the watched tree to resynchronise
  - Events were lost
  - Increase the watch count
  - The kernel replays them
  answer:
  - 1
  - 0
  explain: A) correct. B) correct. C) wrong. D) wrong.
- id: atomic
  prompt: An editor saves by writing a temp file and renaming it over the original. Why does a watch on the original file stop working?
  choices:
  - The watch follows the old inode which was replaced
  - Renames are not reported
  - The editor disables inotify
  - The file is locked
  answer:
  - 0
  explain: 'A) correct: watch the parent directory. B) wrong. C) wrong. D) wrong.'
- id: enobufs
  prompt: A netlink listener gets ENOBUFS. What should it do?
  choices:
  - Treat notifications as lost and re-dump the current state
  - Close the socket forever
  - Ignore it
  - Switch to polling /proc only
  answer:
  - 0
  explain: A) correct. B) wrong. C) wrong. D) wrong.
- id: perm
  prompt: Why is a fanotify permission listener dangerous?
  choices:
  - It needs no privilege
  - It uses too much CPU always
  - It cannot read files
  - While it does not answer, the operation that triggered the event stays blocked
  answer:
  - 3
  explain: 'A) wrong: it needs privilege. B) wrong. C) wrong. D) correct.'
