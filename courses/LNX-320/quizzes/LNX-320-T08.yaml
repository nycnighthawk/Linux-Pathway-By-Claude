title: 'Quiz: Sockets and non-blocking servers'
questions:
- id: connect
  prompt: A non-blocking connect returned EINPROGRESS. How do you learn the outcome?
  choices:
  - Wait for writability then read SO_ERROR with getsockopt
  - Call listen
  - Read from the socket
  - Call connect again and read errno
  answer:
  - 0
  explain: 'A) correct. B) wrong. C) wrong. D) wrong: a second connect gives confusing results.'
- id: epollout
  prompt: Why request EPOLLOUT only while the output buffer is non-empty?
  choices:
  - Sockets are almost always writable, so otherwise the loop wakes constantly
  - The kernel requires it
  - EPOLLOUT breaks edge triggering
  - It saves descriptors
  answer:
  - 0
  explain: A) correct. B) wrong. C) wrong. D) wrong.
- id: emfile
  prompt: A listener returns EMFILE from accept4 and the loop spins at 100% CPU. Why?
  choices:
  - The kernel lost the connection
  - epoll is broken
  - The backlog is zero
  - The connection stays queued so the listener stays readable
  answer:
  - 3
  explain: 'A) wrong. B) wrong. C) wrong. D) correct: keep a spare descriptor to accept and close, or pause accepting.'
- id: reset
  prompt: A server closes a connection while unread data sits in its receive buffer. What may the client see?
  choices:
  - A connection reset that can destroy the response it has not read
  - Nothing
  - A timeout only
  - A clean end of file
  answer:
  - 0
  explain: 'A) correct: use shutdown(SHUT_WR), drain, then close. B) wrong. C) wrong. D) wrong.'
- id: nagle
  prompt: Which two measures remove the delay from two small writes in a request/response protocol? (select two)
  choices:
  - Send header and body in one write
  - Increase SO_RCVBUF
  - Use SO_REUSEPORT
  - Set TCP_NODELAY
  answer:
  - 3
  - 0
  explain: A) correct. B) wrong. C) wrong. D) correct.
- id: reuseport
  prompt: What does SO_REUSEPORT allow?
  choices:
  - Skipping listen
  - Sharing a socket between hosts
  - Binding while connections are in TIME_WAIT
  - Several sockets of the same user to bind one port and have the kernel spread connections among them
  answer:
  - 3
  explain: 'A) wrong. B) wrong. C) wrong: that is SO_REUSEADDR. D) correct.'
