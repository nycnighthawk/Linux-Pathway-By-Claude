title: 'Quiz: ptrace - a tiny strace'
questions:
- id: sysgood
  prompt: What does PTRACE_O_TRACESYSGOOD do?
  choices:
  - Marks syscall stops as SIGTRAP|0x80 so they differ from a real SIGTRAP
  - Traces children
  - Kills the tracee on exit
  - Makes tracing faster
  answer:
  - 0
  explain: 'A) correct. B) wrong: that is TRACEFORK and friends. C) wrong: that is EXITKILL. D) wrong.'
- id: entryexit
  prompt: With PTRACE_SYSCALL, how often does the tracee stop for one system call?
  choices:
  - Once at entry only
  - Only on errors
  - 'Twice: at entry and at exit'
  - Never
  answer:
  - 2
  explain: A) wrong. B) wrong. C) correct, so the tracer must track which stop it is (or ask GET_SYSCALL_INFO). D) wrong.
- id: signals
  prompt: The tracee stops because it received SIGUSR1. What should a simple tracer do?
  choices:
  - Resume the tracee passing the signal number so the program still sees it
  - Swallow it
  - Kill the tracee
  - Detach
  answer:
  - 0
  explain: 'A) correct. B) wrong: it changes program behaviour. C) wrong. D) wrong.'
- id: perms
  prompt: Which statements are true? (select two)
  choices:
  - Only one tracer can be attached to a process at a time
  - Any user can trace any process
  - Yama ptrace_scope can limit tracing to descendants
  - ptrace works the same inside every container
  answer:
  - 0
  - 2
  explain: 'A) correct. B) wrong. C) correct. D) wrong: seccomp profiles and capabilities may block it.'
- id: overhead
  prompt: Why does strace slow down syscall-heavy programs so much?
  choices:
  - Each traced call costs context switches to the tracer and back at entry and exit
  - It compresses output
  - It disables the cache
  - It uses a slow disk
  answer:
  - 0
  explain: A) correct. B) wrong. C) wrong. D) wrong.
- id: abi
  prompt: A tracer prints the wrong names for a 32-bit program on a 64-bit kernel. Why?
  choices:
  - The program is corrupt
  - ptrace hides 32-bit programs
  - A different syscall table applies, so the 64-bit names are wrong
  - Names are random
  answer:
  - 2
  explain: A) wrong. B) wrong. C) correct. D) wrong.
