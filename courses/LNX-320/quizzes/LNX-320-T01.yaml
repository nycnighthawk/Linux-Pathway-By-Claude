title: 'Quiz: Syscalls, errno, glibc vs raw, strace'
questions:
- id: errno-after
  prompt: When may you rely on the value of errno?
  choices: [After any call, Never in a threaded program, Only right after a call that reported failure, Only after a call that succeeded]
  answer: [2]
  explain: 'A) wrong: success does not reset it, so it may hold an old value. B) wrong: errno is thread-local in glibc. C) correct. D) wrong.'
- id: clobber
  prompt: A failing open is followed by a logging call and then by strerror(errno), and the message names the wrong cause. What is the fix?
  choices: [Call strerror twice, Save errno in a local variable immediately after the failing call, Set errno to 0 first, Use syscall() instead]
  answer: [1]
  explain: 'A) wrong. B) correct: the logging call may have changed it. C) wrong: that destroys the value you need. D) wrong: a raw call still sets errno through the library.'
- id: vdso
  prompt: A program reads the clock a million times per second, yet strace shows no clock_gettime calls. Why?
  choices: [strace is broken, The calls are cached by the shell, clock_gettime is not a system call on Linux at all, The vDSO serves the call in user space without entering the kernel]
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong: there is a kernel call behind it, used when the vDSO cannot serve it. D) correct.'
- id: raw
  prompt: Which are valid reasons to call syscall() directly? (select two)
  choices: [A tool must avoid library interposition, It is faster than the wrapper in all cases, It checks argument types for you, The kernel has a new call with no glibc wrapper yet]
  answer: [3, 0]
  explain: 'A) correct. B) wrong: it does the same work. C) wrong: every argument is passed as a long, so types are not checked. D) correct.'
- id: inject
  prompt: Which strace option forces a chosen call to fail with a given error, to test an error path?
  choices: [-c, -yy, -T, -e inject=]
  answer: [3]
  explain: 'A) wrong: it counts calls. B) wrong: it decorates descriptors. C) wrong: it shows call times. D) correct.'
- id: eintr
  prompt: read returns -1 with errno EINTR. What does it mean?
  choices: [The descriptor is closed, The process lacks permission, The file is corrupt, A signal handler ran before any data was read; the call may be retried]
  answer: [3]
  explain: 'A) wrong: that would be EBADF. B) wrong: that would be EACCES or EPERM. C) wrong. D) correct.'
