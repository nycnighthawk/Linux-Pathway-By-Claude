title: 'Quiz: fork/exec/wait, sessions, daemons'
questions:
- id: zombie
  prompt: What is a zombie process?
  choices: [A finished child whose exit status the parent has not collected, A stopped job, A process stuck in an infinite loop, A process without a parent]
  answer: [0]
  explain: 'A) correct. B) wrong. C) wrong. D) wrong: that is an orphan, re-parented to init or a subreaper.'
- id: execpipe
  prompt: How does a parent learn that exec failed in the child, using a close-on-exec pipe?
  choices: [It reads errno from the pipe; end of file with no data means exec succeeded, It calls wait with WNOHANG, It checks the PID file, The child exits with code 127 always]
  answer: [0]
  explain: 'A) correct. B) wrong. C) wrong. D) wrong: a program can also exit with 127.'
- id: status
  prompt: A child died with WIFSIGNALED true and WTERMSIG 9. What does a shell report as the status?
  choices: ['137', '255', '9', '0']
  answer: [0]
  explain: 'A) correct: 128 + 9. B) wrong. C) wrong. D) wrong.'
- id: leaks
  prompt: Which are inherited across exec unless prevented? (select two)
  choices: [Signal handler functions, The heap contents, Open descriptors without close-on-exec, The signal mask]
  answer: [2, 3]
  explain: 'A) wrong: handlers reset to default. B) wrong: the image is replaced. C) correct. D) correct.'
- id: doublefork
  prompt: Why does the traditional daemon recipe fork a second time after setsid?
  choices: [To get a new PID file, To double the speed, To drop root, So the process is not a session leader and cannot reacquire a controlling terminal]
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong. D) correct.'
- id: threadfork
  prompt: In a multithreaded program, what is safe in the child between fork and exec?
  choices: [Only async-signal-safe functions, Any library call, Calling malloc and printf freely, Locking a mutex held by another thread]
  answer: [0]
  explain: 'A) correct. B) wrong: another thread may have held a lock that is never released in the child. C) wrong. D) wrong: it would block forever.'
