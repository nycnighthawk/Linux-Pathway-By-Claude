title: 'Quiz: epoll and io_uring'
questions:
- id: poll-cost
  prompt: Why does poll degrade with tens of thousands of descriptors, most idle?
  choices: [It only supports 1024 descriptors, The whole set is passed and scanned on every call so the cost follows the number watched, It cannot watch sockets, It always blocks]
  answer: [1]
  explain: 'A) wrong: that is the select limit. B) correct. C) wrong. D) wrong.'
- id: et
  prompt: What must a program do after an EPOLLET event on a socket?
  choices: [Read once, Read until EAGAIN with a non-blocking descriptor, Close and reopen, Call epoll_create again]
  answer: [1]
  explain: 'A) wrong: remaining data would not trigger another event. B) correct. C) wrong. D) wrong.'
- id: readiness
  prompt: Which statements are correct? (select two)
  choices: [epoll reports readiness and the program performs the read, io_uring completions carry the byte count of finished operations, epoll accepts buffers for the kernel to fill later, io_uring needs one system call per operation]
  answer: [0, 1]
  explain: 'A) correct. B) correct. C) wrong: that describes io_uring. D) wrong: batching and SQPOLL reduce calls.'
- id: files
  prompt: Why does epoll not help with reads from regular files?
  choices: [Files are always reported ready, so waiting tells you nothing, epoll rejects file descriptors with an error always on ext4 only, Files cannot be read, It is too slow]
  answer: [0]
  explain: 'A) correct. B) wrong: the main problem is the always-ready report (adding a regular file returns EPERM, which is a symptom of the same fact). C) wrong. D) wrong.'
- id: iouring-risk
  prompt: Why have some operators restricted io_uring?
  choices: [It is slower than epoll, It enlarged the kernel attack surface with many vulnerabilities, It lacks networking operations, It needs root]
  answer: [1]
  explain: 'A) wrong. B) correct. C) wrong: it has many. D) wrong.'
- id: oneshot
  prompt: What does EPOLLONESHOT do?
  choices: [Closes the descriptor after one event, Disarms the descriptor after one event until re-armed with epoll_ctl, Makes the mode edge-triggered, Limits the program to one thread]
  answer: [1]
  explain: 'A) wrong. B) correct: useful when several threads could handle the same descriptor. C) wrong: that is EPOLLET. D) wrong.'
