title: 'Quiz: eBPF from user space - libbpf CO-RE'
questions:
- id: btf
  prompt: What makes a BPF object portable across kernel versions with CO-RE?
  choices:
  - A kernel module per version
  - 'BTF type information: field accesses are recorded as relocations and fixed by libbpf at load time'
  - Recompiling on the target with kernel headers
  - Running as root
  answer:
  - 1
  explain: 'A) wrong. B) correct. C) wrong: that was the BCC approach. D) wrong.'
- id: flags
  prompt: Which clang options does a BPF object need? (select two)
  choices:
  - -O2 so the verifier accepts the code
  - -g so BTF and CO-RE relocations are produced
  - -static
  - -fPIC
  answer:
  - 0
  - 1
  explain: A) correct. B) correct. C) wrong. D) wrong.
- id: nullcheck
  prompt: A program uses the value returned by bpf_map_lookup_elem without a test. What happens?
  choices:
  - It runs
  - The verifier rejects it because the pointer may be NULL
  - The kernel adds the check
  - The map is created
  answer:
  - 1
  explain: A) wrong. B) correct. C) wrong. D) wrong.
- id: ring
  prompt: bpf_ringbuf_reserve returns NULL under load. What should the program do?
  choices:
  - Dereference it anyway
  - Count the drop (for example in a map) and return
  - Loop until it succeeds
  - Reboot
  answer:
  - 1
  explain: 'A) wrong. B) correct: events are lost and the loss should be visible. C) wrong: loops are bounded and spinning hurts. D) wrong.'
- id: hook
  prompt: Which hook is the most stable across kernel versions?
  choices:
  - A kprobe on an internal function
  - A tracepoint
  - A kprobe at a fixed address
  - A hardcoded struct offset
  answer:
  - 1
  explain: 'A) wrong: names change. B) correct. C) wrong. D) wrong.'
- id: priv
  prompt: Which capabilities are normally needed to load a tracing program without full root?
  choices:
  - CAP_BPF and CAP_PERFMON
  - CAP_CHOWN
  - CAP_KILL
  - None at all
  answer:
  - 0
  explain: 'A) correct. B) wrong. C) wrong. D) wrong: unprivileged BPF is usually disabled.'
