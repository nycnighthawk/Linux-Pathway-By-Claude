title: 'Quiz: PostgreSQL replication'
questions:
- id: async
  prompt: Why can asynchronous streaming replication lose data when the primary fails?
  choices:
  - The primary reports a commit before any standby has received it, so recent commits may exist only on the failed machine
  - Standbys cannot read WAL
  - WAL is never written to disk
  - Promotion deletes the data directory
  answer:
  - 0
  explain: 'A) correct: the recovery point is the replication lag. B) wrong: they can. C) wrong: WAL is written first. D) wrong: it does not.'
- id: basebackup
  prompt: What does the -R option of pg_basebackup do?
  choices:
  - Writes the connection settings and the signal file so the copy starts as a standby
  - Restarts the primary
  - Rewinds the old primary
  - Removes replication slots
  answer:
  - 0
  explain: 'A) correct: it writes primary_conninfo and standby.signal on PostgreSQL 12 and later. B) wrong: no restart. C) wrong: that is pg_rewind. D) wrong: unrelated.'
- id: slot
  prompt: A replication slot belongs to a standby that was decommissioned and never dropped. What happens?
  choices:
  - The primary keeps retaining WAL for it until the disk fills
  - The slot deletes itself after a day
  - Nothing, slots hold no data
  - The standby is promoted
  answer:
  - 0
  explain: 'A) correct: monitor slots and drop unused ones, or cap retention. B) wrong: not automatic. C) wrong: they retain WAL. D) wrong: unrelated.'
- id: oldprimary
  prompt: After a failover the old primary comes back. What must be done before it can follow the new primary?
  choices:
  - Rebuild it with pg_basebackup or rewind it with pg_rewind; never start it as a primary
  - Start it normally
  - Copy the new primary's pg_hba.conf
  - Nothing
  answer:
  - 0
  explain: 'A) correct: it may hold commits the new primary never saw. B) wrong: gives two primaries. C) wrong: irrelevant. D) wrong: it would diverge.'
- id: backup
  prompt: Why is a hot standby not a backup?
  choices:
  - A destructive statement such as DROP TABLE is replicated to it immediately
  - It cannot store data
  - It is always older than the primary by a day
  - It is encrypted with a lost key
  answer:
  - 0
  explain: 'A) correct: use base backups plus archived WAL for point-in-time recovery. B) wrong: it stores a full copy. C) wrong: it is near real time. D) wrong: irrelevant.'
- id: automatic
  prompt: What should an automatic failover mechanism rely on?
  choices:
  - A quorum or lease and fencing, not a single failed ping
  - Whichever node answers ping first
  - The oldest standby
  - Manual SSH by the owner
  answer:
  - 0
  explain: 'A) correct: it must be sure the old primary cannot write. B) wrong: a network blip would trigger it. C) wrong: irrelevant. D) wrong: that is manual failover.'
