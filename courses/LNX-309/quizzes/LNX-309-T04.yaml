title: 'Quiz: PostgreSQL replication'
questions:
- id: async
  prompt: Why can asynchronous streaming replication lose data when the primary fails?
  choices:
  - The standby discards WAL it has not yet applied when promoted
  - Asynchronous standbys receive WAL only at checkpoints
  - The primary confirms a commit before any standby has received it
  - The primary writes WAL to disk only after the standby confirms
  answer:
  - 2
  explain: 'A) wrong: received WAL is replayed on promotion. B) wrong: streaming sends WAL continuously. C) correct: recent commits may exist only on the failed machine. D) wrong: that would be synchronous replication.'
- id: basebackup
  prompt: What does the -R option of pg_basebackup do?
  choices:
  - Removes replication slots from the copy so it starts clean
  - Rewinds the copy to the last checkpoint before it starts
  - Restricts the copy to read-only tablespaces
  - Writes the standby settings and signal file into the copy
  answer:
  - 3
  explain: 'A) wrong: -R does not touch slots. B) wrong: that is pg_rewind, a separate tool. C) wrong: -R means write the recovery configuration. D) correct: -R prepares the copy for replication.'
- id: slot
  prompt: A replication slot belongs to a standby that was decommissioned and never dropped. What happens?
  choices:
  - The primary keeps retaining WAL for it until the disk fills
  - The slot is dropped automatically after a day without a client
  - The primary promotes another standby to use the slot
  - The slot keeps only the latest WAL segment, so it costs nothing
  answer:
  - 0
  explain: 'A) correct: an unused slot holds WAL forever. B) wrong: slots persist until dropped, unless a size limit is set. C) wrong: slots never trigger promotion. D) wrong: it retains everything since the client''s position.'
- id: oldprimary
  prompt: After a failover the old primary comes back. What must be done before it can follow the new primary?
  choices:
  - Start it normally; it detects the new primary and follows
  - Rebuild it or run pg_rewind before it follows
  - Copy the new primary's configuration files and restart it
  - Promote it again and let the two primaries reconcile
  answer:
  - 1
  explain: 'A) wrong: it would start as a second primary. B) correct: its history has diverged from the new primary. C) wrong: configuration does not fix a diverged timeline. D) wrong: PostgreSQL cannot reconcile two primaries.'
- id: backup
  prompt: Why is a hot standby not a backup?
  choices:
  - A standby lags by at least a day, so its data is stale
  - A standby cannot be read while it is replaying WAL
  - A destructive statement such as DROP TABLE is replicated to it at once
  - A standby holds only the tables marked for replication
  answer:
  - 2
  explain: 'A) wrong: streaming standbys usually lag by seconds. B) wrong: hot standbys accept reads. C) correct: a standby has no history to go back to. D) wrong: physical replication copies everything.'
- id: automatic
  prompt: What should an automatic failover mechanism rely on?
  choices:
  - Whichever standby answers ping first after a timeout
  - The standby with the oldest replay position
  - A cron job on the primary that promotes a standby
  - A quorum or lease plus fencing, not a single failed ping
  answer:
  - 3
  explain: 'A) wrong: a ping does not prove the primary has stopped. B) wrong: that would lose the most data. C) wrong: a failed primary cannot run the job. D) correct: one failed check is not proof the primary is gone.'
