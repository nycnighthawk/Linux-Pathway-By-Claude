title: 'Quiz: DRBD and GFS2'
questions:
- id: protocolc
  prompt: What does DRBD protocol C guarantee?
  choices:
  - A write completes only after both nodes have it on disk, so no acknowledged write is lost on failover
  - Writes are never replicated
  - Writes are acknowledged before they reach any disk
  - Only the first write is replicated
  answer:
  - 0
  explain: 'A) correct: it is synchronous, at the cost of latency. B) wrong: DRBD replicates. C) wrong: that is unsafe. D) wrong: all writes are replicated.'
- id: roles
  prompt: Why does the Pacemaker DRBD resource define separate monitor operations for the Promoted and Unpromoted roles?
  choices:
  - Pacemaker must tell the roles apart, which needs different intervals for each
  - DRBD has no other way to be monitored
  - It halves network traffic
  - The roles are the same
  answer:
  - 0
  explain: 'A) correct: duplicate intervals would make operations ambiguous. B) wrong: unrelated. C) wrong: unrelated. D) wrong: they differ.'
- id: dlm
  prompt: What does the distributed lock manager do when a node drops out of a GFS2 cluster?
  choices:
  - It freezes lock activity until the cluster has fenced the node, so a hung node cannot write
  - It lets every node write freely
  - It deletes the journal
  - It converts the file system to ext4
  answer:
  - 0
  explain: 'A) correct: safety needs a certainly-dead node. B) wrong: that would corrupt data. C) wrong: unrelated. D) wrong: unrelated.'
- id: splitbrain
  prompt: After a DRBD split brain, what usually has to happen?
  choices:
  - One side is chosen as the survivor and the other side discards its changes and resynchronises
  - Both sides merge automatically
  - The cluster reboots every node
  - Nothing, DRBD repairs it silently
  answer:
  - 0
  explain: 'A) correct: the histories diverged, so one must be thrown away. B) wrong: block-level data cannot be merged. C) wrong: does not repair. D) wrong: it refuses to connect.'
- id: backup
  prompt: Why is DRBD replication not a substitute for backups?
  choices:
  - A deleted or corrupted file is replicated to the peer immediately
  - DRBD cannot write to disks
  - Backups are slower
  - Replication is encrypted
  answer:
  - 0
  explain: 'A) correct: replication copies mistakes. B) wrong: it can. C) wrong: irrelevant. D) wrong: irrelevant.'
- id: choice
  prompt: A service can run on only one node at a time. Which design is usually best?
  choices:
  - DRBD with an ordinary file system and one primary, under Pacemaker
  - GFS2 on two primaries
  - A shared file system mounted on both nodes without a lock manager
  - No replication at all
  answer:
  - 0
  explain: 'A) correct: simplest safe design. B) wrong: needless complexity. C) wrong: corrupts data. D) wrong: nothing to fail over to.'
