title: 'Quiz: keepalived and HAProxy'
questions:
- id: vrrp
  prompt: How does VRRP decide which node holds the virtual address?
  choices:
  - The highest-priority node advertising becomes master
  - The node that started first keeps the address for good
  - The node with the lowest IP address always becomes master
  - Each node holds the address in turn on a fixed timer
  answer:
  - 0
  explain: 'A) correct: backups take over when advertisements stop. B) wrong: priority decides, and failover moves it. C) wrong: address breaks ties only for equal priority. D) wrong: VRRP elects one master.'
- id: nonlocal
  prompt: Why set net.ipv4.ip_nonlocal_bind=1 on the load balancers?
  choices:
  - So the standby answers ARP for the virtual address too
  - So HAProxy on the standby can bind the virtual address it does not hold
  - So keepalived can send advertisements as unicast
  - So the kernel accepts traffic for any address on the subnet
  answer:
  - 1
  explain: 'A) wrong: that would cause address conflicts. B) correct: without it the standby''s HAProxy fails to start. C) wrong: that is unicast_peer, a different setting. D) wrong: it only allows binding, not accepting.'
- id: fall
  prompt: In "check inter 2s fall 3 rise 2", what happens after three consecutive failed checks?
  choices:
  - HAProxy restarts itself to clear the failing connections
  - The virtual address moves to the other load balancer
  - The server is marked down and receives no new requests
  - The server is drained, finishing only requests already queued
  answer:
  - 2
  explain: 'A) wrong: HAProxy does not restart on a failed check. B) wrong: that is keepalived''s job. C) correct: fall 3 means three failed checks mark it down. D) wrong: drain is a separate admin state.'
- id: splitbrain
  prompt: Both load balancers show the virtual address. What is the most likely cause?
  choices:
  - Both nodes were given the same priority in keepalived
  - HAProxy health checks failed on both nodes at once
  - The virtual address was added to DNS twice
  - VRRP adverts are lost, so each node thinks the other died
  answer:
  - 3
  explain: 'A) wrong: equal priority still elects one master. B) wrong: health checks do not assign addresses. C) wrong: DNS does not decide which node holds the address. D) correct: filtered multicast or a firewall is the usual cause.'
- id: cloud
  prompt: Why is keepalived often unsuitable in a public cloud?
  choices:
  - The virtual network blocks VRRP multicast and ignores gratuitous ARP
  - Cloud providers do not allow HAProxy to listen on public ports
  - Cloud instances cannot run more than one network interface
  - Cloud images ship without the kernel module keepalived needs
  answer:
  - 0
  explain: 'A) correct: use the provider API or a managed balancer instead. B) wrong: HAProxy runs in clouds routinely. C) wrong: most providers allow several. D) wrong: the limit is the network, not the kernel.'
- id: pick
  prompt: A stateful database needs shared storage and strict start order. Which front-end design fits best?
  choices:
  - keepalived with a health script
  - A Pacemaker cluster with fencing
  - DNS round robin across both nodes
  - Two independent nodes behind HAProxy
  answer:
  - 1
  explain: 'A) wrong: it moves an address but cannot order storage and services. B) correct: it handles shared storage and ordered starts safely. C) wrong: it gives no failover and no ordering. D) wrong: a stateful database cannot be split like that.'
