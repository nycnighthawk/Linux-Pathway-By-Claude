id: LNX-309
title: High Availability & Clusters
summary: 'Keep services running when machines fail: Pacemaker and Corosync with fencing, replicated and shared storage, floating
  addresses with keepalived and HAProxy, database replication, disaster-recovery drills, and real power fencing.'
hours: 40
outcomes:
- Build and operate a Pacemaker and Corosync cluster with quorum and fencing
- Explain DRBD replication and cluster filesystems such as GFS2, and when not to use them
- Provide a floating address and health-checked load balancing with keepalived and HAProxy
- Set up and promote PostgreSQL streaming replication and reason about data loss
- Plan and run disaster-recovery drills against stated recovery objectives
- Choose and test power fencing on real hardware
