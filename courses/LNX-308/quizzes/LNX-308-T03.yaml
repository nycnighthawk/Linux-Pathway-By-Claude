title: 'Quiz: VM networking: bridges, macvtap, VLANs'
questions:
- id: nat
  prompt: Why can a LAN host not reach a guest on libvirt's default NAT network?
  choices:
  - DHCP is disabled
  - Guest addresses are private behind host translation, so inbound connections need port forwards or routing
  - The guest has no IP
  - macvtap is active
  answer:
  - 1
  explain: 'A) wrong: it is enabled by default. B) correct: NAT hides guests; use a bridge, a routed network or forwards. C) wrong: it has one from dnsmasq. D) wrong: the default network uses a bridge virbr0.'
- id: macvtap-host
  prompt: A guest attached through macvtap on eth0 cannot talk to the hypervisor, but everyone else can. Why?
  choices:
  - virtio is missing
  - The guest is misconfigured
  - Macvtap traffic leaves through eth0 and is not looped back to the host's own stack on that interface
  - VLAN tag mismatch
  answer:
  - 2
  explain: 'A) wrong: the model does not affect this. B) wrong: other machines reach it. C) correct: the common workaround is a macvlan interface for the
    host or a real bridge. D) wrong: no tags are involved.'
- id: vlan-filter
  prompt: What does enabling vlan_filtering on a Linux bridge allow?
  choices:
  - One bridge acting like a managed switch with per-port VLAN membership
  - Disabling STP
  - Encrypting traffic
  - Faster NAT
  answer:
  - 0
  explain: 'A) correct: trunk uplink, access ports for guests, no bridge per VLAN. B) wrong: unrelated. C) wrong: not its function. D)
    wrong: unrelated.'
- id: xml-tag
  prompt: Which XML gives a guest an access port on VLAN 20 of a VLAN-aware bridge?
  choices:
  - <vlan trunk='yes'><tag id='20'/></vlan>
  - <tag vlan='20'/>
  - <vlan><tag id='20'/></vlan>
  - <bridge vlan='20'/>
  answer:
  - 2
  explain: 'A) wrong: trunk=''yes'' means the guest receives tagged frames for the listed VLANs. B) wrong: not a libvirt element. C) correct: a single
    tag without trunk is an access port. D) wrong: not a libvirt element.'
- id: diag
  prompt: Guest cannot get a DHCP lease. Which first step localises the fault best?
  choices:
  - Change the machine type
  - Reinstall the guest
  - tcpdump on the guest's vnet tap and then on the bridge to see where the DISCOVER stops
  - Reboot the host
  answer:
  - 2
  explain: 'A) wrong:
    unrelated. B) wrong: destroys evidence. C) correct: walks the path hop by hop. D) wrong: hides the cause.'
- id: fw
  prompt: After installing Docker, guest NAT stops. What is the likely cause?
  choices:
  - The FORWARD chain policy became DROP without rules accepting libvirt traffic
  - DNS expired
  - QEMU crashed
  - Docker removes virbr0
  answer:
  - 0
  explain: 'A) correct: firewall managers compete for the
    same chains. B) wrong: would not stop all outbound traffic. C) wrong: guests would be down. D) wrong: it does not touch libvirt bridges directly.'
