title: 'Quiz: Live migration between hypervisors'
questions:
- id: precopy
  prompt: Why is a failed pre-copy migration safe?
  choices:
  - The destination keeps a full copy
  - Until the final step the source holds the authoritative state and keeps running
  - Pre-copy uses shared memory
  - libvirt snapshots first
  answer:
  - 1
  explain: 'A) wrong: it may be incomplete. B) correct: abort leaves the guest where it was. C) wrong: it does not.
    D) wrong: it does not.'
- id: postcopy
  prompt: What is the main risk of post-copy?
  choices:
  - It is slower
  - If the link fails after switching, memory is split between hosts and the guest can be lost
  - It needs shared CPUs
  - It disables TLS
  answer:
  - 1
  explain: 'A) wrong: it finishes in bounded time. B) correct: neither host holds the full state. C) wrong: no.
    D) wrong: no.'
- id: cpu
  prompt: Which CPU mode lets libvirt check compatibility before migrating?
  choices:
  - host-passthrough
  - host-model
  - none
  - emulated only
  answer:
  - 1
  explain: 'A) wrong: exposes the host CPU as is, so it cannot be verified in advance. B) correct: exposes host
    features in a checkable way. C) wrong: a CPU must be chosen. D) wrong: not a libvirt mode.'
- id: copy-storage
  prompt: What must exist on the destination before virsh migrate --copy-storage-all?
  choices:
  - Nothing
  - Empty images of the same size and path as the guest's disks
  - A snapshot
  - A copy of the QEMU binary
  answer:
  - 1
  explain: 'A) wrong: the images are not created automatically. B) correct: the mirror writes into them. C) wrong:
    not needed. D) wrong: the destination has its own.'
- id: abort
  prompt: How do you cancel a running migration, and where is the guest afterwards?
  choices:
  - virsh domjobabort, guest still on the source
  - virsh destroy, guest gone
  - virsh undefine, guest on the destination
  - Reboot the source
  answer:
  - 0
  explain: 'A) correct: pre-copy abort leaves the source running. B) wrong: destroys it. C) wrong: not an abort.
    D) wrong: unnecessary and disruptive.'
- id: unsafe
  prompt: Why should you never use --unsafe?
  choices:
  - It encrypts less
  - It skips cache-safety checks and can corrupt disks on shared storage
  - It prevents TLS
  - It disables post-copy
  answer:
  - 1
  explain: 'A) wrong: unrelated. B) correct: the check protects consistency. C) wrong: unrelated. D) wrong: unrelated.'
