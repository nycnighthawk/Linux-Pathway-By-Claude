title: 'Quiz: virtio, hugepages, CPU pinning (functional)'
questions:
- id: virtio
  prompt: Why is virtio-net faster than an emulated e1000?
  choices:
  - It bypasses the host entirely
  - The guest driver knows it is virtual and exchanges batches through shared rings, avoiding many VM exits
  - It uses a faster physical card
  - It disables the firewall
  answer:
  - 1
  explain: 'A) wrong: vhost still uses host paths. B) correct: emulated registers trap on each access. C) wrong: both are virtual. D) wrong: unrelated.'
- id: pages
  prompt: How many 2 MiB huge pages does a 6 GiB guest need?
  choices:
  - '12288'
  - '6144'
  - '1536'
  - '3072'
  answer:
  - 3
  explain: 'A) wrong: double the correct value. B) wrong: that counts
    MiB, not pages. C) wrong: 6 GiB is 6144 MiB, so 3072 pages. D) correct: 6144 MiB divided by 2 MiB.'
- id: balloon
  prompt: Why remove the memory balloon from a guest backed by huge pages?
  choices:
  - It slows the host disk
  - It breaks virtio-net
  - Balloons are insecure
  - A balloon cannot reclaim huge pages, so it is useless and complicates sizing
  answer:
  - 3
  explain: 'A) wrong: unrelated. B) wrong: unrelated. C) wrong: not the reason. D) correct: reserved pages are fixed.'
- id: emulator
  prompt: Where should emulatorpin and iothreadpin point?
  choices:
  - Every core
  - The same cores as the vCPUs
  - Housekeeping cores outside the pinned vCPU set
  - Nowhere, they are unnecessary
  answer:
  - 2
  explain: 'A) wrong: defeats pinning. B) wrong: they would compete and stall devices. C) correct: keeps device emulation from starving the
    vCPUs. D) wrong: unpinned they may land on vCPU cores.'
- id: numa
  prompt: What does <numatune><memory mode='strict' nodeset='0'/></numatune> do?
  choices:
  - Limits guest memory size
  - Pins vCPUs
  - Allocates guest memory only from NUMA node 0, failing rather than using another node
  - Enables huge pages
  answer:
  - 2
  explain: 'A)
    wrong: size is set by memory. B) wrong: that is cputune. C) correct: strict forbids fallback. D) wrong: that is memoryBacking.'
- id: verify
  prompt: Which tool shows where a guest's memory actually sits?
  choices:
  - lsblk
  - ip link
  - virsh list
  - numastat -p <qemu pid>
  answer:
  - 3
  explain: 'A) wrong: lists block devices. B) wrong: lists
    interfaces. C) wrong: lists guests only. D) correct: it reports per-node memory for a process.'
