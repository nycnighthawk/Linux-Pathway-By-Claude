title: 'Quiz: Proxmox/oVirt clusters'
questions:
- id: quorum
  prompt: What is the quorum for a cluster with 5 votes?
  choices:
  - '3'
  - '4'
  - '2'
  - '5'
  answer:
  - 0
  explain: 'A) correct: a strict majority of 5. B) wrong: more than needed. C) wrong: not a majority. D) wrong:
    tolerates no failure.'
- id: two
  prompt: Why does a two-node cluster without a tie-break stop when either node fails?
  choices:
  - The survivor holds 1 of 2 votes, which is not a majority, and cannot tell a dead peer from a broken link
  - Ceph requires it
  - Corosync needs three NICs
  - It overheats
  answer:
  - 0
  explain: 'A) correct: add a QDevice or witness. B) wrong: no. C) wrong: no. D) wrong: no.'
- id: fencing
  prompt: Why is pinging a host and restarting its guests elsewhere not high availability?
  choices:
  - Pings are slow
  - The host may be alive but unreachable, so both hosts write the same disk without fencing
  - Guests cannot be restarted
  - Shared storage forbids it
  answer:
  - 1
  explain: 'A) wrong: not the issue. B) correct: fencing makes sure the old host is off first. C) wrong: they can.
    D) wrong: it enables it.'
- id: state
  prompt: Where does Proxmox VE keep cluster configuration compared with oVirt?
  choices:
  - Both use one central engine
  - Proxmox replicates it in pmxcfs on every node, oVirt keeps it in the engine database
  - Both keep it in /etc/libvirt
  - Both use Kubernetes
  answer:
  - 1
  explain: 'A) wrong: oVirt does, Proxmox does not. B) correct: distributed versus central. C) wrong: no. D) wrong:
    no.'
- id: network
  prompt: Why keep Corosync traffic off the storage network?
  choices:
  - It saves cables
  - Corosync is encrypted
  - Heavy storage or migration traffic can delay heartbeats and cause evictions
  - Storage blocks UDP
  answer:
  - 2
  explain: 'A) wrong: not
    the reason. B) wrong: not the reason. C) correct: latency under about 5 ms is needed. D) wrong: no.'
- id: maintenance
  prompt: In a three-node cluster, what is a safe way to patch hosts?
  choices:
  - All at once
  - One node at a time, checking cluster status between them
  - Two at a time
  - Remove quorum with expected 1 first
  answer:
  - 1
  explain: 'A) wrong: quorum lost. B) correct: a majority stays up. C) wrong: one vote below quorum. D) wrong: emergency
    measure, voids guarantees.'
