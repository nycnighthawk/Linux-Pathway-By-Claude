id: LNX-308
title: Virtualization with KVM & libvirt
summary: 'How Linux runs guests: the KVM, QEMU and libvirt stack, qcow2 templates and snapshots, bridges, macvtap and VLANs,
  virtio, huge pages and CPU pinning, live migration, system containers, nested virtualisation and microVMs, and cluster managers
  such as Proxmox VE and oVirt.'
hours: 40
coverage: full
outcomes:
- Build and manage KVM guests with libvirt, virsh and virt-install and read the domain XML
- Create templates, overlays and snapshots and customise images offline
- Connect guests with NAT, bridges, VLANs and macvtap and diagnose the path
- Apply virtio, huge pages, NUMA and CPU pinning and verify the effect
- Plan and run a live migration and judge CPU and storage compatibility
- Run system containers with systemd-nspawn, LXC and Incus and choose between containers and VMs
- Enable nested virtualisation and configure a Firecracker microVM
- Explain quorum, fencing and shared storage in Proxmox VE and oVirt clusters
