id: LNX-403
title: 'Capstone: Ship a Linux Service'
summary: A graded, multi-stage project for the developer pathway. You write a socket-activated epoll daemon that reports readiness
  to systemd, put fuzzing and sanitizers into CI, package it as RPM, DEB, Flatpak and an OCI image with one version, harden
  its unit, profile it with flame graphs, and keep it released for weeks while real users report issues. Four stages are graded
  in CI; two are guided evidence stages.
hours: 80
coverage: full
outcomes:
- Write a service that adopts a passed socket, serves many clients from one event loop, and reports readiness and shutdown
- Build a fuzz target, a replay corpus and a sanitizer lane into CI so crashes fail the build and are kept as regression tests
- Keep four package formats consistent from one version and one licence statement
- Harden a systemd unit to least privilege and read its exposure
- Profile a service on a quiet machine, change one thing and prove the gain exceeds the noise
- Run a public release process with signed tags, a changelog, issue triage and a security policy
