title: 'Quiz: qcow2, backing chains and block jobs'
questions:
- id: tiny
  prompt: Why is a new 100 GiB qcow2 image small on disk?
  choices: [Tables and clusters are allocated on demand, It stores only the header forever, It is compressed, It is a sparse raw file]
  answer: [0]
  explain: 'A) correct: unallocated clusters read as zeros or from the backing file. B) wrong: data clusters are added on write. C) wrong. D) wrong.'
- id: rebase-u
  prompt: When is qemu-img rebase -u (unsafe) the right choice?
  choices: [You want to flatten the chain, The new base has different content, The overlay is corrupted, The base file was moved or renamed and its content is identical]
  answer: [3]
  explain: 'A) wrong: use convert. B) wrong: use safe rebase so data is copied. C) wrong. D) correct: only the stored path changes.'
- id: commit-pull
  prompt: Which is a block pull?
  choices: [Merge the overlay into the base, Copy the disk to new storage, Create an external snapshot, Stream data from the backing files into the overlay so the dependency can be removed]
  answer: [3]
  explain: 'A) wrong: that is commit. B) wrong: that is blockcopy (mirror). C) wrong. D) correct.'
- id: format-flag
  prompt: Why should an overlay always record its backing file format?
  choices: [Libvirt requires gzip, Probing the format of an untrusted backing file can be abused to read host files, It makes the overlay smaller, It enables compression]
  answer: [1]
  explain: 'A) wrong. B) correct. C) wrong. D) wrong.'
- id: backup
  prompt: What does an incremental restore need? (select two)
  choices: [The full backup, Only the latest increment, Each increment since the full in order, The original base image path]
  answer: [0, 2]
  explain: 'A) correct. B) wrong: an increment holds only changed clusters. C) correct. D) wrong.'
