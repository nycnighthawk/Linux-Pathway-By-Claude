title: 'Quiz: Performance tuning for guests'
questions:
- id: strict
  prompt: Why prefer numatune mode strict over preferred for a latency-sensitive guest?
  choices: [Strict is faster to configure, Preferred silently falls back to other nodes and hides a layout failure, Strict uses less memory, Preferred needs hugepages]
  answer: [1]
  explain: 'A) wrong. B) correct: with strict, an unsatisfiable layout fails loudly. C) wrong. D) wrong.'
- id: siblings
  prompt: On this host the SMT sibling of CPU 8 is CPU 24. Which pinning keeps guest SMT pairs on one core?
  choices: [vCPU 0 to CPU 8 and vCPU 1 to CPU 9, vCPU 0 to CPU 8 and vCPU 1 to CPU 24, vCPU 0 to CPU 8 and vCPU 1 to CPU 16, Leave it to the scheduler]
  answer: [1]
  explain: 'A) wrong: those are different cores. B) correct. C) wrong: CPU 16 belongs to node 0. D) wrong: that is the untuned case.'
- id: tradeoffs
  prompt: What do pinned, hugepage-backed guests give up? (select two)
  choices: [Memory overcommit and ballooning, Easy live migration to any host, Multiqueue virtio, Any benefit from NUMA]
  answer: [0, 1]
  explain: 'A) correct: the memory is reserved. B) correct: the destination needs an identical free layout. C) wrong. D) wrong.'
- id: scsi
  prompt: Which need points to virtio-scsi?
  choices: [One disk needing the highest IOPS, Forty disks on one controller with UNMAP and persistent reservations, A guest without IOThreads, Booting without firmware]
  answer: [1]
  explain: 'A) wrong: virtio-blk has the shortest path. B) correct. C) wrong. D) wrong.'
- id: measure
  prompt: Which result is most trustworthy after a tuning change?
  choices: [An average from a short micro-benchmark, Tail latency percentiles and throughput from a realistic workload before and after one change, A lower CPU load figure, The XML looking cleaner]
  answer: [1]
  explain: 'A) wrong: averages hide jitter. B) correct. C) wrong. D) wrong.'
