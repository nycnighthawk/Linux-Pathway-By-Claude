title: 'Quiz: VFIO PCI passthrough and IOMMU groups'
questions:
- id: why-iommu
  prompt: Why is an IOMMU required to assign a PCI device to an untrusted guest?
  choices: [It emulates the device, It confines the device's DMA to memory the host mapped for it, It hides the device from the host, It speeds up the CPU]
  answer: [1]
  explain: 'A) wrong. B) correct: otherwise the guest could aim the device at host memory. C) wrong. D) wrong.'
- id: group-rule
  prompt: A GPU shares an IOMMU group with a SATA controller that holds the host's boot disk. What is the safe conclusion?
  choices: [Assign only the GPU; the group does not matter, The GPU cannot be assigned without also giving away the SATA controller, unless the hardware or slot changes, Disable the IOMMU, Use iommu=pt to split the group]
  answer: [1]
  explain: 'A) wrong: VFIO requires the group to be viable. B) correct: all endpoint devices of a group share one owner. C) wrong: it removes the protection. D) wrong: iommu=pt does not change group membership.'
- id: binding
  prompt: Which settings give dynamic binding for a hostdev in libvirt?
  choices: [type='usb', managed='no', mode='capabilities', managed='yes']
  answer: [3]
  explain: 'A) wrong. B) wrong: you must bind to vfio-pci yourself. C) wrong. D) correct: libvirt unbinds the host driver at start and restores it at stop.'
- id: consequences
  prompt: Which features stop working for a guest with a passed-through device? (select two)
  choices: [Memory ballooning, Booting from a virtio disk, Ordinary live migration, Using hugepages]
  answer: [0, 2]
  explain: 'A) correct: guest RAM is pinned. B) wrong. C) correct: device state cannot be saved generically. D) wrong: hugepages help.'
- id: reset
  prompt: A guest using a passed-through GPU is rebooted and the card stays dead until the host reboots. What is the likely cause?
  choices: [The guest used virtio, A missing kernel parameter, The device has no working reset method, A wrong group number]
  answer: [2]
  explain: 'A) wrong. B) wrong. C) correct: check reset_method in sysfs; some cards cannot be reset cleanly. D) wrong.'
