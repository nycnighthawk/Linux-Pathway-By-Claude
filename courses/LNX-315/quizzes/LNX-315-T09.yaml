title: 'Quiz: KubeVirt and OpenShift Virtualization'
questions:
- id: launcher
  prompt: What runs inside a virt-launcher pod?
  choices: [A copy of etcd, The Kubernetes scheduler, libvirt and the QEMU process for one VM, The CDI importer]
  answer: [2]
  explain: 'A) wrong. B) wrong. C) correct. D) wrong: CDI runs its own pods.'
- id: vm-vs-vmi
  prompt: Which object holds the durable definition and run strategy?
  choices: [DataVolume, VirtualMachine, VirtualMachineInstanceMigration, VirtualMachineInstance]
  answer: [1]
  explain: 'A) wrong: it describes a disk import. B) correct. C) wrong: it describes one migration. D) wrong: it is the running instance.'
- id: migration
  prompt: Which are requirements or blockers for live migration? (select two)
  choices: [Masquerade networking is forbidden, Shared storage with a shared access mode, A passed-through PCI device blocks it, The VM must use SATA]
  answer: [1, 2]
  explain: 'A) wrong. B) correct. C) correct. D) wrong.'
- id: cdi
  prompt: What does a DataVolume do?
  choices: [Defines a source and populates a claim before the VM starts, Starts the VM, Replaces the node agent, Sets the CPU model]
  answer: [0]
  explain: 'A) correct. B) wrong. C) wrong. D) wrong.'
- id: console
  prompt: Who may open a guest console through virtctl?
  choices: [Nobody, Users the Kubernetes RBAC allows for the VM subresources, Anyone on the network, Only the node admin]
  answer: [1]
  explain: 'A) wrong. B) correct. C) wrong. D) wrong.'
