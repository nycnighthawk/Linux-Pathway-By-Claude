title: 'Quiz: Firmware, trusted boot and confidential VMs'
questions:
- id: ovmf-need
  prompt: Which guest needs OVMF rather than SeaBIOS?
  choices: [A DOS test image, A Windows 11 guest with Secure Boot, A guest with one serial console, A guest using virtio-net]
  answer: [1]
  explain: 'A) wrong: legacy BIOS suits it. B) correct: Secure Boot and Windows 11 require UEFI. C) wrong. D) wrong: virtio works with either.'
- id: smm
  prompt: Why does the guest XML set smm state='on' for Secure Boot?
  choices: [To speed up boot, To protect the firmware variable store from the running guest OS, To enable nested virtualisation, To select q35]
  answer: [1]
  explain: 'A) wrong. B) correct: the secure OVMF build writes variables from SMM. C) wrong. D) wrong.'
- id: tpm-state
  prompt: A VM is redefined and its swtpm state directory is deleted. What is the consequence for BitLocker?
  choices: [Nothing, The sealed key cannot be unsealed and recovery is needed, The disk is re-encrypted, Secure Boot turns off]
  answer: [1]
  explain: 'A) wrong. B) correct: the TPM no longer holds the sealing material. C) wrong. D) wrong.'
- id: snp-adds
  prompt: What does SEV-SNP add over SEV-ES? (select two)
  choices: [Memory integrity protection against remapping and replay, Encrypted guest register state, Stronger attestation with a launch measurement report, Faster live migration]
  answer: [0, 2]
  explain: 'A) correct. B) wrong: ES already did that. C) correct. D) wrong: migration is harder.'
- id: attest
  prompt: What should a key broker do before releasing a secret to a confidential guest?
  choices: [Trust any guest that boots, Verify the signed report chain and compare the measurement to a known-good value, Check the guest IP address, Ask the host admin]
  answer: [1]
  explain: 'A) wrong. B) correct: that is what proves what is running. C) wrong. D) wrong: the host admin is outside the trust boundary.'
