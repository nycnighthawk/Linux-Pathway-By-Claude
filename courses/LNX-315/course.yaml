id: LNX-315
title: Virtualization Engineering
summary: 'Running virtualization as a platform: PCI passthrough with VFIO and IOMMU groups, SR-IOV, performance tuning with
  NUMA, pinning, hugepages and IOThreads, qcow2 internals and block jobs, firmware and confidential VMs, VirtualBox administration
  and coexistence with KVM, image pipelines with Packer and cloud-init, KubeVirt, migration from VMware and live migration
  tuning.'
hours: 60
coverage: full
outcomes:
- Plan and verify PCI passthrough and SR-IOV, including IOMMU group constraints
- Tune guests for NUMA, CPU pinning, hugepages and disk I/O and measure the effect
- Explain qcow2 internals and operate backing chains and block jobs safely
- Choose firmware, Secure Boot, vTPM and confidential VM options for a workload
- Administer VirtualBox headless and reason about running it beside QEMU/KVM
- Build repeatable VM images with Packer, virt-builder and cloud-init
- Run virtual machines on Kubernetes with KubeVirt, and plan a migration from VMware
- Tune live migration for convergence and bounded downtime
