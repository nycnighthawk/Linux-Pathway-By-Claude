title: 'Quiz: LDAP servers and clients'
questions:
- id: acl-order
  prompt: 'Two slapd access rules both match a request: ''to * by * read'' is listed first and ''to attrs=userPassword by self write by * none'' second. What happens to a read of userPassword by an ordinary user?'
  choices:
  - It is allowed only if the user binds over TLS
  - slaptest refuses the file as ambiguous
  - It is denied, because the more specific rule wins wherever it sits
  - It is allowed, because the first matching 'to' clause is the one that applies
  answer:
  - 3
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) wrong: see the lesson. D) correct: see the lesson.'
- id: starttls-vs-ldaps
  prompt: Which statement about protecting an LDAP bind is correct?
  choices:
  - A simple bind is safe on a trusted LAN, because the password is hashed in transit by the client
  - TLS is only needed for the administrator account
  - StartTLS upgrades a connection on port 389; ldaps:// wraps TLS from the first byte
  - ldaps:// is the standardised method and StartTLS is a vendor extension
  answer:
  - 2
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) correct: see the lesson. D) wrong: see the lesson.'
- id: ldapsearch-flags
  prompt: You want ldapsearch to insist on StartTLS and stop if the upgrade fails. Which option?
  choices:
  - -LLL
  - -x
  - -ZZ
  - -Z
  answer:
  - 2
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) correct: see the lesson. D) wrong: see the lesson.'
- id: tls-reqcert
  prompt: A client has TLS_REQCERT never in ldap.conf because a certificate once failed in testing. What is the practical effect?
  choices:
  - Only expired certificates are accepted
  - The client falls back to anonymous binds
  - Any certificate is accepted, so an active attacker can impersonate the server
  - Nothing changes, because certificates are still verified against the configured CA file
  answer:
  - 2
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) correct: see the lesson. D) wrong: see the lesson.'
- id: group-schema
  prompt: A directory exported from Active Directory stores group members as member DNs, but Linux clients show only the primary group. Why?
  choices:
  - The index on the uid attribute is missing, so each group lookup walks the whole tree
  - ldapsearch needs -ZZ
  - TLS is misconfigured
  - The client expects RFC 2307 memberUid names, but the data uses member DNs
  answer:
  - 3
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) wrong: see the lesson. D) correct: see the lesson.'
- id: backup
  prompt: Which backup method works for OpenLDAP without needing the server to be reachable on the network?
  choices:
  - Copying the mdb directory while slapd is writing
  - ldapsearch with a root bind, once a year
  - slapcat to LDIF, restored later with slapadd
  - Backing up /etc/ldap/ldap.conf
  answer:
  - 2
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) correct: see the lesson. D) wrong: see the lesson.'
- id: syncrepl
  prompt: In a multi-provider OpenLDAP pair, why do operators usually send writes to one node at a time?
  choices:
  - Replication only works in one direction, so a second writer would never be read
  - Conflicting concurrent writes are settled by timestamp, so a loser can vanish
  - The second node has no schema
  - slapd allows only one TCP connection
  answer:
  - 1
  explain: 'A) wrong: see the lesson. B) correct: see the lesson. C) wrong: see the lesson. D) wrong: see the lesson.'
- id: acl-case
  prompt: A new slapd rule "to attrs=userPassword by self write" was added below "to * by * read", yet users still read other users' userPassword. Why?
  choices:
  - The first matching clause applies, so the broad rule above it wins
  - slapd applies the most specific clause no matter where in the file it sits
  - The user must first bind over TLS before the new rule is read by the server
  - The rule needs a restart of slapd, which was not done after the change was made
  answer:
  - 0
  explain: 'A) correct: order matters. B) wrong: not how ACLs work. C) wrong: TLS does not change order. D) wrong: changes are read at once.'
