title: 'Quiz: ID mapping, sssctl troubleshooting'
questions:
- id: same-algo
  prompt: Why do two SSSD hosts with the same ID mapping settings give a user the same UID?
  choices:
  - They share a database
  - The UID is computed from the SID with a shared algorithm and range settings
  - They both read /etc/passwd
  - UIDs are random, but by chance they happen to match on the two hosts
  answer:
  - 1
  explain: 'A) wrong: see the lesson. B) correct: see the lesson. C) wrong: see the lesson. D) wrong: see the lesson.'
- id: slice-math
  prompt: With ldap_idmap_range_min = 200000 and ldap_idmap_range_size = 200000, which UID does RID 1105 get in slice 3 (counting from 0)?
  choices:
  - '600000'
  - '801105'
  - '3001105'
  - '201105'
  answer:
  - 1
  explain: 'A) wrong: see the lesson. B) correct: see the lesson. C) wrong: see the lesson. D) wrong: see the lesson.'
- id: rid-too-big
  prompt: What happens to a user whose RID is larger than the slice size?
  choices:
  - It cannot be mapped; the log notes it, and a larger ldap_idmap_range_size is needed (which renumbers existing users)
  - It is mapped into the next slice automatically
  - SSSD crashes
  - It is mapped to UID 0
  answer:
  - 0
  explain: 'A) correct: see the lesson. B) wrong: see the lesson. C) wrong: see the lesson. D) wrong: see the lesson.'
- id: first-command
  prompt: Logins are slow. Which sssctl command shows whether SSSD is online and which servers it is using?
  choices:
  - sssctl domain-status
  - sssctl logs-remove
  - sssctl cert-show
  - sssctl config-check
  answer:
  - 0
  explain: 'A) correct: see the lesson. B) wrong: see the lesson. C) wrong: see the lesson. D) wrong: see the lesson.'
- id: debug-level
  prompt: What is a sensible SSSD debug level to start with for an authentication problem?
  choices:
  - '0'
  - '6'
  - '9'
  - '2'
  answer:
  - 1
  explain: 'A) wrong: see the lesson. B) correct: see the lesson. C) wrong: see the lesson. D) wrong: see the lesson.'
- id: cache-flush
  prompt: How do you make SSSD refresh one user without deleting the cache databases?
  choices:
  - sss_cache -u user (or sssctl cache-expire), which marks entries stale
  - rm /var/lib/sss/db/* followed by a restart of the SSSD service on the client
  - sssctl cache-remove
  - systemctl reboot
  answer:
  - 0
  explain: 'A) correct: see the lesson. B) wrong: see the lesson. C) wrong: see the lesson. D) wrong: see the lesson.'
- id: mode-switch
  prompt: What is the consequence of switching a large estate from algorithmic mapping to explicit POSIX attributes?
  choices:
  - None, because both modes use the same numbers for every user in the domain
  - Every UID may change, so file ownership no longer matches
  - Only new users are affected
  - Kerberos keys are regenerated
  answer:
  - 1
  explain: 'A) wrong: see the lesson. B) correct: see the lesson. C) wrong: see the lesson. D) wrong: see the lesson.'
- id: slow-login
  prompt: Logins on a client are slow after a network change. Which command shows whether SSSD is online and which servers it uses?
  choices:
  - sssctl cert-show, which prints a certificate that is stored in the cache
  - sssctl domain-status
  - sssctl config-check, which checks the syntax of the configuration file only
  - sssctl logs-remove, which deletes the debug logs of every SSSD process
  answer:
  - 1
  explain: 'A) wrong: shows a certificate. B) correct: shows state and servers. C) wrong: checks the file syntax. D) wrong: deletes the logs.'
