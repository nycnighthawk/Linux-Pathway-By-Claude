title: 'Quiz: FreeIPA/IdM: replicas, HBAC, sudo rules'
questions:
- id: allow-all
  prompt: A new IdM server has an HBAC rule 'allow_all'. What does leaving it enabled mean?
  choices:
  - Nothing, because the more specific rules always override it in the evaluation
  - Replication is paused
  - Only administrators can log in
  - Every user may use every service on every host, so other rules restrict nothing
  answer:
  - 3
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) wrong: see the lesson. D) correct: see the lesson.'
- id: hbactest
  prompt: A user authenticates but ssh closes the connection. Which command shows which rules matched?
  choices:
  - ipa-backup
  - ipa user-show U
  - kinit U
  - ipa hbactest --user=U --host=H --service=sshd
  answer:
  - 3
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) wrong: see the lesson. D) correct: see the lesson.'
- id: replica-topology
  prompt: Why add a replication segment between ipa1 and ipa3 when ipa1-ipa2 and ipa2-ipa3 exist?
  choices:
  - To change the realm name that all of the replicas hand out to the clients
  - So losing ipa2 does not split the topology or stop ipa1 and ipa3 exchanging changes
  - To make ipa3 a client
  - To speed up Kerberos
  answer:
  - 1
  explain: 'A) wrong: see the lesson. B) correct: see the lesson. C) wrong: see the lesson. D) wrong: see the lesson.'
- id: ca-renewal
  prompt: What is the 'CA renewal master'?
  choices:
  - The administrator who renews user passwords and the certificates of the hosts
  - The DNS primary zone owner
  - The first client enrolled
  - The one server that renews the IdM CA's own subsystem certificates
  answer:
  - 3
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) wrong: see the lesson. D) correct: see the lesson.'
- id: sudo-sss
  prompt: On an IdM client, sudo ignores the central rules. Which configuration pair is needed?
  choices:
  - The GSSAPIAuthentication setting in ssh_config on every client of the domain
  - '''sudoers: files sss'' in nsswitch.conf and ''sudo'' in the SSSD services list'
  - An /etc/sudoers entry per rule
  - pam_sss in the auth stack only
  answer:
  - 1
  explain: 'A) wrong: see the lesson. B) correct: see the lesson. C) wrong: see the lesson. D) wrong: see the lesson.'
- id: dead-server
  prompt: A dead replica must be removed. Which is the correct way?
  choices:
  - Delete only the host entry
  - Reinstall the realm
  - Edit dse.ldif by hand
  - ipa server-del, which cleans topology data and records
  answer:
  - 3
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) wrong: see the lesson. D) correct: see the lesson.'
- id: backup-vs-replica
  prompt: After losing one server in a healthy multi-replica topology, what is the better recovery source?
  choices:
  - Another replica, by installing a new replica
  - A dump of /etc
  - An old ipa-backup archive
  - The client SSSD cache
  answer:
  - 0
  explain: 'A) correct: see the lesson. B) wrong: see the lesson. C) wrong: see the lesson. D) wrong: see the lesson.'
- id: hbac-closed
  prompt: A user authenticates, but ssh closes the connection at once on an IdM client. Which command shows which rules matched?
  choices:
  - kinit U, which requests a new ticket-granting ticket for the user from the KDC
  - ipa hbactest --user=U --host=H --service=sshd
  - ipa-backup, which saves the state of the server to a file for a later restore
  - ipa user-show U, which reads the account entry and the groups of the user
  answer:
  - 1
  explain: 'A) wrong: the user already authenticated. B) correct: tests the access decision. C) wrong: not a test. D) wrong: does not test access.'
