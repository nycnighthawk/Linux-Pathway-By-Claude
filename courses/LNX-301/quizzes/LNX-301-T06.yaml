title: 'Quiz: FreeIPA/IdM: replicas, HBAC, sudo rules'
questions:
- id: allow-all
  prompt: A new IdM server has an HBAC rule 'allow_all'. What does leaving it enabled mean?
  choices:
  - Every user may use every service on every host, so your restrictive rules restrict nothing
  - Nothing, because specific rules always override it
  - Replication is paused
  - Only administrators can log in
  answer:
  - 0
  explain: 'A (correct): The union
    of rules is evaluated, so a universal rule makes the others irrelevant. B (wrong): HBAC has no precedence: access is granted if any enabled rule matches. C (wrong): Replication is unrelated. D (wrong): The rule applies to all users.'
- id: hbactest
  prompt: A user authenticates but ssh closes the connection. Which command shows which rules matched?
  choices:
  - ipa hbactest --user=U --host=H --service=sshd
  - ipa-backup
  - ipa user-show U
  - kinit U
  answer:
  - 0
  explain: 'A (correct): It evaluates the rules and prints matched and unmatched rules. B (wrong): It creates an archive. C (wrong): It shows attributes
    but evaluates no policy. D (wrong): It proves authentication, not access.'
- id: replica-topology
  prompt: Why add a replication segment between ipa1 and ipa3 when ipa1-ipa2 and ipa2-ipa3 exist?
  choices:
  - To speed up Kerberos
  - To change the realm name
  - So that losing ipa2 does not split the topology and leave ipa1 and ipa3 unable to exchange changes
  - To make ipa3 a client
  answer:
  - 2
  explain: 'A (wrong): Kerberos is separate. B (wrong): Realm
    names cannot be changed. C (correct): Each server should have
    at least two connections to avoid a single point of failure. D (wrong): Servers are not clients of each other in replication.'
- id: ca-renewal
  prompt: What is the 'CA renewal master'?
  choices:
  - The server that handles automatic renewal of the IdM CA's own subsystem certificates; only one has the role
  - The administrator who renews user passwords
  - The DNS primary zone owner
  - The first client enrolled
  answer:
  - 0
  explain: 'A (correct): If it is lost, renewals stop until another CA server is promoted. B (wrong): It is a server
    role. C (wrong): DNS has separate roles. D (wrong): Clients hold no such role.'
- id: sudo-sss
  prompt: On an IdM client, sudo ignores the central rules. Which configuration pair is needed?
  choices:
  - ssh_config GSSAPIAuthentication
  - '''sudoers: files sss'' in nsswitch.conf and ''sudo'' in the SSSD services list'
  - An /etc/sudoers entry per rule
  - pam_sss in the auth stack only
  answer:
  - 1
  explain: 'A (wrong): This concerns SSH. B (correct): SSSD''s sudo responder serves the rules; sudo must be told to ask it. C (wrong): That is
    the file-based approach the central rules replace. D (wrong): PAM handles authentication, not sudo rule lookup.'
- id: dead-server
  prompt: A dead replica must be removed. Which is the correct way?
  choices:
  - Delete only the host entry
  - Reinstall the realm
  - Edit dse.ldif by hand
  - ipa server-del, which cleans topology data and records
  answer:
  - 3
  explain: 'A (wrong): The topology and DNS records would keep ghosts. B (wrong): Far too destructive. C (wrong): Hand edits risk corrupting
    the directory. D (correct): This is the supported removal
    and keeps replication metadata consistent.'
- id: backup-vs-replica
  prompt: After losing one server in a healthy multi-replica topology, what is the better recovery source?
  choices:
  - Another replica, by installing a new replica
  - A dump of /etc
  - An old ipa-backup archive
  - The client SSSD cache
  answer:
  - 0
  explain: 'A (correct): Replicas hold current data
    and bring the topology back. B (wrong): The directory is not in /etc. C (wrong): Restoring old data can reintroduce deleted users. D (wrong): Caches are not authoritative.'
