title: 'Quiz: Smart-card login'
questions:
- id: stack
  prompt: Which component brokers access to the card reader?
  choices:
  - chronyd
  - pcscd, the PC/SC daemon
  - firewalld
  - auditd
  answer:
  - 1
  explain: 'A (wrong): Time sync. B (correct): Applications talk to the reader through it. C (wrong): A firewall. D (wrong): Auditing.'
- id: pkcs11
  prompt: What does PKCS#11 give applications?
  choices:
  - A uniform API for using keys on tokens without extracting them
  - A DNS extension
  - A password hashing scheme
  - A replacement for TLS
  answer:
  - 0
  explain: 'A (correct): OpenSC and vendor modules implement it, so SSSD and ssh use the same interface. B (wrong): Unrelated. C (wrong):
    Not its role. D (wrong): It is key access, not a transport.'
- id: mapping
  prompt: Why does an issuer match matter in a certificate mapping rule?
  choices:
  - It makes the card faster
  - It changes the shell
  - Without it, a certificate from another CA with the same subject might map to the account
  - It encrypts the PIN
  answer:
  - 2
  explain: 'A (wrong): No performance effect. B (wrong): No. C (correct): The issuer pins the rule to the intended CA. D (wrong):
    No.'
- id: required
  prompt: What risk comes with 'authselect select sssd with-smartcard-required' fleet-wide?
  choices:
  - A failed reader or missing driver locks everybody out; use canary hosts and a tested break-glass path
  - Passwords become stronger
  - It disables Kerberos
  - Nothing, it only logs
  answer:
  - 0
  explain: 'A (correct): Requiring a card removes the password fallback. B (wrong): They are no longer accepted
    for login. C (wrong): It does not. D (wrong): It enforces.'
- id: verification
  prompt: What does certificate_verification = no_verification do?
  choices:
  - Enables PKINIT
  - Speeds OCSP up
  - Disables certificate validation, which removes the security benefit
  - Requires two cards
  answer:
  - 2
  explain: 'A (wrong): Unrelated. B (wrong): It skips all
    checks. C (correct): Anyone with any certificate could be accepted by the chain check. D (wrong): Unrelated.'
- id: pkinit
  prompt: How does PKINIT help after a card login?
  choices:
  - It stores the PIN in the cache
  - It disables lock-on-removal
  - The card proof is exchanged for a Kerberos TGT, so later ssh and web access need no further PIN
  - It replaces DNS
  answer:
  - 2
  explain: 'A (wrong): It does not. B (wrong): No. C (correct): The ticket carries single sign-on for the session. D (wrong): No.'
- id: ad-mapping
  prompt: What must the AD team provide for certificate mapping against AD?
  choices:
  - altSecurityIdentities values (issuer and serial, or another strong mapping) on each user
  - A new forest
  - Nothing; names are guessed
  - A larger RID pool
  answer:
  - 0
  explain: 'A (correct): Windows strong certificate mapping requires explicit bindings. B (wrong): Not needed. C
    (wrong): Name guessing is what strong mapping removed. D (wrong): Unrelated.'
