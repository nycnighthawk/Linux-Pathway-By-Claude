title: 'Quiz: Joining a genuine Windows AD'
questions:
- id: machine-quota
  prompt: What is the risk of letting ordinary users join machines through ms-DS-MachineAccountQuota?
  choices:
  - It only works for Linux
  - It disables Kerberos on the new machines
  - Any user can create computer objects, which then appear in the directory with an identity the user controls
  - None; it is the recommended approach
  answer:
  - 2
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) correct: see the lesson. D) wrong: see the lesson.'
- id: delegated-join
  prompt: Which join identity best fits the least-privilege principle?
  choices:
  - A service account delegated 'create computer objects' on one OU
  - A domain admin
  - The built-in guest account, which already exists on every domain controller
  - Any user with the quota
  answer:
  - 0
  explain: 'A) correct: see the lesson. B) wrong: see the lesson. C) wrong: see the lesson. D) wrong: see the lesson.'
- id: otp-join
  prompt: What does a one-time-password join add?
  choices:
  - The host enrols with a pre-staged account's password, so no user credentials are used
  - It disables machine password rotation
  - It removes the need for DNS
  - It creates the computer account in the default container of the domain instead
  answer:
  - 0
  explain: 'A) correct: see the lesson. B) wrong: see the lesson. C) wrong: see the lesson. D) wrong: see the lesson.'
- id: gpo-mode
  prompt: Before setting ad_gpo_access_control to enforcing across a fleet, what is wise?
  choices:
  - Set the clock forward on the pilot hosts and check which logins are refused
  - Delete the GPOs
  - Disable SSSD
  - Run a pilot in permissive mode and read what would have been denied
  answer:
  - 3
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) wrong: see the lesson. D) correct: see the lesson.'
- id: ldap-signing
  prompt: A script using 'ldapsearch -x' with a simple bind fails with 'Strong(er) authentication required' against a domain controller. Why?
  choices:
  - The user is in the Protected Users group, which blocks all simple binds
  - The DC enforces LDAP signing, so the script needs SASL/GSSAPI or LDAPS
  - The DC is out of disk
  - The base DN is wrong
  answer:
  - 1
  explain: 'A) wrong: see the lesson. B) correct: see the lesson. C) wrong: see the lesson. D) wrong: see the lesson.'
- id: stale-object
  prompt: A rebuilt host called app01 fails to join with 'Insufficient access' although the join account works for new names. What probably happened?
  choices:
  - An old APP01$ object exists elsewhere, outside the delegated OU
  - SSSD cache is full
  - The host's clock is slow
  - The OU name has an upper-case letter, which the directory treats as a new name
  answer:
  - 0
  explain: 'A) correct: see the lesson. B) wrong: see the lesson. C) wrong: see the lesson. D) wrong: see the lesson.'
- id: rc4
  prompt: Why can a long-running Linux server suddenly fail after Windows hardening removes RC4?
  choices:
  - The kernel was updated and no longer accepts the Kerberos tickets of the domain
  - The hostname changed
  - Its machine password predates the policy, so its keys include no AES entries
  - Linux cannot use AES
  answer:
  - 2
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) correct: see the lesson. D) wrong: see the lesson.'
- id: join-denied
  prompt: A rebuilt host called app01 fails to join with "Insufficient access", while the join account works for new names. What do you check?
  choices:
  - Whether an old APP01$ object exists elsewhere, outside the delegated OU
  - Whether the SSSD cache of the host is full, so that new entries are refused
  - Whether the clock of the host is slow, so that tickets look as if they expired
  - Whether the OU name has an upper-case letter that the directory treats as new
  answer:
  - 0
  explain: 'A) correct: a stale object blocks the join. B) wrong: not related. C) wrong: would give another error. D) wrong: not related.'
