title: 'Quiz: IdM to AD trust'
questions:
- id: why-trust
  prompt: What does a cross-forest trust avoid, compared with joining every Linux host to AD?
  choices:
  - Having any Kerberos at all
  - An AD computer object and AD ports per Linux host, and any Linux-specific schema or policy in AD
  - The need for DNS
  - Time synchronisation
  answer:
  - 1
  explain: 'A (wrong): Both use Kerberos. B (correct): Linux hosts enrol in IdM; AD users still log in through the
    trust. C (wrong): DNS must work in both directions. D (wrong): Time still matters.'
- id: controller-agent
  prompt: What is the difference between an IdM trust controller and a trust agent?
  choices:
  - Controllers run Samba components and can establish the trust and process AD Kerberos requests; agents can resolve
    AD identities for clients but cannot handle AD Kerberos requests
  - Agents establish trusts and controllers cannot
  - They are the same role under different names
  - Controllers are clients
  answer:
  - 0
  explain: 'A (correct): This matches the roles described for IdM trusts. B (wrong): The reverse is true. C (wrong):
    They differ in services and exposure. D (wrong): Both are IdM servers.'
- id: external-group
  prompt: Why is an external group nested in a POSIX group when AD users are given sudo rights?
  choices:
  - External groups hold AD members by SID and cannot be named directly in HBAC or sudo rules; the POSIX group wrapper
    can
  - To make AD groups writable
  - To rename the AD forest
  - To skip the trust
  answer:
  - 0
  explain: 'A (correct): Rules accept POSIX groups only. B (wrong): The nesting does not change AD. C (wrong): Unrelated.
    D (wrong): The trust is still needed.'
- id: range-type
  prompt: Which statement about the ID range type of a trust is correct?
  choices:
  - ipa-ad-trust derives IDs from SID RIDs; ipa-ad-trust-posix reads the POSIX attributes stored in AD; changing
    later after files exist renumbers owners
  - They are interchangeable at any time with no effect
  - ipa-ad-trust requires uidNumber in AD
  - Both ignore SIDs
  answer:
  - 0
  explain: 'A (correct): The choice shapes every file owner and is close to irreversible. B (wrong): Switching changes
    the UIDs that users receive. C (wrong): That is the posix variant. D (wrong): SIDs are the identifiers AD users
    have.'
- id: two-way
  prompt: Why is a two-way trust nearly the same as a one-way trust for IdM?
  choices:
  - IdM implements no global catalog service, so IdM users cannot be authorised for most AD resources
  - Windows forbids two-way trusts
  - Kerberos is one-way by design
  - IdM has no users
  answer:
  - 0
  explain: 'A (correct): AD resources need the catalog for access checks, which IdM lacks. B (wrong): Windows supports
    them. C (wrong): Cross-realm tickets can flow both ways. D (wrong): IdM has users.'
- id: dns
  prompt: Why does the trust need DNS forwarding on both sides?
  choices:
  - Each side must find the other's SRV records for LDAP and Kerberos, so IdM forwards the AD zone and AD forwards
    the IdM zone
  - Because SSSD caches DNS answers for a year
  - To allow dynamic updates of NTP
  - Because DNS replaces Kerberos
  answer:
  - 0
  explain: 'A (correct): Discovery of services depends on SRV records. B (wrong): Not the reason. C (wrong): Unrelated.
    D (wrong): It does not.'
- id: healthcheck
  prompt: Which command runs only the trust checks of IdM Healthcheck?
  choices:
  - ipa-healthcheck --source=ipahealthcheck.ipa.trust
  - ipa trust-del
  - realm list
  - ipa-backup --data
  answer:
  - 0
  explain: 'A (correct): The --source option limits the run to the trust tests; an empty list means no findings.
    B (wrong): It removes the trust. C (wrong): It lists joined realms on a client. D (wrong): It creates a data
    backup.'
