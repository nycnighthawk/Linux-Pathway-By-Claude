title: 'Quiz: realmd/adcli joins to Samba AD DC'
questions:
- id: realm-roles
  prompt: In 'realm join', which tool actually creates the computer account and keytab?
  choices:
  - sssd
  - adcli, driven by realmd
  - authselect
  - chronyd
  answer:
  - 1
  explain: 'A (wrong): SSSD consumes the result; it does not enrol the host. B (correct): realmd discovers the domain
    and configures; adcli performs the account creation and keytab handling. C (wrong): It writes PAM and nsswitch
    files. D (wrong): It keeps time and has nothing to do with enrolment.'
- id: discover-fails
  prompt: '''realm discover ad.example.com'' returns nothing on a freshly built client. What do you check first?'
  choices:
  - Whether the client resolves SRV records from a DNS server that serves the AD zone
  - The SSSD cache
  - The home directory permissions
  - The SELinux boolean for NFS
  answer:
  - 0
  explain: 'A (correct): Discovery depends on SRV records such as _ldap._tcp.dc._msdcs, so the resolver must reach
    the DC''s DNS. B (wrong): Nothing is cached before a join. C (wrong): Home directories matter after login. D
    (wrong): NFS is unrelated.'
- id: ldap-id-mapping
  prompt: With ldap_id_mapping = True (the default for AD), where do a user's UID and GID come from?
  choices:
  - The uidNumber attribute stored in AD
  - An algorithm over the user's SID inside a range reserved for the domain
  - A random number stored in /etc/passwd
  - The order in which users first log in
  answer:
  - 1
  explain: 'A (wrong): That is the other mode, ldap_id_mapping = False. B (correct): SSSD derives numbers from the
    SID, so every SSSD host computes the same value without a coordinator. C (wrong): SSSD does not write directory
    users into local files. D (wrong): That would give different numbers on different hosts.'
- id: realm-permit
  prompt: After 'realm permit alice@ad.example.com' what is the default for other domain users?
  choices:
  - They are allowed because permit only adds an extra rule
  - They are denied, because the domain becomes default-deny except for the permitted names
  - They are asked for a second password
  - Their accounts are deleted from AD
  answer:
  - 1
  explain: 'A (wrong): permit switches the domain to an allow-list. B (correct): Red Hat recommends this model over
    permitting everybody and denying exceptions. C (wrong): No second factor is involved. D (wrong): realm permit
    changes only the local access rule.'
- id: enctype
  prompt: '''realm join'' fails with ''KDC has no support for encryption type''. Which approach is preferable first?'
  choices:
  - Reset the join or machine account password so AES keys exist, and only then relax the client policy
  - Disable Kerberos on the client
  - Set the crypto policy to LEGACY permanently
  - Delete /etc/krb5.keytab
  answer:
  - 0
  explain: 'A (correct): Fix the weak keys on the server side before lowering client security. B (wrong): Without
    Kerberos there is no join. C (wrong): This is a last resort with a security cost. D (wrong): The join creates
    the keytab; deleting it changes nothing about the KDC.'
- id: hostname
  prompt: Why does a /etc/hosts line mapping the host name to 127.0.1.1 cause trouble for joins on Debian-family
    systems?
  choices:
  - The host builds principals and DNS records from a name that does not resolve to its real address
  - It disables IPv6
  - It makes chrony stop
  - It changes the NetBIOS domain
  answer:
  - 0
  explain: 'A (correct): The join and Kerberos depend on a consistent FQDN and address. B (wrong): The line has
    no such effect. C (wrong): Time sync is unaffected. D (wrong): NetBIOS domain names come from the directory.'
- id: samba-gc
  prompt: A Samba AD DC does not implement a Windows-style global catalog on port 3268. How does SSSD cope?
  choices:
  - It cannot be used with Samba
  - It falls back to the LDAP port 389, and ad_enable_gc = False avoids the delay
  - It requires winbind on the client
  - It disables Kerberos
  answer:
  - 1
  explain: 'A (wrong): SSSD works with Samba DCs routinely. B (correct): The fallback means lookups still work;
    disabling GC avoids the wasted attempt. C (wrong): SSSD does not need winbind. D (wrong): Kerberos is unaffected.'
