title: 'Quiz: realmd/adcli joins to Samba AD DC'
questions:
- id: realm-roles
  prompt: In 'realm join', which tool actually creates the computer account and keytab?
  choices:
  - chronyd
  - sssd
  - authselect
  - adcli, driven by realmd
  answer:
  - 3
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) wrong: see the lesson. D) correct: see the lesson.'
- id: discover-fails
  prompt: '''realm discover ad.example.com'' returns nothing on a freshly built client. What do you check first?'
  choices:
  - The permissions on the home directory of the user who runs the discover command
  - The SELinux boolean for NFS
  - Whether the client resolves SRV records from a DNS server for the AD zone
  - The SSSD cache
  answer:
  - 2
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) correct: see the lesson. D) wrong: see the lesson.'
- id: ldap-id-mapping
  prompt: With ldap_id_mapping = True (the default for AD), where do a user's UID and GID come from?
  choices:
  - A random number stored in /etc/passwd
  - The order in which users first log in
  - The uidNumber attribute stored in AD
  - An algorithm over the user's SID inside a range reserved for the domain
  answer:
  - 3
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) wrong: see the lesson. D) correct: see the lesson.'
- id: realm-permit
  prompt: After 'realm permit alice@ad.example.com' what is the default for other domain users?
  choices:
  - They are denied; the domain becomes default-deny except for permitted names
  - They are asked for a second password
  - Their accounts are deleted from AD
  - They are allowed, because permit only adds one more rule to the access list
  answer:
  - 0
  explain: 'A) correct: see the lesson. B) wrong: see the lesson. C) wrong: see the lesson. D) wrong: see the lesson.'
- id: enctype
  prompt: '''realm join'' fails with ''KDC has no support for encryption type''. Which approach is preferable first?'
  choices:
  - Disable Kerberos on the client
  - Reset the machine account password so AES keys exist, then relax the client policy
  - Set the crypto policy to LEGACY permanently on every client in the domain
  - Delete /etc/krb5.keytab
  answer:
  - 1
  explain: 'A) wrong: see the lesson. B) correct: see the lesson. C) wrong: see the lesson. D) wrong: see the lesson.'
- id: hostname
  prompt: Why does a /etc/hosts line mapping the host name to 127.0.1.1 cause trouble for joins on Debian-family systems?
  choices:
  - It disables IPv6
  - The host builds principals and DNS records from a name that does not resolve to its address
  - It changes the NetBIOS domain that the host reports when it joins the domain
  - It makes chrony stop
  answer:
  - 1
  explain: 'A) wrong: see the lesson. B) correct: see the lesson. C) wrong: see the lesson. D) wrong: see the lesson.'
- id: samba-gc
  prompt: Clients read POSIX IDs from a Samba AD DC, whose global catalog lacks the RFC 2307 attributes by default. How is SSSD set up?
  choices:
  - It cannot be used with Samba
  - It disables Kerberos
  - Set ad_enable_gc = False so SSSD reads the IDs over LDAP on port 389
  - It requires winbind on the client, and SSSD must be removed from the host
  answer:
  - 2
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) correct: see the lesson. D) wrong: see the lesson.'
- id: join-fails
  prompt: A rebuilt Debian host fails realm join, and /etc/hosts maps its name to 127.0.1.1. What do you change?
  choices:
  - Disable IPv6 on the host so that name resolution returns only one address
  - Map the host name to its real address, so principals and DNS records are correct
  - Delete /etc/krb5.keytab and retry the join so that a new key is created
  - Set the crypto policy to LEGACY on the host so that old key types are accepted
  answer:
  - 1
  explain: 'A) wrong: not related. B) correct: the name must resolve properly. C) wrong: not related. D) wrong: not related.'
