title: 'Quiz: SSSD, nsswitch, PAM'
questions:
- id: who-does-what
  prompt: Which component decides where getpwnam() looks for a user?
  choices:
  - krb5.conf
  - sshd_config
  - PAM
  - nsswitch.conf, which lists the sources in order
  answer:
  - 3
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) wrong: see the lesson. D) correct: see the lesson.'
- id: authselect
  prompt: What does 'authselect select sssd with-mkhomedir' change?
  choices:
  - The sssd.conf file, the SSSD daemon settings and the domain it serves
  - Only the home directory permissions
  - The generated PAM stacks and nsswitch.conf for the profile
  - The kernel's UID range
  answer:
  - 2
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) correct: see the lesson. D) wrong: see the lesson.'
- id: sssd-conf-mode
  prompt: SSSD refuses to start with a configuration file that is readable by other users. What mode is expected for /etc/sssd/sssd.conf?
  choices:
  - '0777'
  - Any mode, if SELinux is enforcing
  - 0600 owned by root
  - '0644'
  answer:
  - 2
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) correct: see the lesson. D) wrong: see the lesson.'
- id: tls-setting
  prompt: Which SSSD LDAP option makes a missing or invalid server certificate fatal?
  choices:
  - cache_credentials = true
  - ldap_tls_reqcert = never
  - enumerate = false
  - ldap_tls_reqcert = demand
  answer:
  - 3
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) wrong: see the lesson. D) correct: see the lesson.'
- id: cache-staleness
  prompt: An administrator adds Alice to a group but sudo -l on a client shows no change for an hour. What is the likely reason?
  choices:
  - PAM must be restarted
  - The KDC is down
  - nsswitch.conf was edited on the client and the change is not read until a reboot
  - The cached group entry has not expired yet; invalidate it with sss_cache -u
  answer:
  - 3
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) wrong: see the lesson. D) correct: see the lesson.'
- id: nullok
  prompt: Why do compliance baselines remove 'nullok' from pam_unix lines?
  choices:
  - It slows logins
  - It stops pam_sss from working
  - It disables account locking
  - It allows accounts with empty passwords to authenticate
  answer:
  - 3
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) wrong: see the lesson. D) correct: see the lesson.'
- id: offline
  prompt: What makes an offline login possible with SSSD?
  choices:
  - Copying /etc/shadow from the server onto every client before the network drops
  - Setting ldap_tls_reqcert to never
  - Enabling enumeration
  - cache_credentials, which keeps a salted hash after a successful online login
  answer:
  - 3
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) wrong: see the lesson. D) correct: see the lesson.'
- id: sudo-stale
  prompt: A user is added to a group, but sudo -l on a client shows no change for an hour. What is the likely cause?
  choices:
  - The KDC is down, so no tickets can be issued for the sudo rules of the user
  - nsswitch.conf was edited in the meantime and the change is not read until a reboot
  - PAM must be restarted on the client so that it can read the new group list
  - The cached group entry has not expired yet; expire it with sss_cache -u
  answer:
  - 3
  explain: 'A) wrong: would break all logins. B) wrong: not related. C) wrong: PAM does not cache groups. D) correct: a cache timeout.'
