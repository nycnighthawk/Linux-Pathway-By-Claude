title: 'Quiz: Kerberos, keytabs, GSSAPI SSH'
questions:
- id: what-travels
  prompt: In a normal Kerberos login, what does the user's client send to the service it wants to use?
  choices:
  - A hash of the password, which the service compares with the copy it keeps
  - The user's password, encrypted with TLS
  - The ticket-granting ticket itself
  - A service ticket plus an authenticator proving it holds the session key
  answer:
  - 3
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) wrong: see the lesson. D) correct: see the lesson.'
- id: clock-skew
  prompt: Every login fails with 'Clock skew too great' after a VM is resumed from a snapshot. What is the first fix?
  choices:
  - Delete the credential cache and reboot the KDC, so that new tickets are issued
  - Reissue the keytab
  - Raise the ticket lifetime
  - Step the clock to the correct time, for example with chronyc makestep
  answer:
  - 3
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) wrong: see the lesson. D) correct: see the lesson.'
- id: ktadd-rotates
  prompt: You run kadmin 'ktadd' for host/web1 on a second occasion and keep the first keytab file as well. What happens to the first file?
  choices:
  - It becomes valid for a different realm
  - It keeps working, because both keytabs hold the current key for that principal
  - 'It stops working: ktadd rotated the key and raised the key version'
  - It is updated automatically over the network
  answer:
  - 2
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) correct: see the lesson. D) wrong: see the lesson.'
- id: ssh-fallback
  prompt: ssh asks for a password although the user holds a valid TGT and GSSAPIAuthentication is on at both ends. ssh -vvv reports 'Server not found in Kerberos database'. Most likely cause?
  choices:
  - PermitRootLogin is no
  - The TGT is too old to be used for any service ticket request at all
  - The client built the service principal from a short name or CNAME the KDC lacks
  - sshd cannot read the client's cache
  answer:
  - 2
  explain: 'A) wrong: see the lesson. B) wrong: see the lesson. C) correct: see the lesson. D) wrong: see the lesson.'
- id: keytab-secret
  prompt: How should a host keytab be treated?
  choices:
  - As public data, because the keys inside are encrypted
  - 'Like a password: root-owned, mode 0600, never in images, and a distinct principal per host'
  - As disposable, since tickets expire after ten hours
  - As a log file that can be world-readable for monitoring
  answer:
  - 1
  explain: 'A) wrong: see the lesson. B) correct: see the lesson. C) wrong: see the lesson. D) wrong: see the lesson.'
- id: krb5-trace
  prompt: Which switch prints a step-by-step trace of KDC discovery, pre-authentication and errors for the MIT client?
  choices:
  - kvno -q
  - KRB5_TRACE=/dev/stderr
  - klist -e
  - kdestroy -A
  answer:
  - 1
  explain: 'A) wrong: see the lesson. B) correct: see the lesson. C) wrong: see the lesson. D) wrong: see the lesson.'
- id: auth-to-local
  prompt: A Kerberos principal alice@EXAMPLE.COM authenticates to sshd but no account called alice exists locally. Which mechanisms let the principal map to an account?
  choices:
  - Setting GSSAPIAuthentication to no on the server and trying a password login
  - A .k5login file, auth_to_local rules in krb5.conf, or SSSD resolving the name
  - Running kinit on the server
  - Removing the host keytab
  answer:
  - 1
  explain: 'A) wrong: see the lesson. B) correct: see the lesson. C) wrong: see the lesson. D) wrong: see the lesson.'
- id: skew-case
  prompt: After a VM is resumed from a snapshot, every Kerberos login fails with "Clock skew too great". What is the first fix?
  choices:
  - Issue a new keytab for the host principal and copy it to the client machine
  - Step the clock to the correct time, for example with chronyc makestep
  - Delete the credential cache and reboot the KDC so new tickets can be issued
  - Raise the ticket lifetime on the KDC for the realm, so that tickets last longer
  answer:
  - 1
  explain: 'A) wrong: not the cause. B) correct: the skew is the cause. C) wrong: not the cause. D) wrong: does not fix the clock.'
