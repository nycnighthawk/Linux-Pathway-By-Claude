id: LNX-301
title: Identity, Directory & AD Integration
summary: 'How Linux hosts learn who a user is and decide whether to let them in: LDAP and Kerberos fundamentals, SSSD with
  nsswitch and PAM, joining Samba and Windows Active Directory, FreeIPA/IdM with replicas, HBAC and sudo rules, trusts to
  AD, ID mapping and troubleshooting, ansible-freeipa automation and smart-card login.'
hours: 60
outcomes:
- Query and protect an OpenLDAP directory with ordered access rules, indexes and verified TLS
- Issue Kerberos keytabs and use GSSAPI single sign-on for SSH
- Configure SSSD, nsswitch and PAM so that directory users can log in safely
- Join a Linux host to a Samba or Windows Active Directory domain and verify the join
- Run FreeIPA/IdM with replicas and express access and sudo policy as HBAC and sudo rules
- Design a one-way trust between IdM and Active Directory and map AD groups into IdM policy
- Choose and verify an ID mapping model and troubleshoot SSSD with sssctl
- Automate IdM with ansible-freeipa and plan smart-card login with certificate mapping
