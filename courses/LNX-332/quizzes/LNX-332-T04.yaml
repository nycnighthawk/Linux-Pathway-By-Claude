title: 'Quiz: Virtio'
questions:
- id: areas
  prompt: Which three areas make up a split virtqueue?
  choices:
  - Page table, TLB, cache
  - Read queue, write queue, error queue
  - Header, body, footer
  - Descriptor table, available ring, used ring
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong. D) correct.'
- id: write
  prompt: What does the WRITE flag on a descriptor mean?
  choices:
  - The device writes into the buffer
  - The buffer is encrypted
  - The buffer is read-only for everyone
  - The driver writes into it
  answer: [0]
  explain: 'A) correct. B) wrong. C) wrong. D) wrong.'
- id: loop
  prompt: A descriptor chain loops back to its first entry. What must the back end do?
  choices:
  - Reboot the host
  - Follow it forever
  - Stop after at most the table size and treat the device as broken
  - Ignore the flags
  answer: [2]
  explain: 'A) wrong. B) wrong. C) correct. D) wrong.'
- id: supp
  prompt: What does notification suppression achieve?
  choices:
  - Fewer exits and interrupts under load
  - Larger packets
  - Faster disks
  - Encryption
  answer: [0]
  explain: 'A) correct. B) wrong. C) wrong. D) wrong.'
- id: trust
  prompt: Why must a virtio back end validate descriptor values?
  choices:
  - The kernel forbids reading them
  - The values are random
  - The guest controls them and may be hostile
  - They are always valid
  answer: [2]
  explain: 'A) wrong. B) wrong. C) correct. D) wrong.'
