title: 'Quiz: KVM internals and tracing'
questions:
- id: hlt
  prompt: Why is HLT time excluded when looking for virtualization overhead?
  choices:
  - HLT is a bug
  - It is always zero
  - It cannot be measured
  - It is guest idle time, not cost
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong. D) correct.'
- id: tool
  prompt: Which command summarizes exits by reason with counts and times?
  choices:
  - git log
  - perf kvm stat report
  - lsmod
  - ls /dev/kvm
  answer: [1]
  explain: 'A) wrong. B) correct. C) wrong. D) wrong.'
- id: ept
  prompt: A guest shows an EPT_VIOLATION storm. What is a sensible first action?
  choices:
  - Add more vCPUs
  - Disable the network
  - Reboot the host daily
  - Use huge pages or pre-fault guest memory
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong. D) correct.'
- id: io
  prompt: IO_INSTRUCTION dominates the time. What does that suggest?
  choices:
  - Nothing
  - The CPU is too fast
  - An emulated device on a hot path; use paravirtual devices or in-kernel back ends
  - The guest has too little RAM
  answer: [2]
  explain: 'A) wrong. B) wrong. C) correct. D) wrong.'
- id: load
  prompt: A rebuilt kvm.ko fails to load with a version magic error. What is the likely cause?
  choices:
  - The guest is too large
  - The disk is full
  - Swap is disabled
  - It was built against a different kernel tree or configuration than the running kernel
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong. D) correct.'
