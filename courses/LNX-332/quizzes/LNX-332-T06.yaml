title: 'Quiz: QEMU device models'
questions:
- id: qom
  prompt: What is QOM?
  choices:
  - A kernel scheduler
  - A disk image format
  - 'QEMU object model: registered types with inheritance, properties and a runtime object tree'
  - A network protocol
  answer: [2]
  explain: 'A) wrong. B) wrong. C) correct. D) wrong.'
- id: realize
  prompt: Where does a device usually create its memory regions and register its BARs?
  choices:
  - At power-off
  - In the guest
  - In the Makefile
  - In realize
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong. D) correct.'
- id: qtest
  prompt: What does qtest allow?
  choices:
  - Compiling QEMU
  - Driving device registers from a test without any guest software
  - Encrypting guest RAM
  - Booting Windows faster
  answer: [1]
  explain: 'A) wrong. B) correct. C) wrong. D) wrong.'
- id: vmstate
  prompt: What happens if a device omits a field from its VMStateDescription?
  choices:
  - The guest cannot boot
  - Nothing at all
  - The device is faster
  - Live migration can restore the device with wrong state
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong. D) correct.'
- id: security
  prompt: Why are device models a main source of QEMU vulnerabilities?
  choices:
  - They run in the guest
  - They have no registers
  - Guest-controlled register and DMA accesses reach complex C code in the host process
  - They are written in assembly only
  answer: [2]
  explain: 'A) wrong. B) wrong. C) correct. D) wrong.'
