title: 'Quiz: Upstreaming to KVM and QEMU'
questions:
- id: sob
  prompt: What does a Signed-off-by line certify?
  choices:
  - The build passed
  - The author's right to submit the work under the project's terms
  - That the maintainer approved it
  - That the patch is bug free
  answer: [1]
  explain: 'A) wrong. B) correct: the Developer Certificate of Origin. C) wrong. D) wrong.'
- id: small
  prompt: How should a large change be submitted?
  choices:
  - As an ordered series of small patches, each building and working
  - As one huge patch
  - Directly to the main branch
  - As a zip file
  answer: [0]
  explain: 'A) correct. B) wrong. C) wrong. D) wrong.'
- id: fixes
  prompt: Which trailer links a bug fix to the commit that introduced the bug?
  choices:
  - 'Cc-me:'
  - 'Bug-report-from:'
  - 'Fixes:'
  - 'Thanks:'
  answer: [2]
  explain: 'A) wrong. B) wrong. C) correct. D) wrong.'
- id: v2
  prompt: Where does the changelog between versions of a patch go?
  choices:
  - After the three dashes, below the commit message
  - Nowhere
  - In the commit message body
  - In the subject
  answer: [0]
  explain: 'A) correct: it is not part of the commit. B) wrong. C) wrong. D) wrong.'
- id: test
  prompt: What test would you attach to a KVM ioctl bug fix?
  choices:
  - A screenshot
  - A KVM selftest that reproduces the failing input
  - A benchmark of the GUI
  - A spreadsheet
  answer: [1]
  explain: 'A) wrong. B) correct. C) wrong. D) wrong.'
