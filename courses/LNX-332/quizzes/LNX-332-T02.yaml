title: 'Quiz: The KVM API'
questions:
- id: fds
  prompt: Which descriptor do you call KVM_RUN on?
  choices:
  - The vCPU descriptor
  - The /dev/kvm descriptor
  - The memory slot
  - The VM descriptor
  answer: [0]
  explain: 'A) correct. B) wrong. C) wrong. D) wrong.'
- id: slot
  prompt: What does KVM_SET_USER_MEMORY_REGION do?
  choices:
  - Starts the guest
  - Binds a guest-physical range to memory in the VMM process
  - Loads the guest kernel
  - Creates a vCPU
  answer: [1]
  explain: 'A) wrong. B) correct. C) wrong. D) wrong.'
- id: mmio
  prompt: What does the VMM do on KVM_EXIT_MMIO for a read?
  choices:
  - Remap memory
  - Kill the guest
  - Fill in the data field with the device's value before resuming
  - Ignore it
  answer: [2]
  explain: 'A) wrong. B) wrong. C) correct. D) wrong.'
- id: fail
  prompt: KVM_RUN returns KVM_EXIT_FAIL_ENTRY. What is likely wrong?
  choices:
  - The network
  - The disk image
  - The guest register or control state that was loaded is invalid for the hardware
  - The terminal
  answer: [2]
  explain: 'A) wrong. B) wrong. C) correct. D) wrong.'
- id: short
  prompt: Why is the list of exits handled in user space short?
  choices:
  - User space cannot see exits
  - Exits are disabled
  - The guest rarely runs
  - KVM handles many exits, such as page faults on mapped memory and CPUID, inside the kernel
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong. D) correct.'
