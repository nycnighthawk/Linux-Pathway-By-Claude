id: LNX-332
title: 'Hypervisor Development: KVM, QEMU & VirtualBox'
summary: 'How hypervisors are built and changed: the CPU''s virtualization extensions and nested paging, the KVM ioctl API
  and a minimal VMM, rust-vmm, virtio and vhost back ends, QEMU device models and qtest, KVM internals and exit tracing, KVM
  testing, interrupt and timer virtualization, VirtualBox''s source and its KVM backend, and the road to upstream acceptance.
  Labs are user-space models so every exercise runs in CI.'
hours: 48
coverage: full
outcomes:
- Explain VM exits, the VMCS or VMCB and the cost of two-dimensional paging
- Write the run loop of a KVM-based VMM and handle its exits
- Build a guest memory map and a Rust VMM structure from shared crates
- Implement the device side of a virtqueue with validation, and a vhost-user parser
- Write a QEMU device model test with qtest and read the QOM structure
- Trace and rank VM exits and choose a first optimisation
- Judge hypervisor test runs from logs and exit status
- Encode MSI messages and explain APICv and posted interrupts
- Navigate the VirtualBox source tree and plan a backend patch
- Prepare a patch for KVM or QEMU review
