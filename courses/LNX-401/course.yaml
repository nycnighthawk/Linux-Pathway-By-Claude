id: LNX-401
title: 'Capstone: Enterprise Estate as Code'
summary: 'A graded, multi-stage project for the enterprise pathway. You describe an estate as code (an IdM domain beside a Samba AD domain with a trust, six mixed servers, a package repository and monitoring), test it against a genuine Windows AD, run its full host lifecycle, operate it for thirty days, take its baseline to a public cloud and write a post-incident review. Three stages are graded in CI; three are guided evidence stages.'
hours: 120
coverage: full
outcomes:
- Describe an estate in one inventory file whose data is internally consistent and whose build order is explicit
- Prove identity in layers (name and time, authentication, authorisation and ID mapping) against Samba AD and a genuine Windows AD
- Write the provision, patch, upgrade and decommission steps of a host in the right order, with canary rings and replica checks
- Operate an estate for a month against written service objectives and turn repeated manual work into code
- Deploy the same baseline to a public cloud separately from its provider-specific parts, and tear it down with proof
- Write a blameless post-incident review whose timeline, numbers and actions are consistent
