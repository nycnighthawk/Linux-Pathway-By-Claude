title: 'Quiz: operators'
questions:
- id: level
  prompt: What does level-triggered mean for a reconciler?
  choices: [It handles each event once, It needs a queue per event type, It runs only on create, It reads current state and acts on the difference regardless of the triggering event]
  answer: [3]
  explain: 'A) wrong: that is edge-triggered. B) wrong. C) wrong. D) correct.'
- id: owner
  prompt: What does an owner reference on a child give you? (select two)
  choices: [Garbage collection with the parent, Child events trigger reconcile of the parent, Encryption, Faster scheduling]
  answer: [0, 1]
  explain: 'A) correct. B) correct. C) wrong. D) wrong.'
- id: finalizer
  prompt: Why does the operator add a finalizer to its custom resource?
  choices: [To hide the object, To lock the spec, To speed up deletion, To clean up external state before the object is removed]
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong. D) correct.'
- id: hotloop
  prompt: A controller writes its status on every reconcile and the status write triggers the next. What is the fix?
  choices: [Add sleep, Increase replicas, Delete the CRD, Write only when it changed and use the status subresource with predicates]
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong. D) correct.'
- id: envtest
  prompt: What does envtest provide?
  choices: [A container runtime, A real API server and etcd without nodes or built-in controllers, A mock of Go, A full cluster]
  answer: [1]
  explain: 'A) wrong. B) correct: Pods never become ready, so tests set status by hand. C) wrong. D) wrong.'
