title: 'Quiz: probes and debugging'
questions:
- id: readiness
  prompt: What does a failing readiness probe do?
  choices: [Stops the node, Restarts the container, Removes the Pod from Service endpoints without restarting it, Deletes the Pod]
  answer: [2]
  explain: 'A) wrong. B) wrong: that is liveness. C) correct. D) wrong.'
- id: startup
  prompt: Why add a startup probe?
  choices: [To change the restart policy, To replace readiness, To speed up image pulls, Let a slow start finish while keeping a tight liveness check afterwards]
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong. D) correct.'
- id: dependency
  prompt: What goes wrong if the liveness probe checks the database?
  choices: [Nothing, Probes stop running, The kubelet crashes, A database blip restarts every application Pod]
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong. D) correct.'
- id: previous
  prompt: A container crash-loops and the current log is empty. Which command shows the evidence?
  choices: [kubectl top, kubectl logs --previous, kubectl cordon, kubectl get nodes]
  answer: [1]
  explain: 'A) wrong. B) correct: it reads the last terminated instance. C) wrong. D) wrong.'
- id: ephemeral
  prompt: Which are true of ephemeral containers? (select two)
  choices: [They can define liveness probes, They survive Pod deletion, They cannot be removed from the Pod once added, They can join the process namespace of a target container]
  answer: [2, 3]
  explain: 'A) wrong. B) wrong. C) correct. D) correct.'
