title: 'Quiz: Helm chart authoring'
questions:
- id: versions
  prompt: Which field must change whenever the chart's templates or defaults change?
  choices: [The release name, appVersion only, The namespace, version in Chart.yaml]
  answer: [3]
  explain: 'A) wrong. B) wrong: informational. C) wrong. D) correct: released chart versions are immutable.'
- id: crd
  prompt: How does Helm treat files in the crds directory after the first install?
  choices: [It templates them, It deletes them on rollback, It does not upgrade or delete them, It upgrades them each time]
  answer: [2]
  explain: 'A) wrong. B) wrong. C) correct: to avoid data loss, CRD upgrades are a separate step. D) wrong.'
- id: schema
  prompt: What does values.schema.json do?
  choices: [Validates merged values at install, upgrade, lint and template time, Encrypts values, Stores release history, Pins images]
  answer: [0]
  explain: 'A) correct. B) wrong. C) wrong. D) wrong.'
- id: selector
  prompt: Why must selector labels never change between releases?
  choices: [The Deployment selector is immutable, Labels are encrypted, Services ignore labels, Helm forbids labels]
  answer: [0]
  explain: 'A) correct. B) wrong. C) wrong. D) wrong.'
- id: tests
  prompt: Which belong in a chart CI pipeline? (select two)
  choices: [Lint and render with schema validation, Install, upgrade from the last release and helm test in a kind cluster, Edit live objects by hand, Use the latest tag]
  answer: [0, 1]
  explain: 'A) correct. B) correct. C) wrong. D) wrong.'
