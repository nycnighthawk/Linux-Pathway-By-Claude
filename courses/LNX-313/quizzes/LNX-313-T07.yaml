title: 'Quiz: GitOps'
questions:
- id: pull
  prompt: What is the main security gain of the pull model?
  choices: [CI needs no write credentials to the clusters, No need for RBAC, Faster builds, Smaller images]
  answer: [0]
  explain: 'A) correct: agents hold the credentials inside the cluster. B) wrong. C) wrong. D) wrong.'
- id: prune
  prompt: What does prune do?
  choices: [Removes old images, Compresses manifests, Clears Git history, Deletes live objects that are no longer in Git]
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong. D) correct, which is why it needs care for stateful objects.'
- id: selfheal
  prompt: An operator scales a Deployment by hand and the replica count reverts. Which setting caused it?
  choices: [ignoreDifferences, CreateNamespace, retry, selfHeal]
  answer: [3]
  explain: 'A) wrong: that would prevent the revert. B) wrong. C) wrong. D) correct.'
- id: layout
  prompt: Which layout choices help promotion? (select two)
  choices: [Editing the cluster by hand, Directories per environment in the configuration repository, A separate repository for configuration and application code, Long-lived branches per environment]
  answer: [1, 2]
  explain: 'A) wrong. B) correct. C) correct. D) wrong: merge conflicts and unreviewable diffs.'
- id: drift
  prompt: A field written by the autoscaler shows permanent drift. What is the fix?
  choices: [Exclude that field from comparison, Delete the Application, Disable the autoscaler, Lower the interval]
  answer: [0]
  explain: 'A) correct. B) wrong. C) wrong. D) wrong.'
