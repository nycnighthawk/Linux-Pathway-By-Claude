title: 'Quiz: metrics and OpenTelemetry'
questions:
- id: counter
  prompt: How should you read a counter?
  choices: [It cannot be queried, Through rate() over a window, With avg(), As an instantaneous value]
  answer: [1]
  explain: 'A) wrong. B) correct. C) wrong. D) wrong: totals reset on restart.'
- id: histogram
  prompt: Why are histograms preferred for latency?
  choices: [They need no labels, They are smaller, Buckets can be summed across instances to estimate quantiles, They are push based]
  answer: [2]
  explain: 'A) wrong. B) wrong. C) correct. D) wrong.'
- id: labels
  prompt: Which label is safe on a request counter? (select two)
  choices: [Status class such as 2xx, Customer ID, Route template such as /users/:id, Raw URL with query string]
  answer: [2, 0]
  explain: 'A) correct. B) wrong: unbounded. C) correct. D) wrong: unbounded.'
- id: propagation
  prompt: What carries trace context between services?
  choices: [The traceparent header, A Kubernetes label, The node name, The Pod IP]
  answer: [0]
  explain: 'A) correct: W3C Trace Context. B) wrong. C) wrong. D) wrong.'
- id: sampling
  prompt: Why does tail sampling need a gateway Collector?
  choices: [It uses less memory, It is faster at the agent, It must see whole traces before deciding, It encrypts spans]
  answer: [2]
  explain: 'A) wrong. B) wrong. C) correct. D) wrong.'
