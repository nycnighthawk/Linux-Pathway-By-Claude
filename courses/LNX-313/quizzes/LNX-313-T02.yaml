title: 'Quiz: config, Secrets, security, limits'
questions:
- id: env-update
  prompt: A ConfigMap used as an environment variable is edited. What happens to running Pods?
  choices: [Nothing until they restart, The Pod is rescheduled, The variable updates in seconds, The container is killed]
  answer: [0]
  explain: 'A) correct: env is resolved at container start. B) wrong. C) wrong. D) wrong.'
- id: base64
  prompt: What does base64 in a Secret give you?
  choices: [Encryption, Access control, Representation of arbitrary bytes, Integrity checking]
  answer: [2]
  explain: 'A) wrong: encryption at rest is configured separately. B) wrong. C) correct. D) wrong.'
- id: restricted
  prompt: Which fields are required by the restricted level? (select two)
  choices: [allowPrivilegeEscalation false, capabilities drop ALL, hostNetwork true, privileged true]
  answer: [0, 1]
  explain: 'A) correct. B) correct. C) wrong. D) wrong.'
- id: qos
  prompt: A Pod has a memory request of 256Mi, a limit of 512Mi and a CPU request only. Which class?
  choices: [Guaranteed, BestEffort, Critical, Burstable]
  answer: [3]
  explain: 'A) wrong: Guaranteed needs equal request and limit. B) wrong. C) wrong. D) correct.'
- id: throttle
  prompt: A service shows tail latency spikes while average CPU is below its limit. What is the likely cause?
  choices: [DNS, CFS quota throttling in bursty periods, Image pull, Memory pressure]
  answer: [1]
  explain: 'A) wrong. B) correct. C) wrong. D) wrong.'
