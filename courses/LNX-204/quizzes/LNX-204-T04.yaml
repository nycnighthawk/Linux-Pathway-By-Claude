title: 'Quiz: SELinux: contexts, booleans, audit2why'
questions:
- id: move-label
  prompt: A file moved with mv into the web root is denied to httpd_t. What is the usual cause?
  choices:
  - mv keeps the old SELinux type, for example user_home_t
  - The file is too large
  - httpd_t cannot read files
  - mv changed the file mode
  answer:
  - 0
  explain: Moving preserves the label, whereas copying creates a file that inherits the directory type. Mode and size are unrelated, and httpd_t
    can read web content types.
- id: persistent-label
  prompt: Which pair makes a label change survive a relabel?
  choices:
  - setenforce 0
  - chcon then reboot
  - restorecon alone
  - semanage fcontext -a ... then restorecon
  answer:
  - 3
  explain: semanage records the rule in policy and restorecon applies it. chcon is lost at the next relabel, setenforce changes the mode, and
    restorecon alone would restore the old rule.
- id: boolean
  prompt: audit2why says a denial was caused by a boolean. What do you run?
  choices:
  - setsebool -P name on
  - semodule -r
  - audit2allow -M local
  - setenforce 0
  answer:
  - 0
  explain: A boolean exists for exactly this case and -P keeps it across reboots. A local module is the last resort, permissive mode weakens everything,
    and semodule -r removes modules.
- id: port-type
  prompt: 'nginx cannot bind tcp 8081 under httpd_t. The smallest fix is:'
  choices:
  - chmod 777 on the binary
  - Run nginx as root
  - Disable SELinux
  - semanage port -a -t http_port_t -p tcp 8081
  answer:
  - 3
  explain: Port types are policy objects and semanage adds the port to the allowed type. Disabling, mode changes and running as root do not address
    the denial or are worse.
- id: disabled
  prompt: Why is switching from disabled back to enforcing more than a one-line change?
  choices:
  - The policy must be reinstalled
  - The kernel must be recompiled
  - audit must be removed
  - Files created while disabled have no labels, so a full relabel is needed
  answer:
  - 3
  explain: Unlabelled files would be denied or mislabelled, so touch /.autorelabel and reboot. A recompile and reinstall are not needed.
- id: permissive-domain
  prompt: What is better than setenforce 0 when debugging one daemon?
  choices:
  - semanage permissive -a httpd_t
  - Unmount /var
  - chcon -R on /
  - Delete the policy
  answer:
  - 0
  explain: A permissive domain logs without denying for just that daemon and leaves the rest enforcing. The other options destroy protection or
    do damage.
