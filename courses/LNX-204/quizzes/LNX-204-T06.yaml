title: 'Quiz: nftables hardening'
questions:
- id: policy
  prompt: Which base-chain setting makes an input chain default-deny?
  choices:
  - hook forward
  - policy accept with a final drop rule
  - policy drop
  - priority 100
  answer:
  - 2
  explain: A drop policy discards what no rule accepts, even if a rule is inserted after a final drop. policy accept with a last rule can be defeated
    by later rules.
- id: family
  prompt: Why use the inet family for a host firewall?
  choices:
  - It enables NAT
  - It requires no kernel support
  - One ruleset covers IPv4 and IPv6, so IPv6 is not left open
  - It is faster than ip
  answer:
  - 2
  explain: A table in ip leaves IPv6 unfiltered. inet is not about speed or NAT.
- id: icmpv6
  prompt: Why not drop all ICMPv6?
  choices:
  - nft cannot match it
  - It is encrypted
  - It is only for IPv4
  - Neighbour discovery and packet-too-big are needed for IPv6 to work
  answer:
  - 3
  explain: IPv6 depends on ICMPv6 for address resolution and path MTU, so blanket drops break connectivity.
- id: order
  prompt: Where must a rate-limit rule for SSH sit relative to the accept for the same port?
  choices:
  - After it
  - Before it, otherwise the accept short-circuits the limiter
  - It does not matter
  - In another table only
  answer:
  - 1
  explain: Rules are evaluated in order and accept ends evaluation, so a limiter after the accept never runs.
- id: rollout
  prompt: What is the safest way to apply a new ruleset over SSH?
  choices:
  - nft -c to check, keep a second session open, and arm a timed revert
  - Disable the firewall first
  - nft flush ruleset then paste
  - Reboot and hope
  answer:
  - 0
  explain: Check, test and have an automatic way back. Flushing leaves a gap, rebooting is a gamble, and disabling removes protection.
- id: containers
  prompt: Why can published container ports bypass your input chain?
  choices:
  - They are encrypted
  - Published ports are forwarded, so they traverse the forward hook instead of input
  - Docker uses UDP only
  - Containers disable nftables
  answer:
  - 1
  explain: Traffic to a container is routed through the host, so restrict it in forward or with the engine's settings.
