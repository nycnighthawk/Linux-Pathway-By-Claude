title: 'Quiz: PAM, pwquality, faillock'
questions:
- id: preauth-order
  prompt: Where must the faillock preauth line sit in the auth stack, and why?
  choices:
  - Before pam_unix, so a locked account is refused without testing the password
  - At the end of the account group
  - Anywhere, because required lines are order-independent
  - After pam_unix, so failures are already known
  answer:
  - 0
  explain: Preauth refuses a locked account before the password is tested, so a correct guess after the threshold cannot succeed. After pam_unix
    it would still be tested; account is a different group; and order in a stack is significant.
- id: both-files
  prompt: On a Red Hat family host, why must lockout be present in both system-auth and password-auth?
  choices:
  - Both files are read by every program
  - password-auth only stores history
  - password-auth is used by remote services such as sshd, system-auth by console and sudo, so one file alone leaves a door open
  - The second file is a backup copy
  answer:
  - 2
  explain: Entry points use different generated files, so counters only protect the doors that include the module. The files are not read by every
    program, password-auth is not just history, and it is not a backup.
- id: credit-sign
  prompt: In pwquality.conf, what does dcredit = -1 mean?
  choices:
  - Digits are forbidden
  - At least one digit is required
  - One digit may be reused
  - Each digit earns one credit toward length
  answer:
  - 1
  explain: A negative credit value turns the option into a requirement of that many characters of the class. A positive value is the credit toward
    length; it does not forbid or limit anything.
- id: authselect
  prompt: Why use authselect rather than editing system-auth by hand?
  choices:
  - The generated files are rewritten from a profile, so hand edits are refused or lost on update
  - authselect is faster at login time
  - It encrypts the stack files
  - Hand edits are not allowed by the kernel
  answer:
  - 0
  explain: authselect treats the stack as generated output of a profile and checks for drift. It does not change login speed, the kernel does
    not care who edits PAM files, and it does not encrypt anything.
- id: lockout-risk
  prompt: What is the main denial-of-service risk of a strict lockout threshold?
  choices:
  - The audit log grows without bound
  - Passwords expire sooner
  - An attacker who knows account names can lock out administrators on purpose
  - SSH keys stop working
  answer:
  - 2
  explain: Locking is an availability cost an attacker can trigger by failing logins deliberately. It does not expire passwords, it only adds
    a few audit records, and key logins skip the password counter.
- id: faillock-cmd
  prompt: Which command lists and clears the failure records of a user?
  choices:
  - pam_tally2 -u alice
  - passwd -l alice
  - faillock --user alice (and --reset to clear)
  - chage -l alice
  answer:
  - 2
  explain: The faillock tool reads the per-user records. passwd -l locks the password itself, pam_tally2 belongs to the removed older module,
    and chage shows ageing data.
