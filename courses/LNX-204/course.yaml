id: LNX-204
title: Linux Security Fundamentals
summary: 'Host hardening on Linux: PAM lockout and password quality, sudo policy, SSH and certificates, SELinux and AppArmor,
  nftables, auditd, AIDE, OpenSCAP, TLS with openssl, and CVE triage.'
hours: 60
outcomes:
- Configure PAM, faillock and password-quality policy through the supported tooling
- Write sudo rules that grant one action rather than a program
- Harden sshd and issue short-lived SSH certificates from a private CA
- Diagnose SELinux denials as label, boolean, port or policy problems and apply the smallest fix
- Write and test AppArmor profiles and a default-drop nftables host firewall
- Design audit rules, an AIDE baseline and OpenSCAP scans and read their reports
- Build a private TLS certificate authority and inspect servers with openssl
- Triage CVEs and advisories by exposure rather than by score alone
