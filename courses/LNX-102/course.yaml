id: LNX-102
title: System Administration Essentials
summary: 'Everyday administration of a systemd-based server: accounts and sudo, processes, units and targets, boot, logs,
  schedules, time, kernel tuning and proving that changes persist.'
hours: 60
coverage: full
outcomes:
- Create users and groups, set password ageing and write a validated, narrow sudo rule
- Inspect and control processes with signals, priorities and job control
- Write systemd drop-in overrides, choose targets and read the dependency graph
- Explain the boot sequence, edit boot-loader defaults and reach a rescue target
- Rotate and route logs with journald, rsyslog and logrotate
- Schedule the same job with cron, at and a systemd timer
- Configure chrony and time zones, kernel modules, sysctl and TuneD profiles
- Verify that a change survives a reboot without rebooting the host
