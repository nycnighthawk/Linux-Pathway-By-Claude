id: LNX-203
title: Shell Scripting & Python for Sysadmins
summary: 'Reliable automation on Linux: Bash with strict mode, quoting and traps, ShellCheck and bats tests, text and JSON
  processing with awk, jq and yq, Python tools for operations, a review-ready Git workflow, and running scripts as systemd
  services and timers.'
hours: 50
coverage: full
outcomes:
- Write Bash scripts with correct tests, loops, functions and cleanup traps
- Apply strict mode and quoting rules and keep scripts ShellCheck-clean
- Test shell scripts with bats and judge a suite by the mutants it catches
- Summarise text with awk and query JSON and YAML with jq and yq
- Build command line tools in Python with argparse, logging and meaningful exit codes
- Use branches, rebase and bisect to deliver and debug changes
- Run scripts as hardened systemd services with timers
