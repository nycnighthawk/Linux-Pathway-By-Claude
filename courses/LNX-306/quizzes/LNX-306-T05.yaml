title: 'Quiz: OpenTofu with libvirt provider'
questions:
- id: state
  prompt: What is the role of the state file?
  choices:
  - It caches the package downloads of the provider
  - It stores the Git history of the configuration
  - It maps configuration addresses to the real objects the tool created
  - It holds the source code of the providers and the modules that the root module calls
  answer:
  - 2
  explain: 'A) wrong: unrelated. B) wrong: Git stores history. C) correct: without it the tool would try to recreate everything. D) wrong: providers are downloaded separately.'
- id: foreach
  prompt: vm_names is a set of three names used with for_each. You remove one name and apply. What happens?
  choices:
  - The shared base image is deleted along with the VM
  - Only the VM for the removed name, with its disk and seed
  - All three VMs are destroyed and built again from scratch
  - Nothing changes, because the VM already exists
  answer:
  - 1
  explain: 'A) wrong: the base volume is shared. B) correct: resources are tracked by key. C) wrong: the other keys are unchanged. D) wrong: it is no longer declared.'
- id: secretsstate
  prompt: Why must the state file be protected?
  choices:
  - It is executable and could be made to run commands on the host that opens it
  - It keeps attribute values, which can include keys and passwords
  - It is never backed up unless you configure it
  - It can grow very large as resources are added
  answer:
  - 1
  explain: 'A) wrong: it is data. B) correct: sensitive variables are hidden from plan output but remain in state. C) wrong: backups are advised, but the issue is content. D) wrong: size is not the risk.'
- id: savedplan
  prompt: Why apply a saved plan file in a pipeline?
  choices:
  - It skips the provider download step on the runner
  - It makes the apply finish faster than a fresh plan
  - What was reviewed is exactly what runs, even if state changed
  - It turns off state locking for that run
  answer:
  - 2
  explain: 'A) wrong: unrelated. B) wrong: not the point. C) correct: a fresh plan could differ from the reviewed one. D) wrong: locking still applies.'
- id: drift
  prompt: Which command reports differences caused by hand edits without proposing configuration changes?
  choices:
  - tofu init, which installs providers and modules
  - tofu destroy, which removes all the managed resources so that they can be rebuilt
  - tofu plan -refresh-only, which compares state with reality
  - tofu fmt, which only formats the configuration files
  answer:
  - 2
  explain: 'A) wrong: installs providers. B) wrong: that deletes the resources. C) correct: it refreshes state from reality and shows drift. D) wrong: formats files only.'
- id: userdata
  prompt: You change the user-data template of a running VM and apply. What should you expect?
  choices:
  - cloud-init in the guest re-runs and applies the change at once
  - An empty plan, because user-data is not tracked
  - libvirt deletes the VM when the seed ISO changes
  - A new seed ISO; cloud-init re-runs only after a new instance-id or clean
  answer:
  - 3
  explain: 'A) wrong: per-instance modules run once. B) wrong: the plan shows a seed change. C) wrong: libvirt does not delete. D) correct: replace the VM or push the change by configuration management.'
- id: handedit
  prompt: The plan shows a disk it wants to replace, but a colleague resized that disk by hand last week. What is the safest first step?
  choices:
  - Run tofu plan -refresh-only to see the drift, then decide what to keep
  - Apply the plan and accept the replacement of the disk
  - Delete the state file and import every resource again from the live libvirt host
  - Run tofu fmt so the difference settles by itself
  answer:
  - 0
  explain: 'A) correct: shows the difference without changing anything. B) wrong: may destroy data on the disk. C) wrong: loses the mapping of every resource. D) wrong: formatting does not touch drift.'
- id: twoapply
  prompt: Two pipeline jobs apply to the same state at the same time and one fails with a lock error. What does this tell you?
  choices:
  - The provider has a bug that has to be reported upstream
  - The backend locks state so two writers cannot corrupt it; rerun later
  - One module has a syntax error that only shows up when the plan is applied
  - The libvirt host ran out of memory while applying
  answer:
  - 1
  explain: 'A) wrong: locking is working as designed. B) correct: the lock protects the state. C) wrong: a syntax error fails earlier. D) wrong: a lock error is about state.'
