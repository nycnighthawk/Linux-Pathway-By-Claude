title: 'Quiz: Kickstart, preseed, autoinstall'
questions:
- id: clearpart
  prompt: What is the danger of "clearpart --all --initlabel" with no drive filter?
  choices:
  - It resets the BIOS settings of the target host and reboots it
  - It can erase every disk the installer sees, data disks included
  - It clears only the disk the installer booted from, nothing else
  - It removes the installer logs from the target after the run
  answer:
  - 1
  explain: 'A) wrong: unrelated to disk partitioning. B) correct: pair it with ignoredisk --only-use and --drives. C) wrong: it is not limited to the boot disk by default. D) wrong: logs are untouched by partitioning commands.'
- id: rootpw
  prompt: Which is the safest root setting in an answer file?
  choices:
  - rootpw --plaintext changeme with a forced change at first login
  - One shared root password passed in the Kickstart URL for every host
  - An empty root password that a first-boot script sets later on
  - rootpw --lock plus an SSH key for a named administrator
  answer:
  - 3
  explain: 'A) wrong: a readable shared secret that sits in the file. B) wrong: URLs end up in server logs and shell history. C) wrong: anyone can log in until that script runs. D) correct: no password exists to steal and access is by key.'
- id: ksdelivery
  prompt: How do you tell Anaconda to use a Kickstart file served over HTTP?
  choices:
  - The kernel argument inst.ks=http://server/path/ks.cfg
  - A ks=http://server/path entry in /etc/fstab of the install media
  - A DNS TXT record on the domain that names the answer file
  - A file called ks.cfg that the installer finds by scanning the LAN
  answer:
  - 0
  explain: 'A) correct: inst.ks takes URL, nfs and hd locations. B) wrong: the installer does not read fstab. C) wrong: no such discovery mechanism exists. D) wrong: Anaconda does not scan the network.'
- id: preseedtime
  prompt: Why can a preseed file fetched over the network fail to answer the network questions?
  choices:
  - Preseed has no support for static network settings at all
  - Debian blocks HTTP downloads while the installer is still running
  - Network setup runs before the file is fetched, so those questions come first
  - The file is only parsed after it grows past a certain size
  answer:
  - 2
  explain: 'A) wrong: it supports them as netcfg values. B) wrong: HTTP is not blocked. C) correct: set netcfg values as boot parameters or embed the file in the initrd. D) wrong: size is irrelevant.'
- id: autoinstallsafe
  prompt: Why does Ubuntu autoinstall wait for confirmation unless the autoinstall kernel argument is present?
  choices:
  - Subiquity must download updates first and needs time to finish
  - The installer has to ask which language the new system should use
  - The pause is a defect that the next point release should remove
  - An install that erases disks should need explicit consent
  answer:
  - 3
  explain: 'A) wrong: unrelated to the prompt. B) wrong: language is part of the file. C) wrong: the wait is deliberate. D) correct: the argument is that consent.'
- id: handoff
  prompt: What should the answer file hand over to at the end?
  choices:
  - A manual checklist that an engineer completes after the first login
  - Configuration management or cloud-init, which converge repeatedly
  - The BIOS, which applies the remaining host settings by itself
  - Nothing, because the installer should configure every setting itself
  answer:
  - 1
  explain: 'A) wrong: a checklist is not repeatable. B) correct: keep the file small and let repeatable tools do the rest. C) wrong: unrelated to the installer. D) wrong: the installer runs once and is hard to test.'
- id: wipeddata
  prompt: A host reinstalls overnight and the data disk is empty. The Kickstart has "clearpart --all --initlabel" and no other storage lines. What is the most likely cause?
  choices:
  - The data disk failed at the same moment the reinstall began
  - No drive filter, so the command cleared the data disk too
  - The installer mounted the data disk read-only and lost its files
  - The reinstall fetched the wrong repository for the target host
  answer:
  - 1
  explain: 'A) wrong: the file explains the loss without a failure. B) correct: restrict it with ignoredisk --only-use or clearpart --drives. C) wrong: a read-only mount does not erase data. D) wrong: the repository does not partition disks.'
- id: urlpassword
  prompt: A reviewer finds a shared root password inside the URL used to fetch the answer file. Which change fixes the design?
  choices:
  - Lock root, add an SSH key for a named admin, keep secrets off URLs
  - Shorten the URL so that it fits in the boot menu entry
  - Move the password to a second URL on the same web server
  - Rotate the shared password every month and keep fetching the file from the same URL
  answer:
  - 0
  explain: 'A) correct: removes the shared secret and the leak. B) wrong: length does not change the exposure. C) wrong: it still travels as a request that is logged. D) wrong: the secret still sits in logs between rotations.'
