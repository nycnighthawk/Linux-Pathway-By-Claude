title: 'Quiz: Foreman/MAAS bare metal'
questions:
- id: commission
  prompt: What does MAAS commissioning do?
  choices:
  - Installs the production OS
  - Mirrors repositories
  - Boots an ephemeral image that gathers hardware facts and runs tests, making the machine Ready
  - Deletes the BMC
  answer:
  - 2
  explain: 'A) wrong: that is deployment. B) wrong: unrelated. C) correct: results go in the inventory. D) wrong: unrelated.'
- id: buildmode
  prompt: What is the purpose of build mode in Foreman?
  choices:
  - It shuts the host down
  - It compiles packages
  - It makes the boot service give a host its installer; outside build mode it boots from disk, so a reboot cannot reinstall it
  - It changes the BMC password
  answer:
  - 2
  explain: 'A) wrong: unrelated. B) wrong: nothing is compiled. C) correct: a state protects hosts in service. D) wrong: unrelated.'
- id: smartproxy
  prompt: What is a Foreman smart proxy?
  choices:
  - A kind of firewall
  - A service near the machines that provides DHCP, DNS, TFTP, BMC control or template serving on the server's behalf
  - A DNS cache only
  - A web browser plugin
  answer:
  - 1
  explain: 'A) wrong: unrelated. B) correct: it keeps boot services local to each site. C) wrong: it does more than DNS. D) wrong: unrelated.'
- id: split
  prompt: How do platforms and infrastructure as code usually divide the work?
  choices:
  - IaC owns firmware
  - They cannot be combined
  - The platform owns physical machines and their lifecycle; IaC owns logical and virtual resources
  - The platform owns DNS records for every cloud
  answer:
  - 2
  explain: 'A) wrong: firmware is hardware lifecycle. B) wrong: a MAAS Terraform provider exists. C) correct: each calls the other through its API. D) wrong: not a platform duty.'
- id: bmc
  prompt: Which BMC practice is correct?
  choices:
  - Put the BMC on an isolated network, change credentials, store them in a vault and rotate them
  - Expose it to the internet for support
  - Leave default credentials for convenience
  - Share one password across the company
  answer:
  - 0
  explain: 'A) correct. B) wrong: never expose. C) wrong: BMC compromise is full machine compromise. D) wrong: no per-host accountability.'
- id: fdo
  prompt: What problem does FIDO Device Onboard address?
  choices:
  - Time sync
  - Printing
  - Secure onboarding of devices to their owner without pre-configuration, using an ownership voucher
  - Disk encryption
  answer:
  - 2
  explain: 'A) wrong. B) wrong. C) correct: the device contacts a rendezvous server and then its owner. D) wrong.'
