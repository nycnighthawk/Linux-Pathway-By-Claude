title: 'Quiz: BMC, IPMI and Redfish'
questions:
- id: bmc
  prompt: Why can a BMC power-cycle a server that is switched off at the operating-system level?
  choices:
  - It relies on an agent that must be installed and running inside the host OS
  - It shares the host network card with the operating system
  - It is a separate computer with its own port, on standby power
  - It runs as a module inside the host kernel
  answer:
  - 2
  explain: 'A) wrong: no agent is needed. B) wrong: it has its own port. C) correct: independent of the host. D) wrong: it is separate hardware.'
- id: once
  prompt: Which Redfish settings make a PXE boot apply for one boot only?
  choices:
  - PowerState set to Pxe before the next reset
  - ResetType ForceOff followed by ForceOn on the system
  - BootSourceOverrideTarget Pxe with BootSourceOverrideEnabled Once
  - BootSourceOverrideTarget Pxe with BootSourceOverrideEnabled Continuous
  answer:
  - 2
  explain: 'A) wrong: not a valid state. B) wrong: power cycle only, no boot choice. C) correct: the override clears after one boot. D) wrong: stays for every boot.'
- id: password
  prompt: Why prefer ipmitool -E (password from the environment) over -P?
  choices:
  - -P is no longer supported by current ipmitool builds
  - -E encrypts the traffic between the client and the BMC
  - A command-line password shows in the process list
  - -E makes the connection to the BMC faster
  answer:
  - 2
  explain: 'A) wrong: it works but is unsafe. B) wrong: encryption depends on lanplus. C) correct: other users can read process arguments. D) wrong: no speed change.'
- id: suite0
  prompt: What is the danger of IPMI cipher suite 0?
  choices:
  - It limits the BMC to a single management session at a time for all users
  - It allows sessions without authentication or encryption
  - It switches off serial-over-LAN on the BMC
  - It forces every session through TLS
  answer:
  - 1
  explain: 'A) wrong: unrelated. B) correct: a known weakness. C) wrong: unrelated. D) wrong: IPMI does not use TLS.'
- id: allowable
  prompt: Why should a Redfish client read the allowable values and system ids from the service?
  choices:
  - The standard forbids a client from caching any values
  - TLS needs the values to negotiate a session
  - The values never change between server models, firmware versions and vendors alike
  - Ids and values differ by vendor, so assumptions fail on a new model
  answer:
  - 3
  explain: 'A) wrong: not forbidden. B) wrong: unrelated. C) wrong: they differ by model and firmware. D) correct: discover instead of assume.'
- id: nohw
  prompt: Which is a way to practise BMC automation without servers?
  choices:
  - Turn off the firewall on the workstation first
  - A mock Redfish service, sushy-emulator or virtualbmc over libvirt guests
  - Run ping against a test address and read the replies to check the power state
  - Run ipmitool against a public address that answers
  answer:
  - 1
  explain: 'A) wrong: unrelated. B) correct: emulators behave like a BMC. C) wrong: ping does not manage power. D) wrong: attacking others is not practice.'
- id: timeoutcase
  prompt: A script sets a one-time PXE boot through Redfish and gets HTTP 400 on a new server model. The same call worked on the old model. What do you do first?
  choices:
  - Read the system id and allowable values from the new model and fix the request
  - Retry the same call a few times until it succeeds
  - Disable certificate checks on the client and send the same request once more
  - Switch the script to cipher suite 0 for the new model
  answer:
  - 0
  explain: 'A) correct: vendors differ in ids and values. B) wrong: a 400 is a request problem. C) wrong: unrelated to a bad request. D) wrong: weakens security and is not the cause.'
- id: sniffed
  prompt: During an audit, a scan shows the BMC accepts cipher suite 0. What should be done?
  choices:
  - Leave it as it is, because the management network is trusted
  - Disable suite 0 and null authentication, use a strong suite, isolate the network
  - Send the scan result to the vendor and take no action yet
  - Change the user names but keep all the cipher suites
  answer:
  - 1
  explain: 'A) wrong: one foothold then controls every machine. B) correct: closes the hole. C) wrong: the risk remains. D) wrong: suite 0 needs no user name.'
