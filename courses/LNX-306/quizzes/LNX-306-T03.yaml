title: 'Quiz: cloud-init'
questions:
- id: header
  prompt: What happens if user-data has no #cloud-config first line?
  choices:
  - It is still parsed as configuration
  - It is not treated as cloud-config, so its keys are ignored (or it is run as a script if it starts with #!)
  - The instance does not boot
  - cloud-init is removed
  answer:
  - 1
  explain: 'A) wrong: the header selects the handler. B) correct: the type is detected from the first line. C) wrong: boot continues. D) wrong: nothing is removed.'
- id: instanceid
  prompt: Why did ten cloned VMs skip their runcmd entries?
  choices:
  - runcmd is deprecated
  - They shared the instance-id, so cloud-init believed it had already run on that instance
  - The disks were full
  - YAML forbids lists
  answer:
  - 1
  explain: 'A) wrong: it works. B) correct: per-instance modules key on the id. C) wrong: unrelated. D) wrong: lists are fine.'
- id: nocloud
  prompt: How does cloud-init find a NoCloud seed on a volume?
  choices:
  - By the file name seed.iso
  - By the volume label cidata (or CIDATA) with user-data and meta-data files
  - By the MAC address
  - By DNS
  answer:
  - 1
  explain: 'A) wrong: names do not matter. B) correct: the label is the key. C) wrong: unrelated. D) wrong: unrelated.'
- id: secrets
  prompt: Why are passwords in user-data a problem?
  choices:
  - YAML cannot hold them
  - Any process on the instance, and anyone who can read the instance configuration, can read them
  - They slow boot
  - They are removed at boot
  answer:
  - 1
  explain: 'A) wrong: it can. B) correct: it is served by the metadata service and stored by the platform. C) wrong: unrelated. D) wrong: they persist.'
- id: clean
  prompt: What does cloud-init clean --logs prepare for?
  choices:
  - Capturing an image or retesting, so the next boot behaves as a first boot
  - Deleting the kernel
  - Formatting the disk
  - Changing the hostname
  answer:
  - 0
  explain: 'A) correct: it removes state and logs. B) wrong: unrelated. C) wrong: unrelated. D) wrong: unrelated.'
- id: validate
  prompt: Which command checks a user-data file against the schema before booting?
  choices:
  - cloud-init status
  - cloud-init schema --config-file user-data
  - cloud-id
  - cloud-init query
  answer:
  - 1
  explain: 'A) wrong: reports run state. B) correct: it catches type and indentation errors. C) wrong: names the datasource. D) wrong: reads instance data.'
