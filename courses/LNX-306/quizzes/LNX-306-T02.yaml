title: 'Quiz: PXE/iPXE/HTTP boot'
questions:
- id: opt93
  prompt: What does DHCP option 93 carry?
  choices:
  - The lease time
  - The hostname
  - The repository URL
  - The client system architecture (BIOS, x86-64 UEFI, ARM64 UEFI and so on)
  answer:
  - 3
  explain: 'A) wrong: option 51. B) wrong: option 12 is the hostname. C) wrong: no such option. D) correct: the server uses it to choose the boot file.'
- id: loop
  prompt: A UEFI client keeps loading iPXE forever. What is the usual cause?
  choices:
  - The disk is full
  - The server gives the iPXE binary to clients that already run iPXE, because option 175 is not matched
  - The kernel is too old
  - TFTP is disabled
  answer:
  - 1
  explain: 'A) wrong: unrelated. B) correct: tag clients with option 175 and serve them a script URL. C) wrong: the kernel is never reached. D) wrong: the first load works.'
- id: tftp
  prompt: Why move everything after the first file to HTTP?
  choices:
  - HTTP is encrypted by default
  - HTTP needs no DHCP
  - TFTP is slow and fragile for large files, while HTTP is fast and easy to cache and proxy
  - UEFI forbids TFTP
  answer:
  - 2
  explain: 'A) wrong: plain HTTP is not encrypted. B) wrong: DHCP is still needed. C) correct: kernels and initrds are large. D) wrong: TFTP is allowed.'
- id: safedefault
  prompt: What should the boot service answer to a machine that is in service?
  choices:
  - A rescue shell
  - A script that exits to the local disk
  - The installer
  - Nothing, so it hangs
  answer:
  - 1
  explain: 'A) wrong: gives away access. B) correct: exit falls through to the disk. C) wrong: reinstalls production by accident. D) wrong: hanging stalls a reboot.'
- id: secureboot
  prompt: Why does Secure Boot affect network boot?
  choices:
  - It blocks DHCP
  - The first-stage loader must be signed by a trusted key, so distributions use a signed shim and GRUB
  - It disables the network card
  - It requires TFTP
  answer:
  - 1
  explain: 'A) wrong: DHCP is separate. B) correct: unsigned loaders do not run. C) wrong: the card works. D) wrong: no such requirement.'
- id: relay
  prompt: How does DHCP reach a server on another subnet?
  choices:
  - It cannot
  - Through a DHCP relay (ip helper) on the router, which adds the gateway address
  - Through DNS
  - Through a TFTP proxy
  answer:
  - 1
  explain: 'A) wrong: relays are standard. B) correct: the server picks the scope from the relay address. C) wrong: unrelated. D) wrong: unrelated.'
