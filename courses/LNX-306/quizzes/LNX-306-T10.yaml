title: 'Quiz: Cloud provisioning'
questions:
- id: firstboot
  prompt: Why does a cloud image need a first-boot agent such as cloud-init?
  choices:
  - It makes the image smaller on the storage service
  - The image is generic, so each instance needs its own name, keys and role
  - It replaces the kernel in the image at first boot and then restarts the host
  - It installs the hypervisor on the host
  answer:
  - 1
  explain: 'A) wrong: unrelated. B) correct: that is the first-boot job. C) wrong: unrelated. D) wrong: unrelated.'
- id: ephemeral
  prompt: What is the danger of storing important data on an ephemeral disk?
  choices:
  - It is always encrypted with a key you cannot recover
  - It cannot be read by the instance that owns it
  - It is lost when the machine is deallocated or moved
  - It is slower than network storage in every case
  answer:
  - 2
  explain: 'A) wrong: not about encryption. B) wrong: it can be read. C) correct: keep data on persistent volumes. D) wrong: not the issue.'
- id: userdata
  prompt: Why avoid secrets in user data?
  choices:
  - It slows down the first boot
  - User data is limited to three lines by the platform
  - Anything that can reach the metadata service can read it
  - cloud-init ignores any secrets that it finds
  answer:
  - 2
  explain: 'A) wrong: unrelated. B) wrong: no such limit. C) correct: keep secrets in a secrets service. D) wrong: it does not.'
- id: imds
  prompt: What does requiring tokens on the metadata service defend against?
  choices:
  - It stops simple request forgery from fetching credentials with a plain GET
  - It prevents kernel updates from failing at boot
  - It protects against DNS outages in the network
  - It guards against disk failure on the instance
  answer:
  - 0
  explain: 'A) correct: a token needs a PUT first. B) wrong: unrelated. C) wrong: unrelated. D) wrong: unrelated.'
- id: role
  prompt: What is the advantage of an instance role over static access keys?
  choices:
  - Roles work only when the instance is offline
  - Roles carry no permissions of their own and so are safer to hand out freely
  - The platform issues short-lived credentials bound to the instance
  - Keys are faster to use than roles
  answer:
  - 2
  explain: 'A) wrong: unrelated. B) wrong: roles carry permissions. C) correct: nothing to leak or rotate by hand. D) wrong: not the point.'
- id: rollout
  prompt: How do you roll a new image out to an auto scaling group?
  choices:
  - Delete the whole group and create it again from scratch with the new image
  - Log in to each machine and upgrade it by hand
  - Edit the disks of the running instances in place
  - Point the template at the new image and replace instances in turn
  answer:
  - 3
  explain: 'A) wrong: causes an outage. B) wrong: not repeatable. C) wrong: dangerous and untracked. D) correct: repeatable and reversible.'
- id: leakedcreds
  prompt: A web application on an instance has a request-forgery bug and the attacker fetches role credentials from the metadata address. Which change would have blocked the simple GET?
  choices:
  - Requiring session tokens for metadata requests
  - Raising the instance size to handle more requests
  - Moving the credentials into user data instead
  - Opening more ports in the security group
  answer:
  - 0
  explain: 'A) correct: a plain GET no longer returns credentials. B) wrong: unrelated. C) wrong: user data is readable too. D) wrong: widens exposure.'
- id: lostdata
  prompt: After a stop and start the instance has a new host and the scratch data is gone. The team stored a database there. What is the lesson?
  choices:
  - Keep data on a persistent volume; use ephemeral disks for scratch only
  - Pick a larger instance type next time
  - Snapshot the ephemeral disk every minute
  - Disable cloud-init, so that it cannot reset the disk when the instance restarts
  answer:
  - 0
  explain: 'A) correct: ephemeral disks are lost on deallocation. B) wrong: size does not make it persistent. C) wrong: it may not be snapshot-able. D) wrong: cloud-init did not delete the data.'
