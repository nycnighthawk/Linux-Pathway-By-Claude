id: LNX-103
title: Storage & Filesystems
summary: 'Everything between a raw disk and a mounted, protected data set: partitions, file systems, LVM, swap, RAID, quotas
  and ACLs, network storage, encryption, backups and multipath.'
hours: 50
coverage: full
outcomes:
- Partition a disk with GPT or MBR and keep a replayable layout
- Create ext4, XFS and Btrfs file systems and mount them persistently with fstab or mount units
- Grow, snapshot and thin-provision storage with LVM
- Configure swap files and compressed swap in RAM
- Build, monitor and repair software RAID with mdadm
- Apply quotas, POSIX ACLs and extended attributes and preserve them in copies
- Mount NFS and SMB shares and automount them on demand
- Explain iSCSI targets and initiators and recognise hardware RAID and multipath setups
- Encrypt volumes with LUKS2 and manage keys and headers
- Back up and restore with rsync and restic, and prove the restore
