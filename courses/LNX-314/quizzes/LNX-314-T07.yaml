title: 'Quiz: Falco and audit logs'
questions:
- id: secrets-level
  prompt: At which audit level should reads of Secrets normally be logged?
  choices: [RequestResponse, Metadata, They should never be logged, Request]
  answer: [1]
  explain: 'A) wrong: the response body would copy the secret values into the log. B) correct: who, when and what, without bodies. C) wrong: access to Secrets is the event to watch. D) wrong: a create or update request body would carry the values.'
- id: first-match
  prompt: An audit policy has a catch-all Metadata rule first and a RequestResponse rule for pods/exec after it. What happens to exec requests?
  choices: [They are logged at RequestResponse, They are logged at Metadata because the first matching rule wins, They are dropped, The API server refuses to start]
  answer: [1]
  explain: 'A) wrong: the later rule is never reached. B) correct: put specific rules before the catch-all. C) wrong. D) wrong.'
- id: vantage
  prompt: An attacker with a stolen token lists Secrets from outside the cluster and creates a ClusterRoleBinding. Which record shows it?
  choices: [Falco node events, The API audit log, Neither, The kubelet log only]
  answer: [1]
  explain: 'A) wrong: nothing ran on a node. B) correct: all API requests are audited. C) wrong. D) wrong.'
- id: tuning
  prompt: What keeps a Falco deployment useful over months? (select two)
  choices: [Enabling every rule on day one, Tracking alerts per rule and the share that were acted on, Muting the alert channel, Exceptions maintained as reviewed code]
  answer: [3, 1]
  explain: 'A) wrong: it creates noise. B) correct: signal quality is a metric. C) wrong. D) correct.'
- id: blinding
  prompt: Which weakness applies to a rule that matches the process name xmrig?
  choices: [It slows down the API server, It needs a kernel module, It cannot run in containers, Renaming the binary evades it]
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong. D) correct: prefer behaviour rules (outbound connection from a freshly written executable).'
