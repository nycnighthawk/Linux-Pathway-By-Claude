title: 'Quiz: RBAC minimisation and API access'
questions:
- id: list-secrets
  prompt: A role grants only "list" on Secrets. What can the holder do?
  choices: [Read the full content of all Secrets in scope, Delete Secrets, Nothing; list is harmless, Only see the names of Secrets]
  answer: [0]
  explain: 'A) correct: list and watch expose content like get. B) wrong: delete is a separate verb. C) wrong. D) wrong: list returns the objects including their data.'
- id: pod-create
  prompt: Why is "create pods" in a namespace treated as a powerful permission? (select two)
  choices: [Pods always run as root, The Pod can mount any service account token in the namespace, Pods bypass RBAC for their own requests, The Pod can mount any Secret in the namespace]
  answer: [3, 1]
  explain: 'A) wrong: depends on security settings. B) correct: the creator borrows other identities. C) wrong: requests from Pods are still authorised. D) correct.'
- id: resourcenames
  prompt: Which request is NOT constrained by resourceNames in a rule?
  choices: [create of any object, patch on a named Deployment, get on a named ConfigMap, delete of a named object]
  answer: [0]
  explain: 'A) correct: the name is not known when the object is created, and list or watch return everything the rule allows. B) wrong: restricted. C) wrong: named gets are restricted. D) wrong: restricted.'
- id: scope
  prompt: A ClusterRole is bound with a RoleBinding in namespace shop. Where do its rules apply?
  choices: [Only namespace shop, Nowhere until a ClusterRoleBinding exists, Only cluster-scoped resources, All namespaces]
  answer: [0]
  explain: 'A) correct: the binding limits it to its own namespace. B) wrong. C) wrong: cluster-scoped resources are not reachable this way. D) wrong: that needs a ClusterRoleBinding.'
- id: automount
  prompt: A web application never calls the Kubernetes API. What should its Pod spec say?
  choices: [Keep the default token mount, Bind it to view, Create a long-lived token Secret, automountServiceAccountToken false]
  answer: [3]
  explain: 'A) wrong: an unused credential is only exposure. B) wrong: still grants read rights. C) wrong: worse than the default. D) correct: no credential, nothing to steal.'
