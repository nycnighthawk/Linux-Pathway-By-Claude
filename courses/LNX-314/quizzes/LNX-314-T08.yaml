title: 'Quiz: Sandboxed runtimes and RuntimeClass'
questions:
- id: design
  prompt: What is the isolation boundary in gVisor?
  choices: [A separate network namespace, A seccomp profile only, A hypervisor with a guest kernel, A user-space kernel that implements system calls and talks to the host through a narrow interface]
  answer: [3]
  explain: 'A) wrong. B) wrong: seccomp is used on the Sentry itself, but is not the whole design. C) wrong: that describes Kata. D) correct: the Sentry.'
- id: overhead
  prompt: A RuntimeClass declares overhead of 250m CPU and 120Mi memory. A Pod requests 500m and 256Mi. What does the scheduler use?
  choices: [250m and 120Mi, 1 CPU and 512Mi, 750m and 376Mi, 500m and 256Mi]
  answer: [2]
  explain: 'A) wrong: that is only the overhead. B) wrong: those are not the numbers given. C) correct. D) wrong: overhead is added.'
- id: missing-handler
  prompt: A Pod names a RuntimeClass whose handler is not configured on the node it lands on. What happens?
  choices: [The container fails to start and an event reports the error, The API server rejects the Pod at creation, It runs with the default runtime, The scheduler picks another handler]
  answer: [0]
  explain: 'A) correct. B) wrong: the API server does not know node configuration; use the scheduling field to keep Pods on suitable nodes. C) wrong: that would silently drop the isolation. D) wrong.'
- id: choose
  prompt: Which workloads justify a sandboxed runtime? (select two)
  choices: [A multi-tenant cluster where tenants are separate companies, Your own stateless web service with a reviewed image, Customer-submitted build jobs, A kubelet-level DaemonSet that needs host access]
  answer: [2, 0]
  explain: 'A) correct. B) wrong: ordinary hardening is usually enough. C) correct: untrusted code. D) wrong: a sandbox blocks the host access it needs.'
- id: not-covered
  prompt: What does a sandbox NOT protect against?
  choices: [A tenant reading another tenant's memory via the kernel, A container escape through a runtime bug in the host kernel, A kernel vulnerability reachable through system calls, A leaked service account token used through the API]
  answer: [3]
  explain: 'A) covered. B) covered. C) covered. D) correct: credentials and RBAC are unrelated to the kernel boundary.'
