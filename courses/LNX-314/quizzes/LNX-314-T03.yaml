title: 'Quiz: AppArmor, seccomp and the kernel attack surface'
questions:
- id: shared-kernel
  prompt: Why is a kernel bug reachable from inside a container a container escape?
  choices: [Namespaces disable bug fixes, Seccomp is always off in containers, All containers and the node run on one kernel and the kernel does not know about containers, Containers have their own kernel but share the network]
  answer: [2]
  explain: 'A) wrong. B) wrong: the runtime default profile is usually on. C) correct: the isolation is built from kernel features, and a flaw in the kernel breaks all of them. D) wrong: containers do not have their own kernel.'
- id: seccomp-args
  prompt: Which kind of rule is seccomp BEST at?
  choices: [Allowing only files under /srv, Matching a process by its path, Blocking specific system calls or flag values, Reading the content of a buffer passed to write]
  answer: [2]
  explain: 'A) wrong: it cannot see paths. B) wrong: that is an LSM job. C) correct: it sees the call number and raw argument values. D) wrong: it cannot dereference pointers safely.'
- id: localhost
  prompt: A Pod requests a Localhost seccomp profile that is missing on the node where it is scheduled. What is the usual result?
  choices: [The profile is created empty, The runtime default is used silently, The container fails to start on that node, The profile is downloaded from the API server]
  answer: [2]
  explain: 'A) wrong. B) wrong: it would hide the problem. C) correct: the profile is node-local, so scheduling and distribution must be handled. D) wrong: the API server does not hold it.'
- id: nnp
  prompt: What does allowPrivilegeEscalation false set, and why does it matter for seccomp? (select two)
  choices: [It enables SELinux, It lets an unprivileged process install a filter safely, The no_new_privs bit, It makes the root filesystem read-only]
  answer: [2, 1]
  explain: 'A) wrong. B) correct: with the bit set, exec cannot gain privileges, so installing a filter is safe without CAP_SYS_ADMIN. C) correct. D) wrong: that is readOnlyRootFilesystem.'
- id: profile-drift
  prompt: A strict AppArmor profile works for a month and then breaks a service. What is the most likely cause?
  choices: [The Pod ran as root, AppArmor expires profiles, The kernel forgot the profile, A rarely used code path such as certificate rotation was never exercised when the profile was built]
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong. D) correct: profiles built from observed behaviour miss rare paths.'
