id: LNX-314
title: Kubernetes & Cloud-Native Security
summary: 'Securing a Kubernetes cluster and the workloads on it: configuration benchmarks and metadata protection, RBAC and
  API access, AppArmor and seccomp, Pod Security Admission and policy engines, encryption of Secrets at rest, supply chain
  verification with signatures and SBOMs, runtime detection with Falco and audit logs, sandboxed runtimes, mTLS and segmentation,
  and production threat detection.'
hours: 45
coverage: full
outcomes:
- Audit a cluster against a benchmark and close the metadata endpoint to workloads
- Minimise RBAC and API access and prove the result with access reviews
- Confine workloads with AppArmor, seccomp, Pod Security Admission and admission policy
- Encrypt Secrets at rest and rotate the keys
- Verify images with signatures and SBOMs and enforce the result at admission
- Detect and investigate attacks with Falco rules and audit logs
- Isolate untrusted workloads with sandboxed runtimes and segment traffic with mTLS
