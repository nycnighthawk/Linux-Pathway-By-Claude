id: LNX-331
title: Kernel Internals & Device Drivers
summary: 'How the kernel is built from the inside: character, platform, PCI and network drivers, interrupt and locking rules,
  memory allocators, a small filesystem, eBPF and Rust modules, cross-building and bring-up on arm64, and the method for finding
  performance regressions. Labs use user-space simulations so every exercise runs in CI.'
hours: 60
coverage: full
outcomes:
- Write the file operations of a character driver and explain ioctl design
- Match drivers to devices through the device model and device tree
- Drive a PCI device through its registers, interrupts and DMA
- Choose the right execution context for deferred work and apply the locking rules
- Explain the page allocator, slab and DMA API and implement a buddy allocator
- Describe what a filesystem implements for the VFS
- Explain the NAPI contract and the eBPF verifier's job
- Compare Rust and C driver bug classes
- Cross-build and boot an arm64 kernel and plan a board bring-up
- Locate a performance regression from two profiles
