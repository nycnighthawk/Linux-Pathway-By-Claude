title: 'Quiz: Bring-up on a real board'
questions:
- id: first
  prompt: What should be established first when bringing up a new board?
  choices:
  - A package manager
  - A graphical desktop
  - A reliable serial console
  - Wi-Fi
  answer: [2]
  explain: 'A) wrong. B) wrong. C) correct: nothing else can be debugged without visibility. D) wrong.'
- id: level
  prompt: What must be checked before connecting a USB-serial adapter to a board?
  choices:
  - The kernel version
  - The baud rate of the monitor
  - The logic voltage level of the board and the adapter
  - The adapter colour
  answer: [2]
  explain: 'A) wrong. B) wrong. C) correct: a wrong level can damage hardware. D) wrong.'
- id: silent
  prompt: The kernel prints Starting kernel and then nothing. What is a likely fix?
  choices:
  - Enable swap
  - Reformat the SD card
  - Add earlycon and check the console argument and device tree
  - Install a desktop
  answer: [2]
  explain: 'A) wrong. B) wrong. C) correct. D) wrong.'
- id: tftp
  prompt: Why boot over TFTP and NFS during bring-up?
  choices:
  - It replaces the device tree
  - It is more secure
  - It is required by U-Boot
  - Each build and test iteration takes seconds, with no card flashing
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong. D) correct.'
- id: deferred
  prompt: A driver never probes. Which file names devices waiting for a missing resource?
  choices:
  - /proc/cpuinfo
  - /var/log/lastlog
  - /sys/kernel/debug/devices_deferred
  - /etc/fstab
  answer: [2]
  explain: 'A) wrong. B) wrong. C) correct. D) wrong.'
- id: dtbug
  prompt: Which is a typical device tree bring-up bug?
  choices:
  - Too many comments
  - A missing regulator node for a peripheral
  - Using tabs
  - A long file name
  answer: [1]
  explain: 'A) wrong. B) correct. C) wrong. D) wrong.'
