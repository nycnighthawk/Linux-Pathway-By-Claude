title: 'Quiz: Device model, sysfs, platform drivers, device tree'
questions:
- id: order
  prompt: A node has compatible = "acme,rtc-v1", "dallas,ds1307". Only the DS1307 driver is loaded. What happens?
  choices:
  - No driver binds
  - The DS1307 driver binds through the second, more general string
  - The kernel panics
  - The node is ignored because the first string is unknown
  answer: [1]
  explain: 'A) wrong. B) correct: strings are tried in order. C) wrong. D) wrong.'
- id: status
  prompt: What does status = "disabled" do?
  choices:
  - Hides the node in the source
  - Resets the device
  - Loads the driver without hardware
  - The kernel creates no device for the node
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong. D) correct.'
- id: defer
  prompt: When should probe return -EPROBE_DEFER?
  choices:
  - When the hardware is broken
  - When memory allocation fails
  - When a needed resource such as a clock is supplied by a driver that has not bound yet
  - Never
  answer: [2]
  explain: 'A) wrong. B) wrong, that is -ENOMEM. C) correct: the core retries later. D) wrong.'
- id: devm
  prompt: What is the benefit of devm_ allocation helpers?
  choices:
  - They are faster
  - Resources are released automatically when probe fails or the device is removed
  - They work only on x86
  - They avoid locking
  answer: [1]
  explain: 'A) wrong. B) correct. C) wrong. D) wrong.'
- id: sysfs
  prompt: What is the sysfs convention for attribute files?
  choices:
  - One readable value per file
  - Binary blobs of any size
  - XML documents
  - Only writable files
  answer: [0]
  explain: 'A) correct. B) wrong. C) wrong. D) wrong.'
- id: udev
  prompt: How does a newly detected device cause its driver module to load?
  choices:
  - The user must run insmod
  - The kernel guesses by name
  - Modules always load at boot
  - A uevent reaches udev, which loads the module whose device-table alias matches
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong. D) correct, via MODULE_DEVICE_TABLE aliases.'
