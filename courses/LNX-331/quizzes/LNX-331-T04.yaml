title: 'Quiz: Interrupts, softirqs, workqueues, timers'
questions:
- id: sleepirq
  prompt: Which call is illegal inside a hard interrupt handler?
  choices:
  - spin_lock_irqsave
  - readl
  - mutex_lock
  - kmalloc with GFP_ATOMIC
  answer: [2]
  explain: 'A) wrong, legal. B) wrong, legal. C) correct: it can sleep. D) wrong, legal.'
- id: none
  prompt: When must a shared-line handler return IRQ_NONE?
  choices:
  - When memory is low
  - When its device did not raise the interrupt
  - Always
  - When it uses a workqueue
  answer: [1]
  explain: 'A) wrong. B) correct: lets the kernel detect spurious or stuck lines. C) wrong. D) wrong.'
- id: irqsave
  prompt: Process context and a hard handler share a spinlock. How should process context take it?
  choices:
  - spin_lock_irqsave
  - spin_lock
  - mutex_lock
  - No lock needed
  answer: [0]
  explain: 'A) correct. B) wrong, an interrupt on the same CPU could deadlock. C) wrong. D) wrong.'
- id: timerctx
  prompt: In what context does a classic kernel timer callback run?
  choices:
  - Softirq context, so it cannot sleep
  - A user thread
  - Hard interrupt with all interrupts disabled forever
  - Process context
  answer: [0]
  explain: 'A) correct. B) wrong. C) wrong. D) wrong.'
- id: cancel
  prompt: Before freeing a structure that contains a work item, you should
  choices:
  - Call cancel_work_sync or flush_work so the work cannot run on freed memory
  - Do nothing
  - Lower the log level
  - Call msleep
  answer: [0]
  explain: 'A) correct. B) wrong. C) wrong. D) wrong.'
- id: oneshot
  prompt: What does IRQF_ONESHOT do for a threaded handler?
  choices:
  - It keeps the line masked until the thread function finishes
  - It makes the handler run on one CPU only
  - It disables the thread
  - It limits the driver to one interrupt ever
  answer: [0]
  explain: 'A) correct. B) wrong. C) wrong. D) wrong.'
