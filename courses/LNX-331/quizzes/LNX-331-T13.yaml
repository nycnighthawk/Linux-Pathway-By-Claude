title: 'Quiz: Kernel performance regressions'
questions:
- id: shares
  prompt: Why compare shares of samples between two profiles instead of raw counts?
  choices:
  - Raw counts cannot be printed
  - Shares are always larger
  - perf only reports shares
  - Total sample counts differ with run length, so shares are comparable
  answer: [3]
  explain: 'A) wrong. B) wrong. C) wrong. D) correct.'
- id: noise
  prompt: Two runs differ by 4% and the standard deviation over many runs is 3%. What is the sound conclusion?
  choices:
  - The benchmark must be discarded
  - The hardware is broken
  - No significant difference; do not bisect yet
  - A confirmed 4% regression
  answer: [2]
  explain: 'A) wrong. B) wrong. C) correct: the difference is within the spread. D) wrong.'
- id: falsereg
  prompt: Which is a very common source of false regressions?
  choices:
  - A different kernel configuration or mitigation default
  - The number of tabs open
  - The terminal font
  - The git version
  answer: [0]
  explain: 'A) correct. B) wrong. C) wrong. D) wrong.'
- id: offcpu
  prompt: The workload is slower but CPU use dropped. What do you examine next?
  choices:
  - Only the hottest function by cycles
  - Off-CPU time, such as waits on locks or I/O
  - Nothing, it is normal
  - The compiler version only
  answer: [1]
  explain: 'A) wrong. B) correct: threads are waiting. C) wrong. D) wrong.'
- id: bisect
  prompt: How is git bisect used for a performance regression?
  choices:
  - With a single run per step
  - With a benchmark script as oracle and a threshold based on measured noise
  - It cannot be used
  - By reading commit messages only
  answer: [1]
  explain: 'A) wrong: one run is unreliable. B) correct. C) wrong. D) wrong.'
