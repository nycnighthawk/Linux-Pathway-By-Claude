title: 'Quiz: IPv6 SLAAC, DHCPv6, radvd'
questions:
- id: who-gateway
  prompt: Which mechanism carries the default router in IPv6?
  choices:
  - ARP
  - DHCPv6
  - Router advertisements
  - DNS
  answer:
  - 2
  explain: 'IPv6 hosts learn their default router from router advertisements sent by the router itself. DHCPv6 has no option for a default gateway, so even a fully DHCP-managed network still needs RAs.'
- id: m-o
  prompt: What does the O flag in a router advertisement say?
  choices:
  - The router is the origin of the prefix
  - Addresses are available from DHCPv6
  - Hosts must use privacy addresses
  - Other settings are available from DHCPv6
  answer:
  - 3
  explain: The M flag is for addresses, the O flag for other configuration.
- id: accept-ra
  prompt: A Linux router loses its upstream default route when forwarding is enabled. Why?
  choices:
  - The prefix expired
  - accept_ra falls back to 0 unless set to 2
  - DHCPv6 took over
  - Forwarding deletes routes
  answer:
  - 1
  explain: Set accept_ra=2 on the upstream interface.
- id: eui64
  prompt: What does the modified EUI-64 rule do to the first byte of the MAC?
  choices:
  - Swaps it with the last byte
  - Flips the universal/local bit
  - Zeroes it
  - Adds fe
  answer:
  - 1
  explain: ff:fe is inserted in the middle and bit 1 of the first byte is inverted.
- id: radvd-fwd
  prompt: What does radvd expect of the router host?
  choices:
  - A DHCPv6 server
  - IPv4 NAT
  - IPv6 forwarding enabled
  - Jumbo frames
  answer:
  - 2
  explain: radvd logs a warning and carries on when forwarding is off, but hosts would then adopt a gateway that does not forward.
- id: icmp6
  prompt: Why must firewalls allow ICMPv6?
  choices:
  - Neighbour discovery, router discovery and path MTU discovery depend on it
  - It replaces TCP
  - It carries web traffic
  - It is only for ping
  answer:
  - 0
  explain: 'IPv6 uses ICMPv6 for neighbour discovery (its replacement for ARP), router discovery and path MTU discovery. A firewall that drops it all breaks address resolution and large transfers.'
- id: dhcp6-ports
  prompt: Which ports does DHCPv6 use?
  choices:
  - UDP 546 client, 547 server
  - TCP 53
  - UDP 123
  - UDP 67 and 68
  answer:
  - 0
  explain: 'DHCPv6 clients listen on UDP 546 and servers and relays on UDP 547. DHCPv4 uses different ports, 68 for clients and 67 for servers, so firewall rules must name both pairs on dual-stack networks.'
