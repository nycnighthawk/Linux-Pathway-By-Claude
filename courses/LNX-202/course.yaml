id: LNX-202
title: Advanced Linux Networking
summary: 'Layer 2 and layer 3 building blocks on Linux hosts and routers: bridges, VLANs and bonds, namespaces, VRF and policy
  routing, IPv6 autoconfiguration, authoritative and recursive DNS with DNSSEC, Kea DHCP, HAProxy with keepalived, WireGuard
  and IPsec, packet analysis, FRR with OSPF and BGP, throughput measurement, and vendor-switch LACP with SR-IOV.'
hours: 60
coverage: full
outcomes:
- Build bonds, VLAN interfaces and VLAN-aware bridges and verify LACP negotiation
- Isolate stacks with namespaces and veth pairs, and choose between VRF, namespaces and policy routing
- Configure IPv6 router advertisements, SLAAC and DHCPv6 and predict the resulting addresses
- Run authoritative BIND and recursive Unbound, restrict them safely and diagnose DNSSEC failures
- Write Kea DHCPv4 configurations with pools, options, reservations and relays
- Balance traffic with HAProxy and fail over a virtual IP with keepalived
- Build WireGuard and IPsec tunnels and diagnose MTU and handshake problems
- Analyse captures with tcpdump and tshark and choose the right place to capture
- Configure OSPF and eBGP with FRR and read their state
- Measure link throughput with a repeatable method and find the bottleneck
- State what vendor switches and SR-IOV NICs require from a Linux host
certifications:
- cert: LPIC2
  objectives:
  - '205.2'
  - '205.3'
  - '207.1'
  - '207.2'
  - '207.3'
  - '210.1'
