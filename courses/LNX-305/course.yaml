id: LNX-305
title: Configuration Management with Ansible
summary: 'Describing fleets and their desired state in Ansible: inventories and variable precedence, playbooks with handlers,
  loops and Jinja2, roles, collections and execution environments, Vault, RHEL System Roles, linting and Molecule testing,
  idempotence and check mode, the automation controller, and Windows hosts.'
hours: 60
coverage: full
outcomes:
- Build an inventory with groups and predict, then verify, which variable value each host receives
- Write playbooks that loop, branch, template configuration files and reload services only when something changed
- Package content as roles and collections with a documented variable interface, and explain what an execution environment adds
- Protect secrets with Ansible Vault under labelled vault IDs and keep them out of logs and files
- Use RHEL System Roles through their shared conventions and judge their risks
- Lint and test automation with ansible-lint profiles and Molecule scenarios that prove idempotence
- Preview changes with check and diff mode and repair tasks that are not safe to repeat
- Describe how a controller schedules and isolates jobs, and how Windows hosts are reached from a Linux control node
