title: 'Quiz: Wi-Fi and 802.1X'
questions:
- id: roles
  prompt: In 802.1X, which role does the access point or switch play?
  choices:
  - Supplicant
  - Authentication server
  - Certificate authority
  - Authenticator
  answer:
  - 3
  explain: The client is the supplicant; RADIUS is the authentication server.
- id: ca-cert
  prompt: Why set 802-1x.ca-cert in an enterprise profile?
  choices:
  - So the client can sign certificates
  - So the password is stored
  - To enable WPA3
  - So the client validates the server and rejects rogue access points
  answer:
  - 3
  explain: Without server validation a lookalike network can harvest credentials.
- id: rfkill
  prompt: Which command shows whether a radio is soft or hard blocked?
  choices:
  - wpa_cli status
  - rfkill list
  - iw reg get
  - nmcli connection show
  answer:
  - 1
  explain: rfkill reports software and hardware blocks.
- id: regdomain
  prompt: What does a wrong regulatory domain commonly cause?
  choices:
  - Slow DNS
  - Some channels are missing from scans
  - Passwords fail
  - No DHCP
  answer:
  - 1
  explain: The domain limits channels and transmit power.
- id: personal-vs-ent
  prompt: What is the main difference between personal and enterprise mode?
  choices:
  - Personal needs RADIUS
  - Personal shares one passphrase; enterprise authenticates each user or device individually
  - Personal is encrypted, enterprise is not
  - Enterprise uses WEP
  answer:
  - 1
  explain: Enterprise uses 802.1X with EAP and a RADIUS server.
- id: one-command
  prompt: Which settings must be given in one nmcli command for a PEAP profile?
  choices:
  - Only the password
  - Only the CA path
  - The SSID and band
  - key-mgmt, eap, phase2-auth and identity
  answer:
  - 3
  explain: nmcli requires wireless-security.key-mgmt, 802-1x.eap, 802-1x.phase2-auth and 802-1x.identity together.
- id: baseline
  prompt: What do hardening baselines ask for on servers with radios?
  choices:
  - WEP enabled
  - Monitor mode
  - Wireless adapters disabled
  - Open networks only
  answer:
  - 2
  explain: Disable radios you do not need, for example with nmcli radio all off.
