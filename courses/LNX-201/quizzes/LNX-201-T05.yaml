title: 'Quiz: Routing and multi-NIC hosts'
questions:
- id: longest-prefix
  prompt: 'Which route wins for 10.1.2.5: 10.1.0.0/16 via A or 10.1.2.0/24 via B?'
  choices:
  - Whichever has the lower metric
  - They are used in turn
  - The /24 via B (longest prefix)
  - The /16 via A (listed first)
  answer:
  - 2
  explain: The most specific matching prefix wins before metrics are compared.
- id: router-needs
  prompt: What must hold for a Linux host to forward traffic between two networks?
  choices:
  - Masquerade always
  - Forwarding enabled and a return path routed
  - Only two interfaces
  - A default route on each interface
  answer:
  - 1
  explain: ip_forward must be 1 and replies need a route back, by routes or NAT.
- id: forward-sysctl
  prompt: Which sysctl enables IPv4 forwarding?
  choices:
  - net.ipv4.conf.all.rp_filter=1
  - net.ipv4.tcp_forward=1
  - net.core.forward=1
  - net.ipv4.ip_forward=1
  answer:
  - 3
  explain: Persist it in /etc/sysctl.d/.
- id: route-get
  prompt: Which command predicts the route for one destination?
  choices:
  - ss -r
  - ip route get 198.51.100.7
  - ip route show type local
  - ip neigh get 198.51.100.7
  answer:
  - 1
  explain: ip route get shows the decision, including interface and source.
- id: policy
  prompt: What does ip rule add from 192.0.2.50/32 table 100 do?
  choices:
  - Adds a NAT rule
  - Sets a default gateway
  - Sends traffic from that source through routing table 100
  - Blocks that source
  answer:
  - 2
  explain: Policy rules select a routing table by selector such as source address.
- id: asym
  prompt: Why can replies on a two-NIC host with one default gateway fail?
  choices:
  - The kernel disables ARP
  - They may leave through the other interface and be dropped (asymmetric routing, rp_filter)
  - The second NIC has no MAC
  - TCP forbids two NICs
  answer:
  - 1
  explain: Reverse-path filtering and stateful devices on the path dislike asymmetric flows.
- id: persist-route
  prompt: Where do you persist a static route on a NetworkManager host?
  choices:
  - With ip route add only
  - In /etc/hosts
  - In nsswitch.conf
  - In the connection profile, for example with +ipv4.routes
  answer:
  - 3
  explain: ip route add is runtime only; the profile is the persistent source.
