id: LNX-201
title: Linux Networking I
summary: 'Networking on one Linux host: addressing and subnetting, the ip, ss and ethtool tools, persistent configuration
  with NetworkManager, netplan and networkd, name resolution, routing, firewalls with nftables and firewalld, OpenSSH, packet-level
  troubleshooting and an introduction to Wi-Fi and 802.1X.'
hours: 50
coverage: full
outcomes:
- Plan IPv4 and IPv6 subnets and read prefixes, masks and ranges
- Inspect links, addresses, routes, neighbours and sockets with ip and ss
- Configure interfaces persistently with NetworkManager, netplan or systemd-networkd
- Control name resolution with the name service switch, hosts and systemd-resolved
- Build static routes and a forwarding router, and recognise asymmetric routing
- Write a default-drop policy with nftables and manage firewalld zones safely
- Use OpenSSH keys, ProxyJump and port forwarding with strict host-key checking
- Follow a layered method with mtr, dig and tcpdump to find where traffic fails
- Describe 802.1X authentication and configure a client profile for it
