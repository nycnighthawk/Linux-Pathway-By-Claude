title: 'Quiz: Signing and key rotation'
questions:
- id: debmodel
  prompt: What does the Debian family sign to authenticate a whole repository?
  choices:
  - Every .deb file, one signature per package
  - The Release file (InRelease or Release.gpg), which lists the index checksums
  - The kernel image shipped in the installer
  - The sources.list file of each client machine, which names the repository suite
  answer:
  - 1
  explain: 'A) wrong: the index is what is signed. B) correct: one signature covers the indexes. C) wrong: unrelated. D) wrong: a local file.'
- id: repogpg
  prompt: What does repo_gpgcheck=1 check?
  choices:
  - The TLS certificate of the repository server
  - The payload of each package against the vendor key
  - The signature on the repository metadata
  - The free disk space before the download starts
  answer:
  - 2
  explain: 'A) wrong: a separate setting. B) wrong: that is gpgcheck. C) correct: it covers the repodata. D) wrong: unrelated.'
- id: nokey
  prompt: rpm -K prints NOKEY for a package. What is the cause?
  choices:
  - The package carries no signature at all
  - The signing key has expired since the package was built
  - The file is corrupt and fails its checksum test
  - The public key that made the signature is not imported
  answer:
  - 3
  explain: 'A) wrong: that would say it is unsigned. B) wrong: that gives a different message. C) wrong: that gives a digest failure. D) correct: import the right key.'
- id: offline
  prompt: Why keep the primary key offline and sign with a subkey?
  choices:
  - It makes the signed packages smaller on the mirror
  - GnuPG refuses to sign with a primary key
  - Routine signing never exposes the primary, and a subkey can be replaced
  - Subkeys sign faster than primary keys do
  answer:
  - 2
  explain: 'A) wrong: size does not change. B) wrong: it can sign. C) correct: the identity stays the same. D) wrong: speed is not the reason.'
- id: rotation
  prompt: Which rotation plan avoids an outage?
  choices:
  - Deliver the new key first, sign with both for a while, then retire the old one
  - Replace the key on the server and tell the clients later
  - Disable signature checking during the change window
  - Wait for the old key to expire and then publish a new key to all of the clients
  answer:
  - 0
  explain: 'A) correct: clients are ready before the switch. B) wrong: clients fail until they get it. C) wrong: removes the protection. D) wrong: causes the outage at expiry.'
- id: trustedyes
  prompt: An import problem blocks updates. What is the correct response?
  choices:
  - Set trusted=yes or gpgcheck=0 until the problem is solved for good by the vendor
  - Fix the key delivery through a channel you control, and keep verification on
  - Switch the repository to plain HTTP so the key is not needed
  - Delete the repository from the clients and add it again later
  answer:
  - 1
  explain: 'A) wrong: turns verification off. B) correct: the control stays in place. C) wrong: weakens security. D) wrong: does not fix the key.'
- id: expiredkey
  prompt: At 02:00 every client fails with "key expired" on the internal repository. The new key was never distributed. What should have happened?
  choices:
  - The new key delivered and trusted before the old one expired, with both used for a while
  - The old key set to never expire, so that no rotation is needed for the repository
  - Signature checking turned off just before the expiry date
  - The clients rebuilt from scratch on the day of the expiry
  answer:
  - 0
  explain: 'A) correct: rotation with an overlap. B) wrong: removes the benefit of rotation. C) wrong: removes the protection. D) wrong: heavy and unnecessary.'
- id: unsignedmeta
  prompt: A mirror is signed per package (gpgcheck=1) but repo_gpgcheck=0. What attack does this still allow?
  choices:
  - Installing a package whose payload carries a forged signature from an unknown signer
  - Reading the private key from the client machine
  - Changing the TLS certificate of the server
  - Serving an old or tampered repomd that hides or replays package versions
  answer:
  - 3
  explain: 'A) wrong: gpgcheck covers the payload. B) wrong: not exposed by this setting. C) wrong: a different layer. D) correct: metadata is not verified.'
