title: 'Quiz: RPM: spec, rpmbuild, mock'
questions:
- id: noreplace
  prompt: What does %config(noreplace) do when the package ships a changed default for a file the administrator edited?
  choices:
  - Overwrites the admin's file without warning
  - Deletes the file
  - Keeps the admin's file and writes the new default as a .rpmnew file
  - Refuses the upgrade
  answer:
  - 2
  explain: 'A) wrong: that is the risk it avoids. B) wrong:
    nothing is deleted. C) correct: local edits survive and the new default is available beside it. D) wrong: the upgrade proceeds.'
- id: phases
  prompt: Which rpmbuild option builds the binary and source packages together?
  choices:
  - -bc
  - -bp
  - -bb
  - -ba
  answer:
  - 3
  explain: 'A) wrong: -bc stops
    after %build. B) wrong: -bp stops after %prep. C) wrong: -bb builds the binary packages only. D) correct: -ba builds both.'
- id: mock
  prompt: Why build in mock instead of on a developer workstation?
  choices:
  - Mock is required by RPM
  - Mock builds are faster
  - The chroot contains only the declared build dependencies, so hidden dependencies show up as failures
  - Mock signs packages automatically
  answer:
  - 2
  explain: 'A) wrong: rpmbuild works without it. B) wrong: speed is not the aim. C) correct: a clean room exposes missing BuildRequires. D) wrong: signing is a separate step.'
- id: scriptlet-arg
  prompt: In a %postun scriptlet the first argument is 0. What happened?
  choices:
  - First installation
  - Upgrade
  - The last instance of the package was removed
  - The package failed to install
  answer:
  - 2
  explain: 'A) wrong: install gives 1 in %post and %pre. B) wrong: upgrade gives 1 or more remaining instances, usually 1 in postun.
    C) correct: 0 means no instances remain. D) wrong: failures are not reported that way.'
- id: release
  prompt: A package is rebuilt with a fix but Version and Release are unchanged. What happens on clients?
  choices:
  - They do not see an update, because the package manager compares version-release
  - They downgrade
  - They upgrade automatically
  - The repository rejects it
  answer:
  - 0
  explain: 'A) correct: the release must be bumped. B) wrong: a downgrade would need a lower number. C) wrong: nothing differs for the solver. D) wrong: createrepo does not enforce this.'
- id: network
  prompt: A spec downloads dependencies during %build. Why is this a problem in a build system?
  choices:
  - It makes the package larger
  - Build farms usually block outbound traffic, and unpinned downloads are neither verifiable nor reproducible
  - RPM forbids it by syntax
  - It breaks %files
  answer:
  - 1
  explain: 'A) wrong: size is not the issue. B) correct: inputs must be pinned and checksummed before the build. C) wrong: syntax allows it. D) wrong:
    %files is unrelated.'
- id: rpm-v
  prompt: What does rpm -V package report?
  choices:
  - The package's changelog
  - The packages that depend on it
  - Files whose digest, mode, owner or size differ from the package database
  - Its build log
  answer:
  - 2
  explain: 'A) wrong: that is rpm -q --changelog. B) wrong: that
    is rpm -q --whatrequires. C) correct: it verifies installed files against the recorded values. D) wrong: build logs are not in the database.'
