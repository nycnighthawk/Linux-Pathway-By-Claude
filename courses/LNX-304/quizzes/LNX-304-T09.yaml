title: 'Quiz: Image Builder'
questions:
- id: composer
  prompt: What does osbuild-composer do with a blueprint?
  choices:
  - Signs the repository
  - Resolves packages and generates an osbuild manifest for the chosen output type
  - Installs the image on hosts
  - Boots a VM and records it
  answer:
  - 1
  explain: 'A) wrong: unrelated. B) correct: the manifest pins the inputs. C) wrong: installation is a separate step. D) wrong: that is the capture style of older tools.'
- id: firstboot
  prompt: Which setting belongs to first-boot provisioning rather than the image?
  choices:
  - The machine hostname and SSH host keys
  - An enabled sshd service
  - The audit kernel argument
  - The chrony package
  answer:
  - 0
  explain: 'A) correct: unique per machine, so generated or injected at first boot. B) wrong: common. C) wrong: common. D) wrong: common to every host.'
- id: repeat
  prompt: How do you make an image build repeatable?
  choices:
  - Disable dependency solving
  - Point the build sources at a dated snapshot of your repository and verify signatures
  - Use the newest public mirror each time
  - Build on the same laptop
  answer:
  - 1
  explain: 'A) wrong: it would break the build. B) correct: the same inputs give the same packages. C) wrong: contents change daily. D) wrong: a laptop cache is not a record.'
- id: secrets
  prompt: Why must a blueprint not carry passwords or tokens?
  choices:
  - It makes builds slower
  - The builder rejects all keys
  - TOML cannot hold strings
  - Blueprints are stored and readable, and the secret ends up inside every image
  answer:
  - 3
  explain: 'A) wrong: no effect on speed. B) wrong: public SSH keys are fine. C) wrong: it can. D) correct: both the store and the image leak it.'
- id: rebuild
  prompt: Why rebuild images on a schedule even if the blueprint did not change?
  choices:
  - To collect package updates from the pinned or current snapshot so instances do not patch for long at first boot
  - Because TOML expires
  - To change the file format
  - It is required by systemd
  answer:
  - 0
  explain: 'A) correct: stale images mean a long first-boot update. B) wrong: no expiry. C) wrong: unrelated. D) wrong: unrelated.'
- id: bootcib
  prompt: What does bootc-image-builder take as input?
  choices:
  - A tarball of /home
  - A kickstart file
  - A Debian source package
  - A bootc container image and a small configuration file
  answer:
  - 3
  explain: 'A) wrong: unrelated. B) wrong: that is installer input. C) wrong: wrong family. D) correct: it converts the container image into disk images.'
