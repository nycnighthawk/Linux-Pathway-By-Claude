title: 'Quiz: bootc / image mode, rpm-ostree'
questions:
- id: usr
  prompt: On a bootc system, where do operating system programs and default configuration come from?
  choices:
  - The read-only /usr from the image
  - The home directory
  - Local dnf installs
  - /var
  answer:
  - 0
  explain: 'A) correct: /usr is part of the image. B) wrong: unrelated. C) wrong: installs happen in the build. D) wrong: /var is persistent state.'
- id: etc
  prompt: A host edited a file in /etc and a new image changes the default of that file. What does an update do?
  choices:
  - Refuses to update
  - Deletes /etc
  - Keeps the local edit (three-way merge) and applies new defaults to files not changed locally
  - Discards the local edit
  answer:
  - 2
  explain: 'A) wrong: the update proceeds. B) wrong: nothing is deleted. C) correct: that is the /etc merge rule. D) wrong: local state is preserved.'
- id: rollback
  prompt: How does bootc rollback work?
  choices:
  - It downgrades each package
  - It selects the previous deployment for the next boot
  - It rebuilds the image
  - It restores a backup tape
  answer:
  - 1
  explain: 'A) wrong: there is no per-package history. B) correct: the old deployment is still on disk. C) wrong: the registry holds images. D) wrong: unrelated.'
- id: overlay
  prompt: You fix a bug on one host with rpm-ostree usroverlay. What is the status of the fix?
  choices:
  - Signed automatically
  - Temporary on that host until reboot; the fix must go into the Containerfile
  - Permanent on all hosts
  - Saved in /etc
  answer:
  - 1
  explain: 'A) wrong: signing is separate. B) correct: the overlay disappears at reboot. C) wrong: it affects one host. D) wrong: it changes /usr.'
- id: blast
  prompt: Why are rings and automatic rollback essential in image-based delivery?
  choices:
  - Registries are slow
  - Kernels are bigger
  - Images are larger
  - A bad image on a shared tag reaches every host that follows it
  answer:
  - 3
  explain: 'A) wrong: unrelated. B) wrong: unrelated. C) wrong: size is not the issue. D) correct: the unit of delivery is the whole system.'
- id: secrets
  prompt: Why must secrets not be baked into a bootc image?
  choices:
  - Anyone able to pull the image can read them
  - dnf forbids it
  - Images cannot hold files
  - They slow boot
  answer:
  - 0
  explain: 'A) correct: registry access equals read access. B) wrong: not enforced. C) wrong: they can. D) wrong: not the issue.'
