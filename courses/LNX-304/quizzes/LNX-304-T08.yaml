title: 'Quiz: bootc / image mode, rpm-ostree'
questions:
- id: usr
  prompt: On a bootc system, where do operating system programs and default configuration come from?
  choices:
  - The home directory of the administrator
  - Local dnf installs made on each host
  - The read-only /usr from the image
  - The /var directory of the host
  answer:
  - 2
  explain: 'A) wrong: user data. B) wrong: not the model. C) correct: the image is the source. D) wrong: mutable state.'
- id: etc
  prompt: A host edited a file in /etc and a new image changes the default of that file. What does an update do?
  choices:
  - It refuses to update until the edit is reverted
  - It keeps the local edit and applies new defaults to files not changed locally
  - It deletes /etc and starts with the image defaults
  - It discards the local edit and uses the image file
  answer:
  - 1
  explain: 'A) wrong: it proceeds. B) correct: a three-way merge. C) wrong: local state is kept. D) wrong: the edit survives.'
- id: rollback
  prompt: How does bootc rollback work?
  choices:
  - It downgrades each package one by one
  - It rebuilds the whole image from the older Containerfile and pushes it again
  - It restores a backup taken before the update
  - It selects the previous deployment for the next boot
  answer:
  - 3
  explain: 'A) wrong: it does not use packages. B) wrong: not needed. C) wrong: no backup needed. D) correct: the old deployment is still there.'
- id: overlay
  prompt: You fix a bug on one host with rpm-ostree usroverlay. What is the status of the fix?
  choices:
  - Signed automatically and kept in the next image that the registry publishes
  - Permanent on every host that pulls the image
  - Saved in /etc, so it survives the next update
  - Temporary on that host until reboot; the fix belongs in the Containerfile
  answer:
  - 3
  explain: 'A) wrong: nothing is signed. B) wrong: only that host, only until reboot. C) wrong: /usr overlay is not /etc. D) correct: changes vanish at reboot.'
- id: blast
  prompt: Why are rings and automatic rollback essential in image-based delivery?
  choices:
  - Registries are slow, so changes to images must always be staged over several days
  - A bad image on a shared tag reaches every host that follows it
  - Kernels in images are larger than in packages
  - Images take longer to build than packages do
  answer:
  - 1
  explain: 'A) wrong: speed is not the reason. B) correct: one mistake spreads fast. C) wrong: not the reason. D) wrong: not the reason.'
- id: secrets
  prompt: Why must secrets not be baked into a bootc image?
  choices:
  - dnf forbids it in the image build
  - Images cannot hold files of that kind
  - Anyone able to pull the image can read them
  - They slow down the boot of the host
  answer:
  - 2
  explain: 'A) wrong: no such rule. B) wrong: they can. C) correct: images are readable. D) wrong: not the reason.'
- id: rollbackcase
  prompt: After an image update a host boots but the application fails. What is the quickest recovery that keeps the data?
  choices:
  - Edit files in /usr to undo the change
  - Run bootc rollback and reboot into the previous deployment
  - Reinstall the host from the original installer and restore the data from backup
  - Downgrade the packages one by one with dnf
  answer:
  - 1
  explain: 'A) wrong: /usr is read-only. B) correct: the old deployment is intact. C) wrong: slow and loses state. D) wrong: no package manager model.'
- id: tagfollow
  prompt: A team publishes every build to the tag latest and all 400 hosts follow it. A broken build ships on Friday. What design change limits this?
  choices:
  - Build less often so that there are fewer mistakes that can reach the fleet
  - Move all hosts to different tags at random
  - Add more registry servers for the tag
  - Promote tags through rings, so a few hosts follow the new build first
  answer:
  - 3
  explain: 'A) wrong: does not stop a bad build. B) wrong: no control. C) wrong: does not help. D) correct: limits the blast radius.'
