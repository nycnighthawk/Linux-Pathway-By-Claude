title: 'Quiz: Patch rings'
questions:
- id: representative
  prompt: What makes a canary ring useful?
  choices:
  - It is chosen by hostname so that the group is easy to remember and to list
  - It consists of volunteers who ask to go first
  - It is as small as possible so little can break
  - It contains a representative host of every service tier in later rings
  answer:
  - 3
  explain: 'A) wrong: names do not make it representative. B) wrong: volunteers are not representative. C) wrong: too small to find problems. D) correct: failures show up early.'
- id: replicas
  prompt: In which order are a database primary and its replica patched?
  choices:
  - Primary first, then the replica
  - Replica first, then the primary
  - Both at the same moment
  - Neither; databases are never patched
  answer:
  - 1
  explain: 'A) wrong: risks the live data first. B) correct: a failure shows up on the replica. C) wrong: no fallback if it fails. D) wrong: they must be patched.'
- id: effective
  prompt: dnf reports the kernel package updated. What else shows whether the host is actually protected?
  choices:
  - That the running kernel (uname -r) matches the new one, so the reboot happened
  - The hostname of the machine that was updated
  - The disk size of the root file system
  - Nothing; an installed package is all that counts, since the update has finished
  answer:
  - 0
  explain: 'A) correct: installed is not running. B) wrong: unrelated. C) wrong: unrelated. D) wrong: the old kernel may still run.'
- id: gate
  prompt: Which gate is sound?
  choices:
  - Gate only on the exit code of the update job
  - A human looks at a dashboard when they have time, and decides on a feeling
  - A pre-agreed error-rate threshold that stops the rollout automatically
  - No gate; wait for the complaints to arrive
  answer:
  - 2
  explain: 'A) wrong: a successful job can still break services. B) wrong: not reliable. C) correct: objective and fast. D) wrong: too late.'
- id: soak
  prompt: Why does a memory-leak regression need a longer soak than a boot failure?
  choices:
  - Leaks affect only the canary hosts
  - Boot failures are harmless to the service
  - Soak time does not matter for either problem, since both appear within minutes
  - Leaks only show up after hours or days of running
  answer:
  - 3
  explain: 'A) wrong: not true. B) wrong: they are not. C) wrong: it matters for leaks. D) correct: a boot failure shows at once.'
- id: exceptions
  prompt: What should every patching exception have?
  choices:
  - No record, to keep the register short
  - An owner, a reason, compensating controls and an expiry date
  - A permanent waiver signed once
  - A place in ring 0, so that the exception gets patched before everything else
  answer:
  - 1
  explain: 'A) wrong: untracked exceptions pile up. B) correct: makes it temporary and reviewed. C) wrong: never revisited. D) wrong: not the point.'
- id: canarybad
  prompt: Ring 1 patches finish without errors, but latency on the web tier doubles ten minutes later. What should the rollout do?
  choices:
  - Halt before ring 2, because the agreed threshold for latency is broken
  - Continue, since the update jobs exited with success
  - Patch ring 2 faster to compare more hosts
  - Wait for users to complain before deciding
  answer:
  - 0
  explain: 'A) correct: the gate protects later rings. B) wrong: a good exit code is not enough. C) wrong: widens the damage. D) wrong: too late.'
- id: replicafirst
  prompt: The primary of a database cluster has to be patched in the same window as two replicas. What is the safest order?
  choices:
  - A replica first, check replication, then fail over and patch the old primary
  - The primary first, while the replicas keep running
  - All three at once to finish early
  - The primary only, and leave the replicas
  answer:
  - 0
  explain: 'A) correct: keeps a good copy and a fallback. B) wrong: risks live data. C) wrong: no fallback. D) wrong: leaves the replicas exposed.'
