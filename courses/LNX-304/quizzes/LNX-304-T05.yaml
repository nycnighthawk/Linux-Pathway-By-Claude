title: 'Quiz: Dated snapshots'
questions:
- id: layers
  prompt: In a snapshot-based design, which layer changes during a rollout?
  choices:
  - The package files
  - The snapshots
  - The pointers from environments to snapshots
  - The upstream mirror's keys
  answer:
  - 2
  explain: 'A) wrong: files stay as they were. B) wrong: snapshots are immutable. C) correct: promotion and rollback are pointer moves. D) wrong: keys are not part of promotion.'
- id: hardlink
  prompt: Why are hard-link snapshots cheap?
  choices:
  - They skip metadata
  - They delete old packages
  - They compress files
  - Unchanged files are shared between snapshots, so only new files use space
  answer:
  - 3
  explain: 'A) wrong: metadata is included. B) wrong: nothing is deleted. C) wrong: no compression is involved. D) correct: a link adds a directory entry, not data.'
- id: rollback
  prompt: What does pointing prod at the previous snapshot NOT do?
  choices:
  - Stop new versions being offered
  - Change what clients can install
  - Restore the earlier repository state
  - Downgrade packages already installed on machines
  answer:
  - 3
  explain: 'A) wrong: it does stop that. B) wrong: it does change that. C) wrong: it does restore the offered set. D) correct: installed packages stay until downgraded explicitly.'
- id: validuntil
  prompt: Why can apt update reject an old Debian snapshot?
  choices:
  - The disk is full
  - The Release file has a Valid-Until date that has passed
  - Snapshots are never signed
  - The client is too new
  answer:
  - 1
  explain: 'A) wrong: unrelated. B) correct: upstream marks how long the signed index may be trusted, so internal snapshots are re-signed or the check is relaxed knowingly. C) wrong: they carry upstream signatures. D) wrong: unrelated.'
- id: retention
  prompt: Which rule makes snapshot deletion safe?
  choices:
  - Delete anything older than 30 days
  - Refuse to delete a snapshot that any pointer, image build or record still refers to
  - Delete the largest first
  - Never delete anything
  answer:
  - 1
  explain: 'A) wrong: an old pointer target may be live. B) correct: check references first. C) wrong: size is not the criterion. D) wrong: the disk would fill.'
- id: name
  prompt: Which names belong to snapshots rather than to pointers?
  choices:
  - prod, test
  - latest, stable
  - 2026-11-08, 2026-11-08-hotfix1
  - current
  answer:
  - 2
  explain: 'A) wrong: environments are pointers. B) wrong: those are mutable pointer names. C) correct: dates are fixed and self-describing. D) wrong: it is mutable.'
