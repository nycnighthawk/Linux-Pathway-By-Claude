id: LNX-405
title: 'Capstone: Build and Run a Hypervisor Stack'
summary: A graded, multi-stage project for the virtualization pathway. You build a small VMM that boots Linux with virtio
  devices and test it in CI, deliver one image to libvirt, VirtualBox and KubeVirt, tune a pinned hugepage-backed VM to a
  latency target, pass a real device through with VFIO, send a test for QEMU or KVM for review and write a defensive analysis
  of a fixed VM-escape vulnerability. Three stages are graded in CI; three are guided evidence stages.
hours: 120
coverage: full
outcomes:
- Plan a guest memory map, device windows and kernel command line for a small VMM, and validate untrusted configuration
- Build one image once and deliver it to three platforms with identical smoke tests
- Tune and measure a VM against a latency target written in advance
- Assign a PCI device to a guest with VFIO while understanding IOMMU groups and their risks
- Send a test or feature to QEMU or KVM and take it through review
- Write a defensive analysis of a fixed escape vulnerability with layered mitigations
