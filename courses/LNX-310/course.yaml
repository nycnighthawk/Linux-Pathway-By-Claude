id: LNX-310
title: Containers in Depth
summary: 'How a Linux container really works and how to run it well: namespaces, cgroups v2 and capabilities by hand, the
  OCI specs and runtimes, rootless Podman with Quadlet, Docker Engine with BuildKit and Compose, lean non-root images, registries
  and mirrors, overlayfs, volumes and SELinux labels, SBOMs, cosign and Trivy, debugging with nsenter, sandboxed runtimes,
  and Windows containers.'
hours: 50
coverage: full
outcomes:
- Assemble a container from namespaces, a cgroup v2 group and a capability set, and explain each layer
- Read an OCI image and a runtime bundle and name what each runtime in the stack does
- Run rootless Podman, pods and Quadlet-managed services under systemd
- Build and cache images with BuildKit and describe applications with Compose
- Write small, non-root, reproducible Containerfiles
- Configure registries, mirrors and faithful image copies with Skopeo
- Explain overlayfs, volumes and SELinux labelling and fix mount permission failures
- Produce SBOMs, sign and verify images with cosign, and triage Trivy findings
- Debug a failing container with inspect, events and nsenter
- Choose between shared-kernel, gVisor, Kata and Windows container isolation
