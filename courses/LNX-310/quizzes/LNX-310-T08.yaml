title: 'Quiz: Supply chain: SBOM, cosign signing, Trivy'
questions:
- id: sign-digest
  prompt: Why sign and deploy an image by digest rather than by tag?
  choices:
  - A tag can be moved to different content after verification
  - Registries delete tags after signing
  - Digests are shorter
  - Tags cannot be signed with cosign at all
  answer:
  - 0
  explain: 'A) Correct: a digest names exact content. B) Wrong: signing does not delete tags. C) Wrong: digests are longer. D) Wrong: cosign resolves a tag, which is exactly the hazard.'
- id: verify-flags
  prompt: Which flags make cosign verify meaningful for keyless signatures?
  choices:
  - --certificate-identity (or regexp) and --certificate-oidc-issuer
  - --allow-http-registry
  - --output json
  - --insecure-ignore-tlog
  answer:
  - 0
  explain: 'A) Correct: they assert who signed and through which identity provider. B) Wrong: this concerns
    transport, not identity. C) Wrong: output format has no security effect. D) Wrong: ignoring the log weakens verification.'
- id: vex
  prompt: What does a VEX statement record?
  choices:
  - The list of installed packages
  - That a known CVE does not affect this product, with a justification
  - The build parameters
  - That an image is signed
  answer:
  - 1
  explain: 'A) Wrong: that is an SBOM. B) Correct: it makes suppression of a finding reviewable. C) Wrong: that is provenance. D) Wrong: that is a signature.'
- id: false-positive
  prompt: A scanner flags openssl 3.0.11 on Debian although the fix was back-ported into 3.0.11-1~deb12u2. Best response?
  choices:
  - Rebuild on scratch
  - Disable the scanner database update
  - Check the distribution tracker and record a VEX not_affected or fixed statement
  - Ignore all findings for the image
  answer:
  - 2
  explain: 'A) Wrong: this is a different design and unrelated to the finding. B) Wrong: stale data is worse. C) Correct: back-ports keep the upstream version string,
    so evidence from the distribution settles it. D) Wrong: that hides real findings.'
- id: sbom-where
  prompt: Where does BuildKit store an SBOM attestation by default?
  choices:
  - In /etc/sbom in the container
  - In the Docker daemon log
  - Inside the top layer
  - As an attestation attached to the image index in the registry
  answer:
  - 3
  explain: 'A) Wrong: the filesystem is not touched. B) Wrong: logs are not durable
    storage. C) Wrong: that would change the image. D) Correct: the image content and digest of the runnable manifest stay unchanged.'
- id: scan-gate
  prompt: Which Trivy invocation fails a CI step only for serious, fixable findings?
  choices:
  - trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 IMAGE
  - trivy image --skip-db-update IMAGE
  - trivy config IMAGE
  - trivy image --format json IMAGE
  answer:
  - 0
  explain: 'A) Correct: severity filter, skip unfixable, and a non-zero exit code. B) Wrong: this affects database freshness. C) Wrong: config scans manifests and Dockerfiles. D) Wrong: formatting does
    not change the exit code.'
