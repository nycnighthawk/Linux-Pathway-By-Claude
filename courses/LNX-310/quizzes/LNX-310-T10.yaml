title: 'Quiz: Sandboxed runtimes: gVisor, Kata (needs KVM)'
questions:
- id: shared-kernel
  prompt: Why is a runc container not a hard boundary for mutually untrusted tenants?
  choices:
  - Containers have no namespaces
  - Images are not isolated
  - runc cannot enforce limits
  - All containers share one host kernel and its syscall surface
  answer:
  - 3
  explain: 'A) Wrong: namespaces exist. B) Wrong: image layers are separate from isolation. C) Wrong: cgroups enforce limits. D) Correct: a kernel bug can cross every container boundary.'
- id: sentry
  prompt: What does the gVisor Sentry do?
  choices:
  - Boots a guest Linux kernel under KVM
  - Implements Linux system calls in user space for the sandboxed application
  - Signs images
  - Mounts layers for containerd
  answer:
  - 1
  explain: 'A) Wrong: that describes Kata. B) Correct: it is the application kernel, run under a tight seccomp filter. C) Wrong: cosign signs. D) Wrong: snapshotters do that.'
- id: kata-agent
  prompt: In Kata Containers, which component creates the containers inside the guest VM?
  choices:
  - The Gofer
  - The kata-agent, reached over vsock
  - The host kubelet directly
  - runc on the host
  answer:
  - 1
  explain: 'A) Wrong: the Gofer is gVisor''s file helper. B) Correct: the agent sets up namespaces
    and cgroups inside the guest. C) Wrong: the kubelet speaks CRI to the host runtime. D) Wrong: the host runc is not used for the pod.'
- id: runtimeclass
  prompt: How does a pod choose a sandboxed runtime in Kubernetes?
  choices:
  - The pod's service account
  - A node taint alone
  - runtimeClassName naming a RuntimeClass whose handler exists on the node
  - An image annotation
  answer:
  - 2
  explain: 'A) Wrong: service accounts are identity. B) Wrong: taints only repel pods. C) Correct: the handler must also be configured in containerd or CRI-O. D) Wrong: annotations do not select runtimes.'
- id: overhead
  prompt: What does overhead.podFixed in a RuntimeClass do?
  choices:
  - Selects a hypervisor
  - Adds a sidecar
  - Tells the scheduler to add the sandbox's own CPU and memory to the pod's requests
  - Limits the pod's disk
  answer:
  - 2
  explain: 'A) Wrong: hypervisors are configured on the node. B) Wrong: no container is added. C) Correct: otherwise nodes are over-committed by the VM or Sentry cost. D) Wrong: it concerns CPU and memory
    only.'
- id: nested-kvm
  prompt: systemd-detect-virt reports kvm and /dev/kvm is missing. What is the likely problem for a Kata pod?
  choices:
  - The CRI is not running
  - cosign is missing
  - Nested virtualisation is not enabled
  - The image is too large
  answer:
  - 2
  explain: 'A) Wrong: a stopped CRI gives other symptoms. B) Wrong: signing is unrelated. C) Correct: Kata needs /dev/kvm, which requires nested virtualisation inside a VM. D) Wrong: image size does not
    affect KVM.'
