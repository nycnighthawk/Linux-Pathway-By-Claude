title: 'Quiz: Podman rootless, pods, Quadlet units'
questions:
- id: subuid
  prompt: Where are the subordinate ID ranges for a rootless user defined?
  choices:
  - ~/.config/containers/storage.conf
  - /proc/self/uid_map
  - /etc/subuid and /etc/subgid
  - /etc/passwd
  answer:
  - 2
  explain: 'A) Wrong: storage.conf sets storage paths and drivers. B) Wrong: uid_map shows the result inside a namespace, it is not the configuration. C) Correct: lines of user:start:count, applied by newuidmap
    and newgidmap. D) Wrong: passwd holds the account''s own UID only.'
- id: keep-id
  prompt: Which option makes a rootless container's user keep your own numeric UID so bind-mounted files stay editable?
  choices:
  - --network=host
  - --userns=keep-id
  - --privileged
  - --cap-add=CHOWN
  answer:
  - 1
  explain: 'A) Wrong: host networking is unrelated to file ownership. B) Correct: it maps your UID to the same number inside. C) Wrong: privileged removes confinement and does not fix ownership in a user
    namespace. D) Wrong: chown capability does not change the mapping.'
- id: pod-ports
  prompt: Where do you publish a port for containers in a Podman pod?
  choices:
  - With the infra image only at build time
  - On the pod, at podman pod create -p
  - On each container with -p
  - In /etc/hosts
  answer:
  - 1
  explain: 'A) Wrong: the infra container is created with the pod, not at image build. B) Correct: members share the pod''s network namespace, so the port belongs to the pod. C) Wrong: containers in a pod
    do not own a separate network namespace. D) Wrong: /etc/hosts does not publish ports.'
- id: quadlet-path
  prompt: Where would a rootless user place web.container so that Quadlet generates web.service?
  choices:
  - ~/.config/containers/systemd/
  - /etc/systemd/system/
  - ~/.config/systemd/user/ only after systemctl enable
  - /usr/lib/containers/
  answer:
  - 0
  explain: 'A) Correct: the generator scans that directory for the user instance. B) Wrong: that is for system unit files, and Quadlet files there would not be rootless. C) Wrong: generated units are transient,
    so enable does not apply. D) Wrong: that is not a Quadlet search path.'
- id: linger
  prompt: A rootless Quadlet service disappears after you log out. What is the first thing to check?
  choices:
  - loginctl show-user for Linger=yes
  - The image digest
  - The SELinux boolean for NFS
  - The pasta version
  answer:
  - 0
  explain: 'A) Correct: without lingering the user''s systemd instance stops at the end of the last session. B) Wrong: the image is unrelated to the lifetime of the manager. C) Wrong: NFS booleans do not
    control session lifetime. D) Wrong: networking does not stop the service at logout.'
- id: notify-healthy
  prompt: What does Notify=healthy do in a Quadlet .container file?
  choices:
  - The unit is reported started only after the container health check passes
  - The container is restarted every time it is unhealthy
  - systemd sends mail on failure
  - The image is verified with cosign
  answer:
  - 0
  explain: 'A) Correct: dependants therefore start when the service is actually ready. B) Wrong: restarts are governed by Restart=, not Notify. C) Wrong: Notify is the readiness protocol, not an alert.
    D) Wrong: signature checks are policy.json settings.'
