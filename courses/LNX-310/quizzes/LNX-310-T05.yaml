title: 'Quiz: Containerfile craft: multi-stage, non-root, distroless'
questions:
- id: exec-form
  prompt: Why write ENTRYPOINT as a JSON array?
  choices:
  - It enables shell variable expansion
  - The image becomes smaller
  - It makes the command run as root
  - The application becomes PID 1 and receives signals directly
  answer:
  - 3
  explain: 'A) Wrong: expansion is a property of the shell form. B) Wrong:
    the form does not change layer size. C) Wrong: the user is set by USER. D) Correct: the shell form wraps the program in sh -c, which often does not forward SIGTERM.'
- id: numeric-user
  prompt: Why use USER 10001:10001 instead of a user name?
  choices:
  - It avoids creating the user
  - Numeric users get more capabilities
  - Names are not allowed in Dockerfiles
  - Kubernetes can verify runAsNonRoot without resolving the name
  answer:
  - 3
  explain: 'A) Wrong: the account still needs to be able to own files; for files it does not need an entry. B) Wrong: capabilities are independent of the form of USER. C) Wrong: names are allowed. D) Correct:
    a numeric ID is checkable without reading /etc/passwd.'
- id: scratch-certs
  prompt: A Go service on scratch fails TLS handshakes with a certificate authority error. Why?
  choices:
  - Go cannot do TLS
  - The user is not root
  - scratch has no kernel
  - The image has no CA bundle
  answer:
  - 3
  explain: 'A) Wrong: Go has a full TLS stack but needs trust roots. B) Wrong: TLS verification does not depend on being root. C) Wrong: containers use the host kernel. D) Correct: copy ca-certificates.crt
    from the build stage or use distroless static.'
- id: layer-delete
  prompt: A secret was written in one RUN and removed in the next. Is it gone from the image?
  choices:
  - Only if the file name starts with a dot
  - Yes, deletion removes it from all layers
  - Only if the image is squashed with docker commit
  - No, it remains in the earlier layer
  answer:
  - 3
  explain: 'A) Wrong: file naming has no effect. B) Wrong: lower layers are immutable. C) Wrong: commit does not scrub earlier layer
    history. D) Correct: layers are append-only; a later delete only hides the file.'
- id: stage-purpose
  prompt: What is the main purpose of a multi-stage build?
  choices:
  - Avoid using a registry
  - Make COPY faster
  - Run stages on different hosts
  - Keep compilers and caches out of the runtime image
  answer:
  - 3
  explain: 'A) Wrong: stage output still
    goes to the registry if pushed. B) Wrong: COPY speed is unaffected. C) Wrong: stages run in one build, possibly in parallel. D) Correct: only the needed artefacts are copied into the final stage.'
- id: pin-digest
  prompt: What does pinning a base image by digest buy you?
  choices:
  - The exact same bytes on every build, until you deliberately update
  - Immunity from vulnerabilities in the base
  - Faster pulls
  - Automatic security updates
  answer:
  - 0
  explain: 'A) Correct: tags are mutable, digests are not. B) Wrong: a pinned vulnerable image stays vulnerable. C) Wrong: pull speed is unchanged. D) Wrong: pinned images need a bot or process to update.'
