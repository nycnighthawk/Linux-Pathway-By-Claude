title: 'Quiz: Docker Engine, BuildKit, Compose'
questions:
- id: socket-root
  prompt: Why is membership of the docker group equivalent to root on the host?
  choices:
  - The group can edit /etc/shadow
  - The daemon runs as root and will start a privileged container that mounts the host filesystem
  - The group may load kernel modules directly
  - Group members get sudo automatically
  answer:
  - 1
  explain: 'A) Wrong: the group has no file ACL on shadow. B) Correct: API access
    lets you create containers with host mounts and privileges. C) Wrong: module loading happens through a privileged container, not the group itself. D) Wrong: no sudo rule is created.'
- id: secret-mount
  prompt: Which instruction passes a secret to one RUN step without leaving it in the image?
  choices:
  - RUN --mount=type=secret,id=npm,target=/root/.npmrc
  - COPY .npmrc /root/.npmrc
  - ENV NPM_TOKEN
  - ARG NPM_TOKEN
  answer:
  - 0
  explain: 'A) Correct: the secret exists only for that step and is not stored in a layer. B) Wrong: COPY
    stores the file in a layer. C) Wrong: ENV persists in the image configuration. D) Wrong: ARG values appear in docker history.'
- id: cache-driver
  prompt: Which buildx driver do you need to export a registry cache and build multi-platform images?
  choices:
  - remote with no daemon
  - docker-container
  - none; any driver works
  - docker (the default with the classic store)
  answer:
  - 1
  explain: 'A) Wrong: remote needs a reachable BuildKit daemon. B) Correct: it runs a separate
    BuildKit that supports cache exporters and multi-platform output. C) Wrong: drivers differ in capability. D) Wrong: the built-in docker driver has limited exporter support.'
- id: depends-health
  prompt: 'What does depends_on with condition: service_healthy guarantee?'
  choices:
  - Both services share a network namespace
  - The dependent starts after the dependency's health check first passes
  - The dependency is restarted when the dependent fails
  - The dependency never becomes unhealthy later
  answer:
  - 1
  explain: 'A) Wrong: services share a network, not a namespace. B) Correct: it orders start-up only. C) Wrong: Compose does not restart dependencies for that reason. D) Wrong: health can change at any
    time, so the app must retry.'
- id: ufw-bypass
  prompt: Why can a published container port remain reachable after ufw deny incoming?
  choices:
  - Published ports use UDP only
  - Containers ignore netfilter
  - Docker adds NAT and accept rules in its own chains ahead of the host's rules
  - ufw does not support TCP
  answer:
  - 2
  explain: 'A) Wrong: port publishing works for TCP and UDP. B) Wrong: container traffic traverses
    netfilter. C) Correct: use 127.0.0.1 publishing or DOCKER-USER rules to control it. D) Wrong: ufw handles TCP normally.'
- id: cache-order
  prompt: Which ordering gives the best Docker build cache reuse for an application?
  choices:
  - Install dependencies last
  - Run apt-get update in a separate layer from install
  - Copy the dependency manifest, install, then copy the source
  - Copy the whole source, then install dependencies
  answer:
  - 2
  explain: 'A) Wrong: that would build with no dependencies available. B) Wrong: a stale update layer is cached and may serve outdated package lists. C) Correct: the expensive install layer is invalidated
    only when the manifest changes. D) Wrong: any source edit invalidates the install.'
