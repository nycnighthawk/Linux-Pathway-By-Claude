title: 'Quiz: C, Rust, Go and Python toolchains'
questions:
- id: go
  prompt: How do you build a Go program that has no libc dependency?
  choices:
  - go build -static-libc
  - GOOS=static go build
  - go vendor
  - CGO_ENABLED=0 go build
  answer:
  - 3
  explain: With cgo disabled the build uses only Go code and produces a static binary. The other settings are not Go options
    (-static-libc, GOOS=static) or concern dependency copying (vendor).
- id: rust
  prompt: Which rustc option links the C runtime statically on a glibc target?
  choices:
  - -C target-feature=+crt-static
  - -C opt-level=3
  - --emit=obj
  - -C debuginfo=0
  answer:
  - 0
  explain: crt-static selects static linking of the C runtime. Optimisation level, emitted artefacts and debug information
    do not change linkage.
- id: venv
  prompt: Why create a virtual environment for a Python project?
  choices:
  - To compile Python to machine code
  - To isolate its dependencies from the system interpreter's packages
  - To make pip faster
  - To remove the need for pyproject.toml
  answer:
  - 1
  explain: venv gives each project its own site-packages. It does not compile code, speed up pip or replace project metadata.
- id: lock
  prompt: What is the purpose of Cargo.lock or go.sum style lock data?
  choices:
  - To speed up compilation only
  - To license the code
  - To pin exact dependency versions and hashes so builds repeat
  - To list installed system packages
  answer:
  - 2
  explain: Lock files record the resolved graph and content hashes. Speed is a side effect at most, and they say nothing about
    licences or system packages.
- id: glibc
  prompt: A Rust binary built on a new distribution fails on an old one with a glibc version error. Which fix works?
  choices:
  - Add more cargo features
  - Run cargo clean
  - Use cargo fmt
  - Build in an environment with an older glibc, or target musl for a static binary
  answer:
  - 3
  explain: The dynamic symbol versions come from the build machine's libc. Building on an older base or linking statically
    avoids it. Features, cleaning and formatting do not change the libc requirement.
