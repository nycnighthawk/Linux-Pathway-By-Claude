id: LNX-220
title: Linux Application Development
summary: 'Building, debugging, testing, packaging and profiling native Linux software: gcc and clang, ELF and shared libraries,
  gdb, sanitizers and fuzzing, Rust, Go and Python toolchains, systemd and D-Bus integration, RPM, DEB, Flatpak and OCI packaging,
  perf, and GUI programs under Xvfb.'
hours: 60
coverage: full
outcomes:
- Build, link and harden C programs and read the ELF files they produce
- Write Makefile, CMake and Meson builds that track dependencies and stage installs
- Create and consume versioned shared libraries and pkg-config metadata
- Debug crashes, hangs and memory errors with gdb, core dumps, valgrind and sanitizers
- Test code with unit tests, coverage and fuzzing, and turn crashes into regression tests
- Compare the C, Rust, Go and Python toolchains and their linkage
- Write services that use systemd readiness, socket activation, the journal, D-Bus and XDG directories
- Package applications as RPM, DEB, Flatpak and OCI images and profile them with perf and callgrind
certifications:
- cert: EX188
  objectives:
  - D1
