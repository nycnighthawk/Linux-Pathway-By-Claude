id: LNX-404
title: 'Capstone: Upstream-Quality Kernel Work'
summary: A graded, multi-stage project for the kernel pathway. You write a driver for a QEMU device with KUnit-style tests,
  prepare a patch series that passes style checks and boots on x86_64 and arm64, bisect and fix a planted regression, take
  a real change through a mailing-list review, bring the work up on a development board and run a multi-day syzkaller campaign.
  Three stages are graded in CI; three are guided evidence stages.
hours: 100
coverage: full
outcomes:
- Separate register access from driver logic so that the logic can be unit tested, and return kernel-style errors
- 'Decide whether a patch series is ready: every commit builds on each architecture, style is clean and the final tree boots'
- Find a regression by binary search with skipped commits, and fix it with a regression test and a Fixes tag
- Take a small change through a public review cycle and answer each comment
- Bring a kernel and driver up on a real board with a serial console and record what differs from the emulator
- Run, triage and report from a multi-day kernel fuzzing campaign
