id: LNX-101
title: Linux Foundations & the Command Line
summary: 'The vocabulary, tools and habits of working at a Linux prompt: the shell, files and permissions, text processing, editing, archiving
  and finding help.'
hours: 40
coverage: full
outcomes:
- Explain what a distribution is and what the main licence families require of someone who redistributes software
- Move around the file tree and name sets of files with globs, quoting every expansion correctly
- Build pipelines from grep, sed, awk, cut, sort, uniq, tr and xargs and wire streams with redirection and tee
- Write and debug basic and extended regular expressions
- Edit files with vim or nano and set the editor that other tools launch
- Read and set permissions, ownership, umask and the special bits, and reason about who can access a file
- Archive, compress and restore a directory tree without losing links, modes or ownership
- Find the right manual page, option or example without leaving the terminal
