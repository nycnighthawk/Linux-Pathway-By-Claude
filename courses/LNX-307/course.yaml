id: LNX-307
title: Observability, Performance & Troubleshooting
summary: 'A method for finding what is wrong with a Linux system: USE and RED, the sysstat counters, Prometheus and Grafana,
  central logging, strace, perf and eBPF, kdump, OOM and cgroups v2, break/fix drills, reliable benchmarks and on-call practice.'
hours: 50
coverage: full
outcomes:
- Apply the USE and RED methods and write runbooks tied to alerts
- Read sysstat counters and name the bottleneck resource and process
- Write Prometheus queries and alert rules and route notifications
- Ship, store and query logs centrally with journald and rsyslog
- Trace behaviour and performance with strace, perf and eBPF tools
- Capture and read a kernel crash with kdump and crash
- Diagnose OOM kills and set cgroup v2 limits
- Benchmark reliably and run an incident as an on-call engineer
