      - https://learn.microsoft.com/en-us/windows-server/administration/openssh/openssh_server_configuration
    allow: ["https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/", "https://learn.microsoft.com/en-us/windows-server/administration/openssh/"]
    max_pages: 200
