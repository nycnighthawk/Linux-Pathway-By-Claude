    mode: full
    reuse: adapt
    stream: A-compatible

  - id: freeipa-docs
    name: FreeIPA documentation
    kind: crawl
    seeds: ["https://freeipa.readthedocs.io/en/latest/"]
    allow: ["https://freeipa.readthedocs.io/en/latest/"]
    deny_regex: '/(_sources|_static|_images)/'
    max_pages: 200
    content_selector: "div[role=main]"
    url: https://freeipa.readthedocs.io/
    license: NOASSERTION
    license_basis: "Site shows '© FreeIPA Contributors' with no open licence; headings only (D-019, same rule as D-006)."
