    reuse: link-only
    stream: Ref

  - id: lfd103
    name: "LFD103 A Beginner's Guide to Linux Kernel Development (course page)"
    kind: crawl
    seeds: ["https://training.linuxfoundation.org/training/a-beginners-guide-to-linux-kernel-development-lfd103/"]
    allow: ["https://training.linuxfoundation.org/training/a-beginners-guide-to-linux-kernel-development-lfd103/"]
    max_pages: 1
    url: https://training.linuxfoundation.org/training/a-beginners-guide-to-linux-kernel-development-lfd103/
    license: Proprietary
    license_basis: "Public course page only; the course itself needs enrolment. Headings only (D-019)."
    mode: outline
    reuse: link-only
    stream: Ref

  # ---- T1a: virtualization sources for the VIRT pathway (D-028) ----
  - id: qemu-docs
    name: QEMU documentation (system emulation, devel, interop, specs)
    kind: git
    repo: https://github.com/qemu/qemu
    include: ["/docs/**/*.rst", "/docs/**/*.txt", "/COPYING"]
    exclude_regex: '(^|/)(conf|requirements)\.|\.inc$'
    url_template: "https://www.qemu.org/docs/master/{path_no_ext_strip_docs}.html"
    license: GPL-2.0-only
    license_note: "COPYING is GPL-2.0; most docs/ files carry no separate notice, so the project licence applies. Link-only."
    mode: full
    reuse: link-only
    stream: C
    pin: e9fa1f66f0d47c74b6766e1b8b87ad7c2a9394d5

  - id: libvirt-docs
    name: libvirt documentation (website sources)
    kind: git
    repo: https://github.com/libvirt/libvirt
    include: ["/docs/*.rst", "/docs/kbase/**/*.rst", "/docs/manpages/*.rst", "/COPYING.LESSER"]
    url_template: "https://libvirt.org/{path_no_ext_strip_docs}.html"
    license: LGPL-2.1-or-later
    license_file: COPYING.LESSER
    license_note: "libvirt is LGPL-2.1+ (docs/governance.rst); the website sources carry no separate licence. Link-only."
    mode: full
    reuse: link-only
    stream: C
    pin: ed41b1f053fe1d6d279908ffdc1e376174fbf9d5

  - id: virtualbox-docs
