    url_template: "https://www.virtualbox.org/manual/{stem}.html"
    license: GPL-3.0-only
    license_note: "VirtualBox base packages are GPL-3.0-only (dual CDDL-1.0 for part of the code). The manual sources carry no separate licence. The SDK reference is doc/manual/en_US/SDKRef.xml. Link-only."
    mode: full
    reuse: link-only
    stream: C
    pin: b6bea72111fcff48f31c57c9f66365b1d3301bb9

  - id: rust-vmm-community
    name: rust-vmm community documentation
    kind: git
    repo: https://github.com/rust-vmm/community
    include: ["/*.md", "/docs/**/*.md"]
    url_template: "https://github.com/rust-vmm/community/blob/main/{path}"
    license: NOASSERTION
    license_note: "The community repo has no LICENSE file; rust-vmm crates are Apache-2.0 OR BSD-3-Clause, but this repo's text is not declared. Headings only (D-006)."
    mode: outline
    reuse: link-only
