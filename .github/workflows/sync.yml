name: sync-sources

# Re-syncs upstream sources and opens a PR (D-009). Each trigger touches only the sources it names:
#   weekly  (Mon) -> repo/file sources: git, rhel-html, oscal, http-pdf, stig, arch-pkg
#   monthly (1st) -> crawl sources (Playwright); kept less frequent to be polite to the sites
#   manual        -> pick source ids and/or a kind; Chromium is installed only if a crawl source is selected
on:
  schedule:
    - cron: "17 7 * * 1"     # weekly, Mondays 07:17 UTC
    - cron: "43 8 1 * *"     # monthly, 1st of the month 08:43 UTC
  workflow_dispatch:
    inputs:
      sources:
        description: "Space-separated source ids (blank = use 'kind')"
        required: false
        default: ""
      kind:
        description: "Source kind when no ids are given"
        type: choice
        default: repo
        options: [repo, crawl, all]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: tools
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false        # sync rewrites figures from upstream; git-lfs turns them back into identical pointers
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt && git lfs install --local
      - name: Choose sources
        id: pick
        run: |
          ids="${{ github.event.inputs.sources }}"
          kind="${{ github.event.inputs.kind }}"
          if [ "${{ github.event.schedule }}" = "43 8 1 * *" ]; then kind=crawl; fi
          if [ -z "$kind" ]; then kind=repo; fi
          if [ -z "$ids" ]; then
            case "$kind" in
              crawl) ids=$(bin/lpc list -k crawl --ids) ;;
              repo)  ids=$(bin/lpc list -k git -k rhel-html -k oscal -k http-pdf -k stig -k arch-pkg --ids) ;;
              all)   ids=$(bin/lpc list --ids) ;;
            esac
          fi
          crawl_ids=" $(bin/lpc list -k crawl --ids) "
          need_browser=false
          for i in $ids; do case "$crawl_ids" in *" $i "*) need_browser=true ;; esac; done
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "browser=$need_browser" >> "$GITHUB_OUTPUT"
          echo "Selected: $ids (browser: $need_browser)"
      - name: Tools for selected sources
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          if [ "${{ steps.pick.outputs.browser }}" = "true" ]; then
            pip install playwright && python -m playwright install --with-deps chromium
          fi
      - name: Sync
        run: |
          args=""; for s in ${{ steps.pick.outputs.ids }}; do args="$args -s $s"; done
          bin/lpc sync --update $args
      - run: bin/lpc gate
      - run: bin/lpc build
      - name: Summarise changes
        id: sum
        run: |
          {
            echo 'body<<EOF'
            echo "Automated re-sync of: \`${{ steps.pick.outputs.ids }}\`"
            echo
            echo '```'
            git diff --stat -- sources.yaml raw catalog | tail -25
            echo '```'
            grep -h "review_flag" raw/*/SOURCE.yaml && echo "⚠️ Licence review flags above need a decision (see RUBRIC.md)." || true
            grep -l "blocked:" raw/*/SOURCE.yaml >/dev/null 2>&1 && echo "Some crawl pages were blocked; see the 'blocked' list in raw/<id>/SOURCE.yaml." || true
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: sync/upstream-${{ github.run_id }}
          commit-message: "sync: re-pin upstream sources"
          title: "sync: upstream re-sync (${{ steps.pick.outputs.ids }})"
          body: ${{ steps.sum.outputs.body }}
          labels: sync
