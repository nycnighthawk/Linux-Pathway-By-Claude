# Source priors: added to a course's score for every chunk from that source.
# A prior of 6 or more tags the chunk even with no keyword hits; use that only where
# the whole source belongs to the course (e.g. kernel process docs -> LNX-330).
source_priors:
  kubernetes-docs: {LNX-311: 4, LNX-312: 2, LNX-313: 2, LNX-314: 1}
  bootlin-training: {LNX-331: 4, LNX-330: 2}
  kernel-docs: {LNX-330: 6}
  lkmpg: {LNX-331: 6}
  compliance-as-code: {LNX-204: 3, LNX-303: 3}
  disa-stig: {LNX-303: 4, LNX-204: 3}
  nist-sp800-53: {LNX-303: 6}
  nist-sp800-guides: {LNX-303: 3, LNX-204: 3}

# Tagging thresholds (implementation constants, documented here so they're reviewable).
thresholds:
  assign: 6          # minimum score to tag a course
  relative: 0.5      # also must be >= relative * top score
  max_courses: 3
  high: 14           # confidence bands on the top score
  medium: 8
