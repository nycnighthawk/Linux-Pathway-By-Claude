justification: "Checked upstream on 2026-11-14. Python documentation is under the PSF licence, a permissive BSD-style licence (stream Permissive, adapt). The Rust Book is MIT OR Apache-2.0 (Permissive, adapt). The ClusterLabs Pacemaker guides state CC-BY-SA-4.0 in their Sphinx configuration; the repository has no separate documentation licence file, so the sync writes a notice and the licence basis is recorded in sources.yaml (stream A, adapt). The git/git Documentation is GPL-2.0, so it is stored for search but link-only. The Pro Git book is CC BY-NC-SA and must not be stored (D-004), so it is excluded."
date: '2026-11-14'
