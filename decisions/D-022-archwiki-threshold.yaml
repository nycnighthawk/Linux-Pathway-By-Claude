chosen: 'Title score >= 4 (strong or two keyword hits): 89 pages'
justification: A sample of the lower threshold was mostly off-curriculum (e.g. Apache OpenOffice, Apache Spark,
  ALSA sound pages matched generic words), which hurts curriculum fit (R2) and search precision (R4). The threshold
  is a single setting (min_title_score in sources.yaml) and can be lowered once taxonomy keywords are sharpened.
